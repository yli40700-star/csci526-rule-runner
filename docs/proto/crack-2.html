<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build the Bridge</title>
<style>
  /* Colors from Theme (UIKit.cs) and Palette.cs in the game. */
  :root {
    --bg:#141922; --surface:#1e2531; --surface2:#283041; --raised:#343e53; --raised-hover:#3f4a62; --line:#3a4459;
    --text:#eef1f5; --dim:#8d97aa; --faint:#5d677a; --accent:#43b86a; --gold:#f5c542; --not:#ff6b4a; --qi:#4fd6e8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Helvetica Neue",Arial,sans-serif; user-select:none; }
  #app { max-width:820px; margin:0 auto; padding:12px 16px 24px; }
  #top { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border-radius:12px 12px 0 0; border-bottom:1px solid var(--line); }
  .btn { background:var(--raised); color:var(--dim); border:none; border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; font-weight:bold; cursor:pointer; }
  .btn:hover { background:var(--raised-hover); }
  .chip { background:var(--gold); color:var(--bg); border-radius:8px; padding:5px 10px; font-weight:bold; font-size:14px; }
  #dots { display:flex; gap:7px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--raised); }
  .dot.on { background:var(--gold); } .dot.done { background:var(--accent); }
  #hint { flex:1; margin:0 6px; background:var(--surface2); color:var(--text);
          border:1px solid var(--gold); border-radius:10px; padding:7px 12px; font-size:13px; text-align:center; visibility:hidden; }

  #hintBtn { display:none; background:var(--gold); color:var(--bg); }
  #banner { position:absolute; left:50%; top:12px; transform:translateX(-50%); max-width:70%; background:#141922e6; border:1px solid var(--gold); color:var(--gold);
            border-radius:10px; padding:8px 14px; font-size:14px; text-align:center; display:none; z-index:3; }
  #nudge { position:absolute; right:84px; top:6px; color:var(--gold); font-size:13px; font-weight:bold; display:none; animation:bob 1s ease-in-out infinite; z-index:3; }
  @keyframes bob { 50% { transform:translateY(-5px); } }
  #stage { position:relative; background:var(--surface); border-radius:0 0 12px 12px; overflow:hidden; }
  canvas { width:100%; display:block; }

  /* The skill card. Same parts as RuleCardView: band, IF, divider, THEN, footer. */
  .card { width:120px; background:var(--surface2); border-radius:12px; padding:5px; box-shadow:0 5px 10px #0008; border:2px solid transparent; transition:border-color .15s, box-shadow .15s, opacity .2s; }
  .card .band { height:22px; border-radius:7px; display:flex; align-items:center; padding:0 4px; transition:background .2s; }
  .card .band .n { width:17px; height:17px; border-radius:50%; background:#0000005a; font-size:11px; font-weight:bold; display:grid; place-items:center; }
  .card .sec { border-radius:8px; padding:2px 4px 4px; margin-top:4px; transition:background .15s, box-shadow .15s; }
  .card .lab { display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:bold; color:var(--dim); height:16px; }
  .card .dia { display:flex; justify-content:center; height:40px; }
  .card .dia svg { width:84px; height:40px; }
  .card .name { text-align:center; font-size:11px; min-height:14px; color:var(--text); }
  .card .then .name { font-weight:bold; font-size:12px; }
  .card .div { height:1px; background:var(--line); margin:3px 10px 0; }
  .card .sec.empty .dia { border:2px dashed var(--faint); border-radius:8px; margin:0 6px; }
  .card .sec.lit { background:#f5c54233; box-shadow:inset 0 0 0 2px var(--gold); }
  .card .sec.miss { background:#e04f4f26; box-shadow:inset 0 0 0 2px #e04f4f; }
  #bubble .card { position:relative; transition:opacity .2s, filter .2s, border-color .15s, box-shadow .15s; }
  #bubble .card.unread { opacity:.3; filter:grayscale(1); }
  #bubble .card.never { opacity:.22; filter:grayscale(1); border:2px dashed var(--faint); }
  #bubble .card.reading { border-color:#fff; box-shadow:0 0 14px #ffffff88; }
  .card .sec.if { position:relative; }
  .badge { position:absolute; top:50%; left:-13px; margin-top:-11px; width:22px; height:22px; border-radius:50%; display:none; place-items:center;
           font-size:14px; font-weight:bold; color:#fff; z-index:2; box-shadow:0 2px 6px #0008; }
  .badge.yes { display:grid; background:var(--accent); }
  .badge.no { display:grid; background:#e04f4f; }
  #reader { position:absolute; bottom:-16px; width:0; height:0; margin-left:-9px; border:9px solid transparent; border-bottom-color:#fff; display:none;
            transition:left .18s ease-out; filter:drop-shadow(0 0 4px #fff); }
  .card.skip { opacity:.35; }
  .card .sec.starve { background:#e04f4f33; box-shadow:inset 0 0 0 2px #e04f4f; }
  .card .band .cost { margin-left:auto; display:flex; gap:3px; }
  .pip { width:9px; height:9px; border-radius:50%; background:var(--qi); box-shadow:0 0 4px #4fd6e8aa; display:inline-block; }
  .opt .cost { display:flex; gap:3px; justify-content:center; }
  #energy { position:absolute; right:14px; top:12px; display:none; align-items:center; gap:6px; background:var(--surface2); border-radius:10px; padding:6px 10px;
            font-size:12px; font-weight:bold; color:var(--qi); letter-spacing:.5px; }
  #energy .pip { width:14px; height:14px; transition:background .2s, box-shadow .2s; }
  #energy .pip.used { background:var(--raised); box-shadow:none; }
  #energy { transition:transform .2s, box-shadow .2s; }
  #energy.spend { transform:scale(1.35); transform-origin:right top; box-shadow:0 0 0 2px var(--qi), 0 0 18px #4fd6e8aa; }
  #energy.spend::after { content:attr(data-spent); position:absolute; right:4px; top:100%; margin-top:4px; color:var(--qi); font-size:16px; }
  .band .cost.spend .pip { transform:scale(1.5); box-shadow:0 0 8px #4fd6e8; }
  .band .cost .pip { transition:transform .2s; }
  #energy.flash { animation:eflash .3s 3; }
  @keyframes eflash { 50% { background:#e04f4f; color:#fff; } }
  .card.win { border-color:var(--gold); box-shadow:0 0 22px #f5c542aa; }
  .card .foot { display:flex; justify-content:space-between; margin-top:5px; }
  .card .foot .btn { padding:3px 10px; font-size:13px; color:var(--text); }
  .notchip { cursor:pointer; font-size:10px; padding:1px 6px; border-radius:7px; background:var(--raised); color:var(--dim); }
  .notchip.on { background:var(--not); color:#fff; }
  #bubble { position:absolute; transform:translate(-50%,-100%); pointer-events:none; display:flex; gap:6px; }
  #bubble::after { content:""; position:absolute; left:50%; bottom:-11px; transform:translateX(-50%); border:7px solid transparent; border-top-color:var(--surface2); }
  .shake { animation:shake .45s; }
  @keyframes shake { 0%,100% { translate:0 } 20% { translate:-7px } 40% { translate:7px } 60% { translate:-5px } 80% { translate:5px } }

  /* Loadout: the cards; tapping IF or THEN opens a picker like OptionPicker. */
  #panel { margin-top:12px; background:var(--surface); border-radius:12px; padding:12px 14px; min-height:150px; }
  #panel .title { color:var(--gold); font-size:13px; font-weight:bold; margin-bottom:8px; }
  #panel .loadout { display:flex; align-items:flex-start; gap:12px; }
  #panel .card.big { width:156px; transition:transform .3s; }
  #panel .card.big .sec { cursor:pointer; }
  #panel .card.big .sec:hover { background:#ffffff12; }
  #panel .card.big.locked .sec, #panel .card.big.lockif .sec.if { cursor:default; }
  #panel .card.big.lockif .sec.if:hover { background:none; }
  #panel .card.big.lockif .notchip { cursor:default; }
  #panel .card.big.locked .sec:hover { background:none; }
  #panel .card.big .dia svg { width:96px; height:44px; }
  #panel .card.big .dia { height:46px; }
  #panel .card.big .name { font-size:13px; }
  #panel.off .card.big .sec, #panel.off .card.big .foot { pointer-events:none; }
  .opt { width:110px; height:84px; background:var(--surface2); border:2px solid transparent; border-radius:12px; cursor:pointer; color:var(--text);
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:inherit; font-size:12px; font-weight:bold; padding:0; transition:transform .12s, border-color .12s; }
  .opt svg { width:84px; height:40px; }
  .opt span { text-align:center; padding:0 4px; }
  .opt:hover { background:var(--raised-hover); }
  .opt.sel { border-color:var(--gold); background:var(--raised-hover); }
  .pulse { animation:pulse 1.1s ease-in-out infinite; }
  .opt.pulse { border-color:var(--gold); }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 #f5c54200; } 50% { box-shadow:0 0 0 6px #f5c54299; } }
  #picker { position:fixed; inset:0; background:#0008; display:none; place-items:center; z-index:15; }
  #picker .box { background:var(--surface); border-radius:16px; padding:16px 18px 14px; box-shadow:0 10px 30px #000a; max-width:94vw; }
  #picker h3 { margin:0 0 12px; color:var(--gold); font-size:16px; font-weight:normal; }
  #picker .grid { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #picker .cancel { display:block; margin:12px auto 0; color:var(--text); }
  #newIntro, #notIntro { position:fixed; inset:0; background:#0009; display:none; place-items:center; z-index:20; }
  #newIntro .box, #notIntro .box { background:var(--surface); border-radius:16px; padding:18px 20px 16px; width:min(440px,92vw); box-shadow:0 10px 30px #000a; }
  #newIntro h3, #notIntro h3 { margin:0 0 12px; color:var(--gold); font-size:16px; }
  #newIntro .demo, #notIntro .demo { display:flex; align-items:center; justify-content:center; gap:16px; }
  #newIntro .eq, #notIntro .eq { font-size:26px; color:var(--dim); font-weight:bold; }
  #newIntro p, #notIntro p { color:var(--dim); font-size:13px; text-align:center; margin:14px 0 12px; }
  #notIntro .card { width:132px; position:relative; }
  #finger { position:absolute; width:26px; height:26px; border-radius:50%; background:#fff; border:2px solid #000a; pointer-events:none; transition:transform .35s, opacity .2s; }
  #newIntro .opt { height:auto; min-height:84px; padding:8px 4px; }
  #newIntro .ok, #notIntro .ok { display:block; margin:0 auto; }
  #nudge { top:52px; right:18px; }
  #top .tag { border:1px solid var(--gold); color:var(--gold); border-radius:8px; padding:4px 8px; font-size:11px; font-weight:bold; letter-spacing:1px; }
  #goals { display:flex; gap:16px; padding:7px 12px; background:var(--surface); border-bottom:1px solid var(--line); font-size:12px; color:var(--dim); flex-wrap:wrap; }
  #goals .g { display:flex; align-items:center; gap:5px; }
  .star { color:var(--raised); font-size:16px; } .star.on { color:var(--gold); }
  .andbtn { display:block; margin:4px auto 0; font-size:11px; padding:2px 10px; }
  .anddiv { display:flex; align-items:center; gap:6px; margin:4px 6px 0; font-size:11px; font-weight:bold; color:var(--gold); }
  .anddiv::before, .anddiv::after { content:""; flex:1; height:1px; background:var(--line); }
  .anddiv .btn { padding:0 6px; font-size:11px; }
  .pip.and { background:var(--gold); box-shadow:0 0 4px #f5c542aa; }
  #bubble .card { width:104px; }
  #bubble .card .dia { height:30px; } #bubble .card .dia svg { width:64px; height:30px; }
  #bubble .card .name { font-size:10px; } #bubble .notchip, #bubble .andbtn { display:none; }
  #panel .title { display:flex; align-items:center; gap:10px; }
  .sols { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; font-size:13px; color:var(--dim); }
  #panel .title .btn { margin-left:auto; } #panel .title .btn + .btn { margin-left:0; }
  #result { position:absolute; inset:0; background:#0009; display:none; place-items:center; z-index:5; }
  #result .box { background:var(--surface); border-radius:16px; padding:18px 22px; min-width:300px; text-align:center; box-shadow:0 10px 30px #000a; }
  #result h3 { margin:0 0 10px; color:var(--gold); }
  #result .rows { text-align:left; margin:10px 0 14px; font-size:13px; }
  #result .rows div { display:flex; align-items:center; gap:8px; padding:3px 0; color:var(--dim); }
  #result .rows div.on { color:var(--text); }
  #result .rows .star { font-size:20px; }
</style></head><body>
<div id="app">
  <div id="top"><button class="btn">&lt; Levels</button><span class="chip" id="lvl">K-2</span><span class="tag">CHALLENGE</span><b id="ttl"></b><div id="hint"></div><button class="btn" id="hintBtn">Hint</button></div>
  <div id="goals"></div>
  <div id="stage">
    <canvas id="cv" width="760" height="560"></canvas>
    <div id="bubble"></div>
    <div id="banner"></div>
    <div id="nudge">Stuck? Try a hint &uarr;</div>
    <div id="energy">ENERGY <span id="pips"></span></div>
    <div id="result"><div class="box"><h3 id="resTitle">Clear!</h3><div id="resStars" style="font-size:34px"></div><div class="rows" id="resRows"></div>
      <button class="btn" id="resEdit">Edit cards</button> <button class="btn" id="resAgain">Watch again</button></div></div>
  </div>
  <div id="panel"></div>
</div>
<div id="picker"><div class="box"><h3 id="pickTitle"></h3><div class="grid" id="pickGrid"></div><button class="btn cancel" id="pickCancel">Cancel</button></div></div>
<div id="newIntro">
  <div class="box">
    <h3 id="newTitle"></h3>
    <div class="demo"><div class="opt" id="jumpOpt" style="pointer-events:none"></div><div class="eq" id="newEq">&rarr;</div><div class="opt sel" id="bigOpt" style="pointer-events:none"></div></div>
    <p id="newText"></p>
    <button class="btn ok" id="newOk">Got it</button>
  </div>
</div>
<script>
// SIM-BEGIN
// The simulator. Same step order and costs as Simulator.cs, plus two floors (as in routes.html) and the elevator.
// rows[0] is the top floor, rows[1] the bottom floor. Tiles: g ground, p pit/hole, s spike, w low wall,
// o Energy orb, f flag, F gold flag, E elevator (bottom row), . no floor (bottom row), c cracked ground (either floor).
// Cracked ground (c): cards see it as ground. It breaks when the runner leaves it after standing on it (walking onto it
// or landing on it counts, jumping over it does not). After that it is a hole: on the top floor a drop to the bottom
// floor, on the bottom floor a deadly pit.
// Elevator (E, bottom row only, goes up once and stays). The platform rests on the bottom floor; the top tile above it
// is a hole. Walking onto it, or landing a jump on it, on the bottom floor lifts the runner up: the platform fills the
// hole and stays there for good as plain ground (a bridge). The bottom tile it left is plain ground.
// Falling through the hole onto the platform does not lift. Riding is free; cards see the platform as ground.
const SIM = (() => {
  const COST = { walk:0, jump:1, bigjump:3, turn:1 };
  const AND_EXTRA = 1, ORB = 2, MAX_STEPS = 90;
  const standable = c => c === 'g' || c === 'c' || c === 'o' || c === 'f' || c === 'F' || c === 'E';
  const isWall = c => c === 'w' || c === 'H';
  const isHole = c => c === 'p' || c === '.';
  const cardCost = c => COST[c.then] + (c.if2 ? AND_EXTRA : 0);

  function makeWorld(level) {
    const rows = level.rows.map(r => r.split(''));
    const elev = {};  // column -> floor the platform is on
    rows.forEach((r, l) => r.forEach((c, i) => { if (c === 'E') { elev[i] = l; r[i] = 'g'; } }));
    return { rows, elev };
  }
  /** Tile on floor l at column i, as the runner sees it. Outside the map is a high wall. */
  function tile(w, l, i) {
    const r = w.rows[l];
    if (i < 0 || i >= r.length) return 'H';
    if (i in w.elev) return w.elev[i] === l ? 'E' : l === 0 ? 'p' : 'g';  // platform up: the tile it left is ground
    return r[i];
  }
  function test(w, cond, l, x, dir) {
    const a = tile(w, l, x + dir);
    switch (cond) {
      case 'ground': return standable(a);
      case 'pit': return isHole(a);
      case 'spike': return a === 's';
      case 'wall': return isWall(a);
      case 'ground2': return standable(tile(w, l, x + 2 * dir));
    }
    throw new Error('cond ' + cond);
  }
  const ready = c => c && c.if && c.then;
  function holds(w, c, l, x, dir) {
    let ok = test(w, c.if, l, x, dir) !== !!c.not;
    if (ok && c.if2) ok = test(w, c.if2, l, x, dir) !== !!c.not2;
    return ok;
  }

  /** Runs the level. Returns the outcome and one frame per step (the view plays the frames back). */
  function run(level, cards) {
    const w = makeWorld(level);
    let x = level.start, l = level.floor || 0, dir = level.dir || 1, qi = level.energy;
    const res = { outcome:'timeout', frames:[], gold:false, orbs:0, hits:cards.map(() => 0), starved:false, floors:[l] };
    for (let t = 0; t < MAX_STEPS; t++) {
      const f = { t, xBefore:x, lBefore:l, dirBefore:dir, qiBefore:qi, fired:-1, starve:-1, action:'walk',
        checks:cards.map(c => ready(c) ? holds(w, c, l, x, dir) : null), events:[] };
      // 1. The first ready card whose IF holds acts, if it can pay; otherwise it does nothing and the runner walks.
      for (let i = 0; i < cards.length; i++) {
        if (!f.checks[i]) continue;
        const cost = cardCost(cards[i]);
        if (qi >= cost) { f.action = cards[i].then; qi -= cost; f.fired = i; res.hits[i]++; }
        else { f.starve = i; res.starved = true; }
        break;
      }
      // 2. Perform it.
      let outcome = 'running';
      const act = f.action;
      if (act === 'turn') dir = -dir;
      else {
        const span = act === 'walk' ? 1 : act === 'jump' ? 2 : 3;
        let blocked = false;
        for (let k = 1; k < span; k++) if (tile(w, l, x + k * dir) === 'H') blocked = true;
        const land = x + span * dir;
        if (blocked || isWall(tile(w, l, land))) f.blocked = true;
        else {
          // Leaving cracked ground: it breaks and is a hole from now on.
          if (!(x in w.elev) && w.rows[l][x] === 'c') { w.rows[l][x] = 'p'; f.crack = { l, col:x }; }
          x = land; outcome = enter(w, res, f, () => l, v => { l = v; }, x, () => qi, v => { qi = v; }, true); }
      }
      Object.assign(f, { x, l, dir, qi, outcome });
      res.frames.push(f);
      if (outcome !== 'running') { res.outcome = outcome; break; }
    }
    res.qi = qi;
    res.steps = res.frames.length;
    res.end = { x, l };
    return res;
  }

  /** What happens when the runner enters column x on its floor (walking or landing a jump). */
  function enter(w, res, f, getL, setL, x, getQi, setQi, moved) {
    let l = getL();
    let c = tile(w, l, x);
    if (c === 'E' && l === 1) {
      // Lift: the platform carries the runner up into the hole above and stays there. Free. It never lifts again.
      const to = 0;
      w.elev[x] = to;
      setL(to);
      res.floors.push(to);
      f.events.push({ kind:'ride', from:l, to });
      return 'running';
    }
    if (isHole(c) && l === 0) {
      // A hole in the top floor: drop to the bottom floor. Landing on a platform down there does not ride it.
      setL(1); l = 1;
      res.floors.push(1);
      f.events.push({ kind:'fall' });
      c = tile(w, l, x);
      if (c === 'E') return 'running';
    }
    if (isHole(c)) return 'pit';
    if (c === 's') return 'spike';
    if (c === 'f') return 'win';
    if (c === 'F') { res.gold = true; return 'win'; }
    if (c === 'o') { setQi(getQi() + ORB); w.rows[l][x] = 'g'; res.orbs++; f.events.push({ kind:'orb' }); }
    return 'running';
  }

  return { run, tile, makeWorld, standable, cardCost, COST, holds, test };
})();
// SIM-END

// LEVEL-BEGIN
// K-2 Build the Bridge. One idea: the elevator is not a ride to the gold flag, it is the bridge.
//  Top floor:    start, a gap two tiles wide (the hole over the elevator at col 4, a plain hole at col 5), the gold flag.
//                A Jump can't clear two tiles. Once the elevator is up, one tile is left and a Jump clears it.
//  Bottom floor: elevator (col 4), cracked ground (col 5), spike, ground, low wall, normal flag.
//  Falling into the gap never lifts the elevator. The runner has to step onto it from the bottom floor, and the only
//  side it can come from is the right, so it rides up facing left, away from the gold flag.
//  Gold: drop into the gap, Turn at the spike, step onto the elevator (the cracked tile breaks behind), ride up,
//  Turn at the left wall, walk back over the raised elevator, Jump the last hole.
//  The cracked tile is why "go further, turn at the wall, come back" fails: the way back is gone.
const LEVEL = {
  id:'K-2', title:'Build the Bridge',
  rows:['ggggppgggF', '....Ecsgwf'],
  start:1, dir:1, energy:5, slots:3,
  ifs:['pit', 'spike', 'wall'], thens:['jump', 'turn'], and:false,
  star2:{ kind:'energy', n:1 },
  hints:['Falling onto the elevator does nothing. It only lifts when you step onto it down on the bottom floor.',
    'The cracked floor lets you leave the elevator once. Go too far and you can\'t come back to it.',
    'The elevator stays up. Turn around on the top floor and walk back across it.'],
};
// LEVEL-END

const C = { qi:'#4fd6e8', ground:'#8a93a3', groundDark:'#5c6473', pit:'#0d1016', spike:'#e04f4f', wall:'#3d4555', finish:'#5cc96b', runner:'#f5d03b', eye:'#1d232e',
            gold:'#f5c542', not:'#ff6b4a', line:'#3a4459', walk:'#7d8798', jump:'#4c8dff', bigjump:'#9b6bff', elev:'#58b4c9' };
const T = 36, W = 760, H = 560, GYS = [330, 490];
let GY = GYS[0];

// ---------- card diagrams (as in routes.html) ----------
const X = i => i * 23 + 10;
function cell(i, kind, dim) {
  const a = dim ? 0.35 : 1;
  let s = `<rect x="${X(i) - 10}" y="28" width="20" height="8" rx="2" fill="${kind === 'p' ? C.pit : C.ground}" opacity="${kind === '?' ? 0.18 : a}"/>`;

const NAME = { ground:'Ground ahead', pit:'Pit ahead', spike:'Spike ahead', wall:'Wall ahead', ground2:'Ground 2 ahead', walk:'Walk', jump:'Jump', bigjump:'Big Jump', turn:'Turn' };
const DIST = { walk:1, jump:2, bigjump:3 };
const pips = (n, and) => '<span class="cost">' + '<i class="pip"></i>'.repeat(n) + (and ? '<i class="pip and"></i>' : '') + '</span>';
const condName = (cond, neg) => (neg ? 'NOT ' : '') + NAME[cond];
const ready = c => c && c.if && c.then;

function cardHTML(card, n, opts = {}) {
  const band = card.then ? C[card.then] : C.line;
  const chip = (k, on) => `<span class="notchip${on ? ' on' : ''}" data-not="${k}">${on ? 'NOT' : '+NOT'}</span>`;
  const badge = opts.badge ? '<span class="badge"></span>' : '';

  const cost = card.then ? pips(SIM.COST[card.then], !!card.if2) : '';
  const and = card.if2
    ? `<div class="anddiv">AND${opts.foot ? '<button class="btn" data-and="1">&times;</button>' : ''}</div>
       <div class="sec if2" data-sec="if2"><div class="lab">AND ${chip(2, card.not2)}</div><div class="dia">${condIcon(card.if2, card.not2)}</div><div class="name">${condName(card.if2, card.not2)}</div></div>`
    : opts.foot && card.if ? '<button class="btn andbtn" data-and="1">+ AND</button>' : '';
  return `<div class="band" style="background:${band}"><span class="n">${n}</span>${cost}</div>
    <div class="sec if${card.if ? '' : ' empty'}" data-sec="if">${badge}<div class="lab">IF ${chip(1, card.not)}</div><div class="dia">${condIcon(card.if, card.not)}</div><div class="name">${card.if ? condName(card.if, card.not) : ''}</div></div>
    ${and}<div class="div"></div>
    <div class="sec then${card.then ? '' : ' empty'}" data-sec="then"><div class="lab">THEN</div><div class="dia">${actIcon(card.then)}</div><div class="name">${card.then ? NAME[card.then] : ''}</div></div>${foot}`;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const bubble = document.getElementById('bubble'), panel = document.getElementById('panel');
const S = { cards:[], ghost:true, beam:null, hl:null, mark:null, won:false, lay:0, dir:1, elev:{}, elevOff:{}, broken:new Set(), crumble:{}, eaten:new Set(), energy:0, deaths:0, hintsShown:0, best:[false, false, false] };
const R = { x:0, y:0, fall:0, rot:0, alpha:1 };
let parts = [], floats = [], token = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const COLS = Math.max(...LEVEL.rows.map(r => r.length));
const offX = () => (W - COLS * T) / 2;
const px = i => offX() + i * T + T / 2;
try { const b = JSON.parse(localStorage.getItem('rr_crack_2_bridge') || 'null'); if (Array.isArray(b)) S.best = b; } catch (e) {}

function tween(ms, f, my) {
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now) {
      if (my !== token) return res();
      const k = Math.min(1, (now - t0) / ms);
      f(k);
      k < 1 ? setTimeout(() => step(performance.now()), 16) : res();  // timers, not frames: keeps running in a background tab
    })(t0);
  });
}

// ---------- goals, energy, cards ----------
function renderGoals() {
  const st = on => `<span class="star${on ? ' on' : ''}">&#9733;</span>`;
  document.getElementById('goals').innerHTML =
    `<span class="g">${st(S.best[0])} Reach a flag</span><span class="g">${st(S.best[1])} Finish with ${LEVEL.star2.n}+ Energy left</span><span class="g">${st(S.best[2])} Reach the gold flag</span>`;
}
function renderEnergy() {
  const e = document.getElementById('energy'), shown = Math.max(LEVEL.energy, S.energy);
  e.style.display = 'flex';
  document.getElementById('pips').innerHTML = Array.from({ length:shown }, (_, i) => `<i class="pip${i < S.energy ? '' : ' used'}"></i>`).join('');
}
function flashEnergy() { const e = document.getElementById('energy'); e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }
const headCards = () => [...bubble.querySelectorAll('.card')];
function renderCards() {
  const n = S.cards.length;
  bubble.innerHTML = S.cards.map((c, i) => `<div class="card">${cardHTML(c, i + 1, { badge:true })}</div>`).join('') + '<div id="reader"></div>';
  const used = S.cards.filter(ready).length;
  document.getElementById('cardCount').textContent = `CARDS ${used}/${LEVEL.slots}`;
  const lo = document.getElementById('loadout');
  lo.innerHTML = S.cards.map((c, i) => `<div class="card big" data-i="${i}">${cardHTML(c, i + 1, { foot:true, count:n })}</div>`).join('');
  lo.querySelectorAll('.card.big').forEach(el => {
    const i = +el.dataset.i;
    el.querySelectorAll('.sec').forEach(sec => sec.onclick = () => openPicker(i, sec.dataset.sec));
    el.querySelectorAll('.notchip').forEach(ch => ch.onclick = e => { e.stopPropagation(); edit(i, c => { const k = ch.dataset.not === '2' ? 'not2' : 'not'; c[k] = !c[k]; }); });
    el.querySelectorAll('[data-and]').forEach(b => b.onclick = e => { e.stopPropagation(); edit(i, c => {
      if (c.if2) { c.if2 = null; c.not2 = false; } else { c.if2 = LEVEL.ifs.find(k => k !== c.if); c.not2 = false; } }); });
    el.querySelectorAll('[data-move]').forEach(b => b.onclick = () => move(i, +b.dataset.move));
    el.querySelector('[data-clear]').onclick = () => edit(i, c => { Object.assign(c, { if:null, not:false, if2:null, not2:false, then:null }); });
  });
}
function clearLit() {
  bubble.querySelectorAll('.lit, .miss, .starve').forEach(e => e.classList.remove('lit', 'miss', 'starve'));
  bubble.querySelectorAll('.skip, .unread, .reading, .never').forEach(e => e.classList.remove('skip', 'unread', 'reading', 'never'));
  bubble.querySelectorAll('.badge').forEach(b => { b.className = 'badge'; b.textContent = ''; });
  const p = document.getElementById('reader'); if (p) p.style.display = 'none';
}
function resetRunner() {
  Object.assign(R, { x:px(LEVEL.start), y:0, fall:0, rot:0, alpha:S.ghost ? 0.55 : 1 });
  S.lay = LEVEL.floor || 0; GY = GYS[S.lay]; S.dir = LEVEL.dir;
  S.elev = { ...SIM.makeWorld(LEVEL).elev }; S.elevOff = {}; S.broken = new Set(); S.crumble = {};
  S.eaten = new Set(); S.beam = S.hl = S.mark = null;
  parts = []; floats = [];
  S.energy = LEVEL.energy; renderEnergy();
  clearLit();
}

// ---------- playing back the simulator's frames ----------
async function runOnce(my) {
  resetRunner();
  const res = SIM.run(LEVEL, S.cards);
  await sleep(500);
  let bumps = 0;
  for (const f of res.frames) {
    if (my !== token) return { r:'stop' };
    // Playback only: a runner that keeps bumping the same wall is stuck. Stop there instead of playing every bump.
    bumps = f.blocked ? bumps + 1 : 0;
    if (bumps > 2) { floats.push({ x:R.x, y:GY - 60, text:'Stuck', life:1 }); await sleep(600); return { r:'dead', res }; }
    const fire = f.fired >= 0 ? f.fired : f.starve, starved = f.starve >= 0;
    S.beam = { tile:f.xBefore + f.dirBefore, lit:fire >= 0 };
    if (f.fired >= 0 && f.action === 'walk') await sleep(40);
    else if (fire >= 0) { if (await readInOrder(f, fire, starved, my) === 'stop') return { r:'stop' }; }
    else await sleep(40);
    if (my !== token) return { r:'stop' };
    const cost = f.fired >= 0 ? SIM.cardCost(S.cards[f.fired]) : 0;
    if (cost > 0) {
      S.energy -= cost; renderEnergy();
      floats.push({ x:R.x, y:GY - 60, text:'-' + cost, life:1 });
      const e = document.getElementById('energy'); e.dataset.spent = '-' + cost; e.classList.add('spend');
      const cc = headCards()[f.fired].querySelector('.band .cost'); cc.classList.add('spend');
      await sleep(S.ghost ? 500 : 900);
      e.classList.remove('spend'); cc.classList.remove('spend');
      if (my !== token) return { r:'stop' };
    }
    const act = f.action, from = R.x;
    if (act === 'turn') { S.dir = f.dir; await sleep(250); }
    else if (f.blocked) {
      S.mark = f.xBefore + f.dirBefore;
      await tween(450, k => { R.x = from + Math.sin(Math.PI * k) * 10 * f.dirBefore; }, my);
      S.mark = null;
    } else {
      if (f.crack) crumbleTile(f.crack.l, f.crack.col, my);
      const dest = px(f.x), h = { walk:0, jump:78, bigjump:92 }[act];
      await tween(act === 'walk' ? 280 : act === 'jump' ? 520 : 620, k => {
        R.x = from + (dest - from) * k;
        R.y = h ? -Math.sin(Math.PI * k) * h : -Math.abs(Math.sin(Math.PI * k * 2)) * 3;
      }, my);
    }
    S.beam = S.hl = null; clearLit();
    if (my !== token) return { r:'stop' };
    for (const ev of f.events) {
      if (ev.kind === 'fall') {
        await tween(380, k => { R.fall = k * k * (GYS[1] - GYS[0]); }, my);
        S.lay = 1; GY = GYS[1]; R.fall = 0;
      } else if (ev.kind === 'ride') {
        // The platform carries the runner to the other floor and stays there.
        const d = GYS[ev.to] - GYS[ev.from];
        await tween(700, k => { const e = (1 - Math.cos(Math.PI * k)) / 2; R.fall = e * d; S.elevOff[f.x] = e * d; }, my);
        S.elev[f.x] = ev.to; delete S.elevOff[f.x]; S.lay = ev.to; GY = GYS[ev.to]; R.fall = 0;
        burst(R.x, GY, C.elev, 8);
      } else if (ev.kind === 'orb') {
        S.eaten.add(f.l + ':' + f.x); S.energy += 2; renderEnergy();
        burst(R.x, GY - 20, C.qi, 14); floats.push({ x:R.x, y:GY - 60, text:'+2', life:1 });
      }
      if (my !== token) return { r:'stop' };
    }
    S.energy = f.qi; renderEnergy();
    if (f.outcome === 'pit') {
      S.mark = f.x;
      await tween(500, k => { R.fall = k * k * 120; R.alpha = (S.ghost ? 0.55 : 1) * (1 - k); }, my);
      return { r:'dead', res };
    }
    if (f.outcome === 'spike') {
      S.mark = f.x; burst(R.x, GY - 20, C.spike, 14);
      await tween(450, k => { R.rot = k * Math.PI / 2; R.alpha = (S.ghost ? 0.55 : 1) * (1 - k * 0.7); }, my);
      return { r:'dead', res };
    }
    if (f.outcome === 'win') return { r:'win', res };
  }
  return { r:'dead', res };
}

// Cards are read left to right: grey until read, a cross for no match, a tick at the first match; cards after it stay grey.
async function readInOrder(f, fire, starved, my) {
  const hc = headCards(), ptr = document.getElementById('reader');
  hc.forEach(c => { c.classList.add('unread'); c.querySelector('.badge').className = 'badge'; });
  ptr.style.display = 'block';
  const shadowed = f.checks.some((c, i) => i > fire && c);
  for (let i = 0; i <= fire; i++) {
    if (f.checks[i] === null) continue;  // an unfinished card is skipped
    ptr.style.left = hc[i].offsetLeft + hc[i].offsetWidth / 2 + 'px';
    hc[i].classList.remove('unread'); hc[i].classList.add('reading');
    await sleep(S.ghost ? 200 : 320);
    if (my !== token) return 'stop';
    hc[i].classList.remove('reading');
    const badge = hc[i].querySelector('.badge');
    if (i === fire) {
      badge.className = 'badge yes'; badge.textContent = '✓';
      S.hl = S.beam.tile;
      hc[i].querySelectorAll('.sec.if, .sec.if2').forEach(e => e.classList.add('lit'));
      await sleep(220);
      if (my !== token) return 'stop';
      if (starved) { hc[i].querySelector('.sec.then').classList.add('starve'); flashEnergy(); await sleep(1000); return; }
      hc[i].querySelector('.sec.then').classList.add('lit');
      if (shadowed) for (let j = i + 1; j < hc.length; j++) hc[j].classList.add('never');
      await sleep(shadowed ? 900 : 200);
      return;
    }
    badge.className = 'badge no'; badge.textContent = '✗';
    await sleep(S.ghost ? 450 : 800);
    if (my !== token) return 'stop';
    hc[i].classList.add('unread');
  }
}

// The ghost runner replays the cards until they clear the level.
async function loop(my) {
  while (my === token) {
    const out = await runOnce(my);
    if (out.r === 'stop') return;
    if (out.r === 'win') return showResult(out.res);
    if (S.cards.some(ready)) S.deaths++;  // runs with no finished card do not count toward hints
    if (S.deaths >= 2) offerHint();
    await sleep(700);
  }
}
function restart() { const my = ++token; S.won = false; document.getElementById('result').style.display = 'none'; resetRunner(); loop(my); }

function showResult(res) {
  S.won = true;
  headCards().forEach(c => c.classList.add('win'));
  const flagX = res.end.x;
  for (let i = 0; i < 4; i++) setTimeout(() => burst(px(flagX), GY - 70, [C.gold, C.finish, C.jump, '#f472b6'][i], 18), i * 150);
  const n = S.cards.filter(ready).length;
  const got = [true, LEVEL.star2.kind === 'cards' ? n <= LEVEL.star2.n : res.qi >= LEVEL.star2.n, res.gold];
  S.best = S.best.map((b, i) => b || got[i]);
  try { localStorage.setItem('rr_crack_2_bridge', JSON.stringify(S.best)); } catch (e) {}
  renderGoals();
  const st = on => `<span class="star${on ? ' on' : ''}">&#9733;</span>`;
  document.getElementById('resTitle').textContent = res.gold ? 'Gold flag!' : 'Clear!';
  document.getElementById('resStars').innerHTML = got.map(st).join('');
  const labels = ['Reached a flag', `${res.qi} Energy left (need ${LEVEL.star2.n}+)`, res.gold ? 'Reached the gold flag' : 'Gold flag not reached'];
  document.getElementById('resRows').innerHTML = got.map((g, i) => `<div class="${g ? 'on' : ''}">${st(g)} ${labels[i]}</div>`).join('')
    + `<div class="on" style="color:var(--qi)">Energy left: ${res.qi}</div>`;
  setTimeout(() => { if (S.won) document.getElementById('result').style.display = 'grid'; }, 900);
}
document.getElementById('resEdit').onclick = () => { document.getElementById('result').style.display = 'none'; S.won = false; ++token; resetRunner(); headCards().forEach(c => c.classList.remove('win')); };
document.getElementById('resAgain').onclick = () => { S.ghost = false; restart(); };

function offerHint() {
  if (S.hintsShown >= LEVEL.hints.length) return;
  const b = document.getElementById('hintBtn');
  b.style.display = 'inline-block';
  b.textContent = `Hint ${S.hintsShown + 1}/${LEVEL.hints.length}`;
  if (S.hintsShown === 0) document.getElementById('nudge').style.display = 'block';
}
document.getElementById('hintBtn').onclick = () => {
  document.getElementById('nudge').style.display = 'none';
  const banner = document.getElementById('banner');
  banner.textContent = LEVEL.hints[S.hintsShown++];
  banner.style.display = 'block';
  const b = document.getElementById('hintBtn');
  if (S.hintsShown >= LEVEL.hints.length) b.style.display = 'none'; else b.textContent = `Hint ${S.hintsShown + 1}/${LEVEL.hints.length}`;
};

// Cracked ground breaks as the runner leaves it: the pieces drop away and the tile is a hole from then on.
function crumbleTile(l, col, my) {
  const key = l + ':' + col, x0 = offX() + col * T, gy = GYS[l];
  S.broken.add(key);
  S.crumble[key] = 0;
  for (let i = 0; i < 12; i++) parts.push({ x:x0 + 4 + Math.random() * (T - 8), y:gy + 4 + Math.random() * 10, vx:(Math.random() - .5) * 2.5, vy:-1 - Math.random() * 2, life:1, color:i % 2 ? C.ground : C.groundDark });
  tween(450, k => { S.crumble[key] = k; }, my).then(() => { delete S.crumble[key]; });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 4; parts.push({ x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 3, life:1, color }); }
}

// ---------- editing ----------
function edit(i, change) {
  change(S.cards[i]);
  S.ghost = true;
  renderCards();
  restart();
}
function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= S.cards.length) return;
  [S.cards[i], S.cards[j]] = [S.cards[j], S.cards[i]];
  S.ghost = true;
  renderCards();
  bubble.classList.add('shake'); setTimeout(() => bubble.classList.remove('shake'), 450);
  restart();
}
function openPicker(i, kind) {
  const card = S.cards[i];
  document.getElementById('pickTitle').textContent = kind === 'then' ? 'THEN ...' : kind === 'if2' ? 'AND ...' : 'IF ...';
  const grid = document.getElementById('pickGrid');
  grid.innerHTML = '';
  // On an AND card the second line never checks what the first one checks.
  const keys = kind === 'then' ? LEVEL.thens : kind === 'if2' ? LEVEL.ifs.filter(k => k !== card.if) : LEVEL.ifs;
  for (const key of keys) {
    const b = document.createElement('button');
    b.className = 'opt' + (card[kind] === key ? ' sel' : '');
    b.innerHTML = (kind === 'then' ? actIcon(key) : condIcon(key, kind === 'if2' ? card.not2 : card.not)) + `<span>${NAME[key]}</span>` +
      (kind === 'then' ? pips(SIM.COST[key], !!card.if2) : '');
    b.onclick = () => { closePicker(); edit(i, c => {
      if (kind === 'if' && c.if2 === key) c.if2 = c.if;  // picking what the AND line checks swaps the two
      c[kind] = key;
    }); };
    grid.appendChild(b);
  }
  document.getElementById('picker').style.display = 'grid';
}
function closePicker() { document.getElementById('picker').style.display = 'none'; }
document.getElementById('pickCancel').onclick = closePicker;
document.getElementById('picker').onclick = e => { if (e.target.id === 'picker') closePicker(); };

function showIntro(title, left, right, text, eq = '&rarr;') {
  document.getElementById('newEq').innerHTML = eq;
  document.getElementById('newTitle').textContent = title;
  document.getElementById('jumpOpt').innerHTML = left;
  document.getElementById('bigOpt').innerHTML = right;
  document.getElementById('newText').innerHTML = text;
  const box = document.getElementById('newIntro');
  box.style.display = 'grid';
  return new Promise(res => document.getElementById('newOk').onclick = () => { box.style.display = 'none'; res(); });
}

// ---------- drawing ----------
function drawTile(t, x0, i, l) {
  const gy = GYS[l];
  if (t == null || t === '.') return;
  if (t === 'H') {
    // High wall: a tall pillar. Nothing jumps over it.
    ctx.fillStyle = C.wall; ctx.fillRect(x0 + 2, gy - 84, T - 4, l === 0 ? 102 : H - gy + 84);
    ctx.fillStyle = '#4a5468'; for (let y = gy - 74; y < gy; y += 22) ctx.fillRect(x0 + 2, y, T - 4, 3);
    return;
  }
  if (t === 'p') { if (l === 1) { ctx.fillStyle = C.pit; ctx.fillRect(x0, gy, T, H - gy); } return; }
  if (t === 'c') { drawCracked(x0, gy, i, l, 0); return; }
  ctx.fillStyle = i % 2 ? C.groundDark : C.ground;
  ctx.fillRect(x0 + 1, gy, T - 2, l === 0 ? 18 : T);
  if (t === 'w') { ctx.fillStyle = '#c28f5a'; ctx.fillRect(x0 + 4, gy - T * 0.6, T - 8, T * 0.6); }
  if (t === 'o' && !S.eaten.has(l + ':' + i)) { ctx.fillStyle = C.qi; ctx.shadowColor = C.qi; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(x0 + T / 2, gy - 18, 9, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
  if (t === 's') {
    ctx.fillStyle = C.spike; ctx.beginPath();
    const sw = (T - 8) / 3; for (let k = 0; k < 3; k++) { ctx.moveTo(x0 + 4 + k * sw, gy); ctx.lineTo(x0 + 4 + (k + .5) * sw, gy - 22); ctx.lineTo(x0 + 4 + (k + 1) * sw, gy); }
    ctx.fill();
  }
  if (t === 'f' || t === 'F') {
    ctx.fillStyle = '#eef1f5'; ctx.fillRect(x0 + T / 2 + 6, gy - 66, 3, 66);
    ctx.fillStyle = t === 'F' ? C.gold : C.finish; ctx.fillRect(x0 + T / 2 - 15, gy - 66, 21, 20);
    if (t === 'F') { ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Helvetica Neue, Arial'; ctx.textAlign = 'center'; ctx.fillText('★', x0 + T / 2 - 4.5, gy - 51); }
  }
}
// Cracked ground: a ground tile with a jagged crack through it and a chipped top edge. k > 0: it is falling apart.
function drawCracked(x0, gy, i, l, k) {
  const h = l === 0 ? 18 : T;
  ctx.save();
  ctx.globalAlpha = 1 - k;
  for (let half = 0; half < 2; half++) {
    ctx.save();
    ctx.translate(half ? k * 6 : -k * 6, k * k * 46); 
    ctx.beginPath(); ctx.rect(half ? x0 + T / 2 : x0, gy - 2, T / 2, h + 4); ctx.clip();
    ctx.fillStyle = '#a08f78'; ctx.fillRect(x0 + 1, gy, T - 2, h);
    ctx.fillStyle = '#1d232e';
    ctx.beginPath(); ctx.moveTo(x0 + 7, gy); ctx.lineTo(x0 + 10, gy + 4); ctx.lineTo(x0 + 13, gy); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x0 + T - 12, gy); ctx.lineTo(x0 + T - 9, gy + 3); ctx.lineTo(x0 + T - 6, gy); ctx.fill();
    ctx.strokeStyle = '#1d232e'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    const m = x0 + T / 2;
    ctx.beginPath(); ctx.moveTo(m - 2, gy); ctx.lineTo(m + 3, gy + h * .3); ctx.lineTo(m - 4, gy + h * .55); ctx.lineTo(m + 2, gy + h * .8); ctx.lineTo(m - 1, gy + h); ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(m + 3, gy + h * .3); ctx.lineTo(m + 11, gy + h * .45); ctx.moveTo(m - 4, gy + h * .55); ctx.lineTo(m - 12, gy + h * .4); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function drawElevators() {
  const ox = offX();
  for (const col of Object.keys(S.elev)) {
    const x0 = ox + col * T, l = S.elev[col];
    // Shaft rails between the floors.
    ctx.save(); ctx.strokeStyle = '#58b4c955'; ctx.setLineDash([4, 5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0 + 3, GYS[0]); ctx.lineTo(x0 + 3, GYS[1]); ctx.moveTo(x0 + T - 3, GYS[0]); ctx.lineTo(x0 + T - 3, GYS[1]); ctx.stroke(); ctx.restore();
    const y = GYS[l] + (S.elevOff[col] || 0);
    const up = l === 0 && !(col in S.elevOff);
    ctx.fillStyle = C.elev; ctx.fillRect(x0 + 1, y, T - 2, up ? 18 : 12);
    if (up) {
      // Raised for good: a bridge tile, locked in place.
      ctx.fillStyle = '#2f7f93'; ctx.fillRect(x0 + 1, y + 12, T - 2, 6);
      ctx.fillStyle = '#eef1f5'; ctx.fillRect(x0 + 5, y + 4, 4, 4); ctx.fillRect(x0 + T - 9, y + 4, 4, 4);
    }
    ctx.fillStyle = '#58b4c9cc';
    if (l === 1) { const cx = x0 + T / 2; ctx.beginPath(); ctx.moveTo(cx - 6, y - 4); ctx.lineTo(cx + 6, y - 4); ctx.lineTo(cx, y - 13); ctx.fill(); }
  }
}
function drawRunner() {
  ctx.save(); ctx.globalAlpha = R.alpha;
  ctx.translate(R.x, GY + R.y + R.fall); ctx.rotate(R.rot);
  ctx.fillStyle = C.runner; ctx.fillRect(-17, -34, 34, 34);
  ctx.fillStyle = C.eye; ctx.fillRect(S.dir > 0 ? 5 : -11, -28, 6, 8);
  ctx.restore();
}
function draw() {
  ctx.fillStyle = '#1d232e'; ctx.fillRect(0, 0, W, H);
  const ox = offX();
  ctx.fillStyle = C.wall;
  LEVEL.rows.forEach((row, l) => {
    const y0 = l === 0 ? GYS[0] - 140 : GYS[0] + 18, y1 = l === 0 ? GYS[0] + 18 : H;
    ctx.fillRect(ox - T, y0, T, y1 - y0);
    ctx.fillRect(ox + row.length * T, y0, T, y1 - y0);
  });
  const w = SIM.makeWorld(LEVEL);
  w.elev = S.elev;
  for (let l = 0; l < 2; l++) for (let i = 0; i < LEVEL.rows[l].length; i++) {
    let t = SIM.tile(w, l, i);
    if (t === 'E') t = l === 1 ? 'g' : null;  // the platform is drawn on its own; the shaft floor under it is ground
    const key = l + ':' + i;
    if (S.broken.has(key)) t = 'p';
    drawTile(t, ox + i * T, i, l);
    if (key in S.crumble) drawCracked(ox + i * T, GYS[l], i, l, S.crumble[key]);
  }
  drawElevators();
  if (S.hl != null) {
    ctx.save(); ctx.strokeStyle = C.gold; ctx.lineWidth = 4; ctx.shadowColor = C.gold; ctx.shadowBlur = 16;
    ctx.strokeRect(ox + S.hl * T + 3, GY - 32, T - 6, T + 28); ctx.restore();
  }
  if (S.beam) {
    ctx.save(); ctx.setLineDash([5, 5]); ctx.lineWidth = S.beam.lit ? 3 : 2;
    ctx.strokeStyle = S.beam.lit ? C.gold : 'rgba(238,241,245,.45)';
    ctx.beginPath(); ctx.moveTo(R.x + 8 * S.dir, GY + R.y - 24); ctx.lineTo(ox + S.beam.tile * T + T / 2, GY + 2); ctx.stroke(); ctx.restore();
  }
  if (S.mark != null) {
    const cx = ox + S.mark * T + T / 2, cy = GY - 40;
    ctx.save(); ctx.strokeStyle = C.spike; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx + 12, cy + 12); ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx - 12, cy + 12); ctx.stroke(); ctx.restore();
  }
  drawRunner();
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.02; ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  floats = floats.filter(f => f.life > 0);
  for (const f of floats) {
    f.y -= 0.8; f.life -= 0.015;
    ctx.globalAlpha = Math.max(0, f.life); ctx.fillStyle = C.qi; ctx.font = 'bold 22px Helvetica Neue, Arial'; ctx.textAlign = 'center'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  // The cards ride above the runner's head.
  const s = cv.clientWidth / W, bw = bubble.offsetWidth;
  bubble.style.left = Math.min(Math.max(R.x * s, bw / 2 + 4), cv.clientWidth - bw / 2 - 4) + 'px';
  // Always above the top floor and its flags, so no tile is hidden behind the cards.
  bubble.style.top = Math.max(bubble.offsetHeight + 6, (GYS[0] - 74) * s) + 'px';
  requestAnimationFrame(draw);
}

// ---------- start ----------
async function start() {
  document.getElementById('ttl').textContent = LEVEL.title;
  document.getElementById('hintBtn').style.display = 'none';
  panel.innerHTML = '<div class="title"><span id="cardCount"></span><button class="btn" id="runBtn">&#9654; Run</button><button class="btn" id="clearBtn">Clear</button></div><div class="loadout" id="loadout"></div><div class="sols" id="sols"><span>Solutions:</span></div>';
  document.getElementById('runBtn').onclick = () => { S.ghost = false; restart(); };
  document.getElementById('clearBtn').onclick = () => { S.cards = S.cards.map(() => ({ if:null, not:false, if2:null, not2:false, then:null })); S.ghost = true; renderCards(); restart(); };
  const C = (i, n, t, i2, n2) => ({ if:i, not:!!n, if2:i2 || null, not2:!!n2, then:t });
  const SOLS = [
    ['&#9733;&#9733;&#9733; Drop in, Turn at the spike, ride up, Turn at the wall, cross the bridge', [C('pit', 0, 'jump'), C('spike', 0, 'turn'), C('wall', 0, 'turn')]],
    ['&#9733;&#9733; Normal flag: Jump the spike, Jump the low wall', [C('spike', 0, 'jump'), C('wall', 0, 'jump')]],
    ['Try: go further, Turn at the wall, come back (fails)', [C('pit', 0, 'jump'), C('spike', 0, 'jump'), C('wall', 0, 'turn')]],
  ];
  const sols = document.getElementById('sols');
  SOLS.forEach(([label, cards]) => {
    const btn = document.createElement('button');
    btn.className = 'btn'; btn.innerHTML = label;
    btn.onclick = () => {
      S.cards = Array.from({ length:LEVEL.slots }, (_, i) => cards[i] ? { ...cards[i] } : { if:null, not:false, if2:null, not2:false, then:null });
      S.ghost = false; renderCards(); restart();
    };
    sols.appendChild(btn);
  });
  S.cards = Array.from({ length:LEVEL.slots }, () => ({ if:null, not:false, if2:null, not2:false, then:null }));
  renderGoals();
  renderCards();
  resetRunner();
  requestAnimationFrame(draw);
  await showIntro('NEW: Cracked ground', crackIcon(false) + '<span>Holds while you stand on it</span>', crackIcon(true) + '<span>Breaks after you step off</span>',
    'Cracked ground breaks after you step off. Then it is a hole.<br>Cards see it as ground until it breaks.');
  await showIntro('NEW: The elevator stays up', elevIcon(false) + '<span>Step on it below</span>', bridgeIcon() + '<span>It goes up once and stays</span>',
    'Step onto the elevator on the bottom floor and it lifts you up (free).<br>It goes up once and stays there as ground. Falling onto it from above does nothing.');
  restart();
}
start();
</script>
