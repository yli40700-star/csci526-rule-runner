    }
  };
  for (let i = 0; i < fluid.n; i++) {
    const cx = Math.floor(x[i]), row = Math.floor(y[i]) * w + cx;
    blot(x[i] * F, y[i] * F);
    // Reflected in the wall beside it, or the surface would curl away from every wall it meets.
    if (x[i] - cx < FLUID_RADIUS && rock[row - 1]) blot((2 * cx - x[i]) * F, y[i] * F);
    else if (cx + 1 - x[i] < FLUID_RADIUS && rock[row + 1]) blot((2 * cx + 2 - x[i]) * F, y[i] * F);
  }
  const soft = 0.22;
  for (let tx = 0; tx < fw; tx++) {
    let depth = 0;
    const col = Math.floor(tx / F);
    for (let k = 0; k < fh; k++) {
      const ty = g > 0 ? k : fh - 1 - k, i = ty * fw + tx, p = i * 4, v = field[i];
      if (v < FLUID_INK - soft || rock[Math.floor(ty / F) * w + col]) { depth = 0; d[p + 3] = 0; continue; }
      depth++;
      const edge = clamp01((v - FLUID_INK + soft) / (soft * 2));
      if (depth === 1) { d[p] = 215; d[p + 1] = 242; d[p + 2] = 255; d[p + 3] = 245 * edge; continue; }
      const deep = Math.min(1, depth / (5 * F));
      d[p] = mix(70, 24, deep);
      d[p + 1] = mix(170, 84, deep);
      d[p + 2] = mix(240, 170, deep);
      d[p + 3] = (0.72 + deep * 0.18) * 255 * edge;
    }
  }
  ink.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvas, px(0), py(0), view.cell * w, view.cell * state.world.h);
  ctx.restore();
}

// ---------- Particles and timed effects ----------

function spawn(p) {
  if (fx.particles.length > 900) return;
  fx.particles.push(Object.assign({ life: 1, decay: 1.6, vx: 0, vy: 0, g: 0, size: 3, color: '#fff', add: false, spin: 0, rot: 0 }, p));
}

function burst(x, y, color, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (50 + Math.random() * 130) * power;
    spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50, color, size: 2 + Math.random() * 3, g: 260 });
  }
}

/** Solid pieces of a broken cell: they fall under the same gravity as everything else and tumble. */
function chunks(cx, cy, colors, n) {
  const s = view.cell;
  for (let i = 0; i < n; i++) {
    spawn({ x: px(cx + Math.random()), y: py(cy + Math.random()), vx: (Math.random() - 0.5) * 150, vy: -Math.random() * 90, g: GRAVITY * s * 0.55, decay: 1.05, size: s * (0.12 + Math.random() * 0.2), color: colors[i % colors.length], spin: (Math.random() - 0.5) * 14 });
  }
}

function dust(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const a = (i / n - 0.5) * 2.4;
    spawn({ x, y, vx: Math.sin(a) * (30 + Math.random() * 50), vy: -Math.random() * 28, color: '#9aa3b2', size: 3 + Math.random() * 3, decay: 2.6, puff: true });
  }
}

const later = (seconds, fn) => fx.timers.push({ t: seconds, fn });

function flameColor(life) {
  if (life > 0.72) return '#fff4c2';
  if (life > 0.5) return '#ffd25a';
  if (life > 0.28) return '#ff8a2a';
  return '#e0401e';
}

/** One flame particle along a line: it dies right where the line ends. */
function flameDrop(x0, y0, x1, y1, speed, power = 1) {
  const len = Math.hypot(x1 - x0, y1 - y0) || 1, dx = (x1 - x0) / len, dy = (y1 - y0) / len;
  const v = speed * (0.75 + Math.random() * 0.5), wob = (Math.random() - 0.5) * 70;
  spawn({ x: x0, y: y0, vx: dx * v - dy * wob, vy: dy * v + dx * wob - 12, decay: v / len * 0.92, size: (view.cell * 0.16 + Math.random() * view.cell * 0.14) * power, flame: true });
}

function startFlame(segs, duration) {
  fx.flame = { segs: segs.map(seg => { const [ex, ey] = rayEnd(seg); return [px(seg[0] + 0.5), py(seg[1] + 0.5), ex, ey]; }), age: 0, duration };
}

function updateFlame(dt, sdt) {
  const f = fx.flame;
  if (!f) return;
  f.age += sdt;
  const length = f.segs.reduce((t, q) => t + Math.hypot(q[2] - q[0], q[3] - q[1]), 0);
  const speed = Math.max(620, length / (f.duration * 0.5)) * state.speed;
  const each = Math.ceil(dt * 420);
  let delay = 0;
  for (const seg of f.segs) {
    if (f.age > delay) for (let i = 0; i < each; i++) flameDrop(seg[0] + Math.sign(seg[2] - seg[0]) * view.cell * 0.34, seg[1] - view.cell * 0.04, seg[2], seg[3], speed);
    delay += f.duration * 0.25;
  }
  const [x, y] = [f.segs[0][0], f.segs[0][1]];
  anim.mouth = 1;
  anim.recoil = Math.max(anim.recoil, 0.8);
  if (f.age > f.duration) fx.flame = null;
  else if (Math.random() < dt * 40) spawn({ x, y: y - 6, vy: -40, vx: (Math.random() - 0.5) * 30, size: 5, color: '#5a5f6a', decay: 1.5, puff: true });
}

function explosion(cx, cy) {
  const x = px(cx + 0.5), y = py(cy + 0.5), s = view.cell;
  fx.shake = Math.max(fx.shake, 16);
  fx.flash = { color: '255,236,190', life: 1, power: 0.55 };
  fx.rings.push({ x, y, r0: s * 0.3, r1: s * 2.3, life: 1, color: '#ffe7a8', width: 7, decay: 3 });
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 430;
    spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, decay: 1.5 + Math.random() * 1.6, size: s * (0.14 + Math.random() * 0.3), flame: true });
  }
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2, v = 20 + Math.random() * 90;
    spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, decay: 0.8 + Math.random() * 0.6, size: s * 0.2 + Math.random() * s * 0.2, color: '#4a4d57', puff: true });
  }
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, v = 140 + Math.random() * 420;
    spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, g: GRAVITY * s * 0.5, decay: 0.8, size: 3 + Math.random() * 7, color: ['#6d4a2c', '#5a6579', '#8a93a8', '#a9764a'][i % 4], spin: (Math.random() - 0.5) * 16 });
  }
}

function splash(x, y, n = 14) {
  fx.ripples.push({ x, y, life: 1 });
  for (let i = 0; i < n; i++) spawn({ x, y, vx: (Math.random() - 0.5) * 200, vy: -80 - Math.random() * 240, g: GRAVITY * view.cell * 0.5, color: '#9fdcff', size: 2 + Math.random() * 3, decay: 1.2 });
}

function confetti(x, y) {
  for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.8, v = 180 + Math.random() * 420;
    spawn({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 520, decay: 0.55, size: 4 + Math.random() * 4, color: ['#f5c542', '#4c8dff', '#2fbfa5', '#e05fb0', '#ff6b3d', '#9ad44a'][i % 6], spin: (Math.random() - 0.5) * 18 });
  }
}

function updateBurns(dt) {
  for (const b of fx.burns) {
    b.t += dt;
    if (b.t < 0) { drawWoodTile(b.x, b.y); continue; }
    const k = b.t / b.dur, l = px(b.x), t = py(b.y), s = view.cell;
    ctx.globalAlpha = 1 - clamp01((k - 0.65) / 0.35);
    drawWoodTile(b.x, b.y, clamp01(k * 1.5));
    ctx.globalAlpha = 1;
    if (k < 0.8) for (let i = 0; i < 2; i++) {
      spawn({ x: l + Math.random() * s, y: t + s * (0.3 + Math.random() * 0.7), vx: (Math.random() - 0.5) * 34, vy: -90 - Math.random() * 130, decay: 2 + Math.random() * 1.6, size: s * (0.1 + Math.random() * 0.17), flame: true });
    }
    if (Math.random() < dt * 14) spawn({ x: l + Math.random() * s, y: t + Math.random() * s, vx: (Math.random() - 0.5) * 60, vy: -120 - Math.random() * 120, decay: 0.9, size: 2, color: '#ffb35c', add: true });
    if (!b.ashed && k > 0.8) {
      b.ashed = true;
      for (let i = 0; i < 7; i++) spawn({ x: l + Math.random() * s, y: t + Math.random() * s, vy: 30 + Math.random() * 30, vx: (Math.random() - 0.5) * 30, g: 120, decay: 1.1, size: 2 + Math.random() * 3, color: '#3a3430' });
    }
  }
  fx.burns = fx.burns.filter(b => b.t < b.dur);
}

/** A brittle tile that has already gone in the rules hangs on until the runner's foot has left it, then drops as pieces. */
function updateGhosts(dt, now) {
  for (const g of fx.ghosts) {
    g.t -= dt;
    if (g.t <= 0) chunks(g.x, g.y, g.color, 9);
    else if (g.wood) drawWoodTile(g.x, g.y);
    else drawBrittle(g.x, g.y, true, now);
  }
  fx.ghosts = fx.ghosts.filter(g => g.t > 0);
}

function drawSucks(dt) {
  for (const q of fx.sucks) {
    q.life -= dt * q.rate;
    const k = 1 - clamp01(q.life), e = k * k, scale = 1 - e * 0.85;
    ctx.save();
    ctx.translate(px(mix(q.x, q.tx, e) + 0.5), py(mix(q.y, q.ty, e) + 0.5));
    ctx.rotate(e * 2.4 * q.dir);
    ctx.scale(scale * (1 - e * 0.3), scale * (1 + e * 0.4));   // Stretched as it goes down the throat.
    ctx.translate(-px(0.5), -py(0.5));
    drawObj({ t: q.t, dir: 1, dazed: false }, 0, 0, 1, performance.now());
    ctx.restore();
  }
  fx.sucks = fx.sucks.filter(q => q.life > 0);
}

function drawEffects(dt, sdt) {
  updateFlame(dt, sdt);
  for (const r of fx.rings) {
    r.life -= dt * r.decay;
    const k = 1 - clamp01(r.life);
    ctx.globalAlpha = clamp01(r.life);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = Math.max(1, r.width * clamp01(r.life));
    ctx.beginPath();
    ctx.arc(r.x, r.y, mix(r.r0, r.r1, 1 - (1 - k) * (1 - k)), 0, 7);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  fx.rings = fx.rings.filter(r => r.life > 0);
  for (const r of fx.ripples) {
    r.life -= dt * 1.8;
    ctx.globalAlpha = clamp01(r.life) * 0.7;
    ctx.strokeStyle = '#d7f2ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, (1 - r.life) * view.cell * 1.1 + 4, (1 - r.life) * view.cell * 0.18 + 1, 0, 0, 7);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  fx.ripples = fx.ripples.filter(r => r.life > 0);
  for (const p of fx.particles) {
    p.life -= dt * p.decay;
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
  }
  fx.particles = fx.particles.filter(p => p.life > 0);
  for (const p of fx.particles) {
    if (p.flame || p.add) continue;
    ctx.globalAlpha = clamp01(p.life * (p.puff ? 0.6 : 1.4));
    ctx.fillStyle = p.color;
    if (p.puff) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.6 - p.life * 0.6), 0, 7);
      ctx.fill();
    } else if (p.spin) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
      ctx.restore();
    } else ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of fx.particles) {
    if (!p.flame && !p.add) continue;
    if (p.flame) drawGlow(p.x, p.y, p.size * (0.7 + (1 - p.life) * 1.5), flameColor(p.life), clamp01(p.life * 1.5) * 0.85);
    else drawGlow(p.x, p.y, p.size * 2, p.color, clamp01(p.life));
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center';
  ctx.font = '700 15px -apple-system, "PingFang SC", sans-serif';
  for (const f of fx.floats) {
    f.life -= dt / 0.95;
    f.y -= 30 * dt;
    ctx.globalAlpha = clamp01(f.life * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(10,12,18,.8)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  fx.floats = fx.floats.filter(f => f.life > 0);
}

function drawOverlay(dt) {
  const v = ctx.createRadialGradient(view.w / 2, view.h / 2, Math.min(view.w, view.h) * 0.45, view.w / 2, view.h / 2, Math.max(view.w, view.h) * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, view.w, view.h);
  if (fx.flash) {
    fx.flash.life -= dt * 3.4;
    ctx.fillStyle = `rgba(${fx.flash.color},${clamp01(fx.flash.life) * fx.flash.power})`;
    ctx.fillRect(0, 0, view.w, view.h);
    if (fx.flash.life <= 0) fx.flash = null;
  }
}

/** Dims the map except for what is new, so that the card can point without saying what to do. */
const spotMask = document.createElement('canvas');
function drawSpot(now) {
  const s = view.cell, dpr = window.devicePixelRatio || 1;
  if (spotMask.width !== canvas.width || spotMask.height !== canvas.height) { spotMask.width = canvas.width; spotMask.height = canvas.height; }
  const m = spotMask.getContext('2d');
  m.setTransform(dpr, 0, 0, dpr, 0, 0);
  m.globalCompositeOperation = 'source-over';
  m.clearRect(0, 0, view.w, view.h);
  m.fillStyle = 'rgba(6,8,13,.66)';
  m.fillRect(0, 0, view.w, view.h);
  m.globalCompositeOperation = 'destination-out';
  const hole = glowSprite('#ffffff'), r = s * 1.15;
  for (const [x, y] of state.spots) for (let i = 0; i < 2; i++) m.drawImage(hole, px(x + 0.5) - r, py(y + 0.5) - r, r * 2, r * 2);
  ctx.drawImage(spotMask, 0, 0, view.w, view.h);
  const pulse = 0.5 + Math.sin(now / 260) * 0.3;
  ctx.strokeStyle = `rgba(245,197,66,${pulse})`;
  ctx.lineWidth = 2;
  for (const [x, y] of state.spots) { rrect(px(x) + 1, py(y) + 1, s - 2, s - 2, 8); ctx.stroke(); }
}

/** One map element on a little canvas of its own, drawn with the game's own art. */
function thumb(c) {
  const out = document.createElement('canvas'), dpr = window.devicePixelRatio || 1, main = ctx, kept = { ...view }, size = 44;
  out.width = out.height = size * dpr;
  ctx = out.getContext('2d');
  ctx.scale(dpr, dpr);
  view.cell = 36;
  view.ox = view.oy = 4;
  const empty = ' '.repeat(state.world.w * state.world.h), fr = { cells: empty, wet: empty, lever: false, held: false, g: 1 };
  const now = performance.now();
  if ('BXE'.includes(c)) drawObj({ t: c, dir: 1, dazed: false }, 0, 0, 1, now);
  else if (c === '}') drawObj({ t: 'U', dir: 1, dazed: false }, 0, 0, 1, now);
  else if (c === '~') {
    ctx.fillStyle = 'rgba(58,148,224,.9)';
    ctx.fillRect(4, 14, 36, 26);
    ctx.fillStyle = '#d7f2ff';
    ctx.fillRect(4, 13, 36, 2);
  } else if (c === 'N') drawSwapBlock(c, 0, 0, 1, now);
  else if (c === 'R') drawSwapBlock(c, 0, 0, 1, now);
  else if (c === '_') { ctx.translate(0, 12); drawCell(c, 0, 0, fr, now); }
  else drawCell(c, 0, 0, fr, now);
  ctx = main;
  Object.assign(view, kept);
  return out;
}

// ---------- The frame loop ----------

function spring(key, target, dt, stiff = 170, damp = 15) {
  const v = key + 'V';
  anim[v] = (anim[v] || 0) + ((target - anim[key]) * stiff - anim[v] * damp) * dt;
  anim[key] += anim[v] * dt;
}

function updateAnim(fr, shown, dt) {
  const rate = 1 - Math.exp(-dt * 12);
  anim.door += ((fr.held ? 1 : 0) - anim.door) * rate;
  spring('lever', fr.lever ? 1 : 0, dt);
  anim.flip += (shown.g - anim.flip) * (1 - Math.exp(-dt * 10));
  anim.squash = Math.max(0, anim.squash - dt * 5);
  anim.mouth = Math.max(fluid.busy && (fluid.sink || (fluid.jet && fluid.jet.left > 0)) ? 0.8 : 0, anim.mouth - dt * 3.4);
  anim.recoil = Math.max(0, anim.recoil - dt * 5);
  spring('dip', 0, dt, 70, 5);
  fx.shake = Math.max(0, fx.shake - dt * 42);
}

let lastFrame = performance.now();
function tick(now) {
  requestAnimationFrame(tick);   // First, so that one bad frame cannot stop the game for good.
  const dt = Math.min(0.05, (now - lastFrame) / 1000), sdt = dt * state.speed;
  lastFrame = now;
  state.lastSdt = sdt;
  if (state.mode === 'run') {
    state.frameT += sdt;
    state.phase = state.frameT / state.stepSeconds;
    if (state.frameT >= state.stepSeconds && !fluid.busy) endFrame();
  } else if (state.mode === 'outcome') {
    state.outcomeT += dt / 0.7;
    if (state.outcomeT >= 1) finishRun();
  }
  for (const t of fx.timers) { t.t -= sdt; if (t.t <= 0) t.fn(); }
  fx.timers = fx.timers.filter(t => t.t > 0);

  const fr = state.mode === 'plan' ? state.preview.frames[0] : state.result.frames[state.frameIndex];
  const prev = state.mode === 'plan' ? fr : state.result.frames[Math.max(0, state.frameIndex - 1)];
  const inRun = state.mode === 'run', hold = state.holdSeconds, t = state.frameT;
  const kw = inRun ? clamp01((t - hold) / Math.max(0.001, state.stepSeconds - hold)) : 1;
  const kr = inRun ? clamp01((t - hold) / state.moveSeconds) : 1;
  const shown = inRun && t < state.swapAt ? prev : fr;     // The world only changes once the card's own moment has passed.
  updateFluid(sdt);
  updateActors(sdt, fr);
  const landed = ![...actors.values()].some(a => a.queue.length || a.wait > 0);
  updateAnim(landed && kw >= 0.6 ? fr : prev, shown, sdt);

  ctx.save();
  if (fx.shake > 0) ctx.translate((Math.random() - 0.5) * fx.shake, (Math.random() - 0.5) * fx.shake);
  drawBackdrop();
  const { w, h } = state.world;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = shown.cells[y * w + x];
    if (c !== '.') drawCell(c, x, y, shown, now);
  }
  if (state.keepStar) drawStar(px(state.keepStar[0] + 0.5), py(state.keepStar[1] + 0.5), view.cell * 0.28, now);
  updateBurns(sdt);
  updateGhosts(sdt, now);
  if (landed || !inRun || !state.rayFrame) state.rayFrame = shown;   // A beam is only cut once what cuts it has arrived.
  drawPlateLinks(shown);
  drawSights(state.rayFrame, now);
  drawActors(fr, now);
  drawSucks(sdt);
  if (fluid.on) drawFluid(fluid.busy ? 1 : 1 - fluid.fade);
  drawWater(fr, prev, kw, now);
  ctx.globalAlpha = 1;
  drawBeams(state.rayFrame, now, dt);
  drawPath();
  drawCards(now);
  drawDropTarget();
  drawRunner(runnerPose(now, kr), now, sdt);
  drawEffects(dt, sdt);
  ctx.restore();
  drawOverlay(dt);
  if (state.intro) drawSpot(now);
}

new ResizeObserver(() => { if (state.world) layout(); }).observe($('#wrap'));
loadLevel(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
