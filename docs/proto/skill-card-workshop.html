<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rule Runner 机关工坊</title>
<style>
  :root {
    --bg: #141922; --surface: #1e2531; --surface2: #283041; --raised: #343e53; --line: #3a4459;
    --text: #eef1f5; --dim: #8d97aa; --faint: #5d677a;
    --accent: #43b86a; --gold: #f5c542; --danger: #e05555; --qi: #4fd6e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh; overflow-x: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px 0; flex-wrap: wrap; }
  .brand { font-weight: 800; letter-spacing: .12em; font-size: 15px; white-space: nowrap; background: linear-gradient(90deg, #ffe07a, #ff9d4d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand small { font-weight: 500; letter-spacing: 0; color: var(--dim); -webkit-text-fill-color: var(--dim); margin-left: 8px; font-size: 13px; }
  #totalStars { color: var(--gold); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #levels { display: flex; gap: 3px; flex-wrap: wrap; margin-left: auto; }
  .lv {
    width: 37px; height: 36px; padding: 0; border-radius: 9px; background: var(--surface); color: var(--dim);
    font-size: 13px; font-weight: 700; line-height: 1.05; transition: background .12s, transform .12s, color .12s;
  }
  .lv:hover { background: var(--surface2); color: var(--text); transform: translateY(-1px); }
  .lv.on { background: linear-gradient(180deg, #44506b, #353f55); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--gold); }
  .lv.hard { color: #ffb29c; }
  .lv .st { display: block; font-size: 7px; letter-spacing: .5px; color: #4a5570; margin-top: 2px; }
  .lv .st b { color: var(--gold); font-weight: 400; }

  .brief { padding: 10px 20px 8px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brief h1 { margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap; }
  .brief p { margin: 0; color: var(--dim); flex: 1 1 340px; min-width: 240px; font-size: 14px; }
  #found { color: #9ad44a; font-size: 13px; white-space: nowrap; }
  #bestInfo { color: #ffd27a; font-size: 13px; white-space: nowrap; }

  .stage-wrap { position: relative; flex: 1 1 auto; min-height: 280px; margin: 0 20px; border-radius: 16px; overflow: hidden; background: #10141c; box-shadow: 0 0 0 1px #2b3446, 0 14px 40px rgba(0, 0, 0, .35); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; top: 8px; left: 12px; color: var(--text); font-size: 12px; pointer-events: none; font-variant-numeric: tabular-nums; display: flex; gap: 10px; background: rgba(16, 20, 28, .55); padding: 2px 9px; border-radius: 8px; }
  #hud b { color: var(--gold); font-weight: 600; }
  #legend { position: absolute; bottom: 8px; left: 14px; right: 14px; display: flex; gap: 12px; flex-wrap: wrap; color: var(--dim); font-size: 12px; pointer-events: none; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend b { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  #banner {
    position: absolute; top: 12px; left: 50%; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
    background: rgba(30, 37, 49, .97); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px;
    display: flex; align-items: center; gap: 16px; box-shadow: 0 12px 34px rgba(0, 0, 0, .45);
    transition: opacity .18s, transform .18s; max-width: calc(100% - 28px);
  }
  #banner.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #banner h2 { margin: 0; font-size: 17px; white-space: nowrap; }
  #banner.win h2 { color: #6fdc8f; }
  #banner.lose h2 { color: #ff8b8b; }
  #banner p { margin: 0; color: var(--dim); font-size: 13px; }
  #bStars { font-size: 24px; letter-spacing: 2px; color: var(--raised); line-height: 1; white-space: nowrap; }
  #bStars:empty { display: none; }
  #bStars b { color: var(--gold); font-weight: 400; }
  #banner button { background: var(--accent); padding: 7px 14px; border-radius: 9px; font-weight: 700; white-space: nowrap; }
  #banner.lose button { background: var(--raised); }

  #toast {
    position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); background: rgba(224, 85, 85, .95);
    padding: 6px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .18s;
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #toast.info { background: rgba(49, 150, 190, .95); }
  #tip {
    position: absolute; left: 0; top: 0; max-width: 260px; padding: 5px 9px; border-radius: 8px; background: rgba(16, 20, 28, .94); color: var(--text);
    font-size: 12px; line-height: 1.4; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 5;
  }
  #tip.show { opacity: 1; }
  #intro {
    position: absolute; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); display: none; z-index: 7;
    background: rgba(27, 33, 45, .97); border: 1px solid #3f4a62; border-radius: 16px; padding: 12px 16px 14px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5);
  }
  #intro.show { display: block; animation: rise .22s ease-out; }
  #intro.low { bottom: 12px; }
  #intro.high { top: 12px; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .in-tag { color: var(--gold); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  #inItems { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 14px; margin-top: 8px; }
  .in-item { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .in-pic { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 10px; background: #141a26; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .in-pic canvas { position: static; width: 44px; height: 44px; display: block; }
  .in-pic svg { width: 28px; height: 28px; }
  .in-item b { display: block; font-size: 14px; }
  .in-item span { display: block; color: var(--dim); font-size: 12px; line-height: 1.4; }
  #inAsk { margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #ffe9b0; }
  .in-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .in-foot > span { color: var(--dim); font-size: 12px; }
  .in-chip { --c: #4c8dff; height: 30px; padding: 0 10px 0 6px; border-radius: 15px; background: var(--surface2); box-shadow: inset 0 0 0 1.5px var(--c); font-size: 13px; font-weight: 600; color: var(--text); display: inline-flex; align-items: center; gap: 5px; }
  .in-chip.on { color: #fff; }
  .in-chip svg { width: 18px; height: 18px; }
  .in-chip.on { background: var(--c); }
  #inGo { margin-left: auto; background: linear-gradient(180deg, #52cf7c, #38a55d); height: 34px; padding: 0 16px; border-radius: 10px; font-weight: 700; }
  @media (max-width: 700px) {   /* The stage is too short to share: the card goes under it. */
    #intro, #intro.low, #intro.high { position: fixed; inset: auto 8px 8px; width: auto; transform: none; max-height: 34vh; overflow-y: auto; padding-bottom: 0; }
    #intro.show { animation: none; }
    #inItems { grid-template-columns: 1fr; gap: 6px; }
    .in-foot { position: sticky; bottom: 0; background: rgb(27, 33, 45); padding: 6px 0 12px; }
  }
  #helpBtn { width: 22px; height: 22px; padding: 0; border-radius: 50%; background: var(--raised); color: var(--text); font-size: 13px; font-weight: 700; line-height: 22px; flex: 0 0 22px; }
  #helpBtn:hover { background: #4b5873; }

  .dock { display: grid; grid-template-columns: 210px minmax(0, 1fr) 250px; gap: 16px; padding: 10px 20px 14px; align-items: stretch; }
  .panel { background: linear-gradient(180deg, #232b3a, #1c2330); border-radius: 14px; padding: 10px 14px; box-shadow: 0 0 0 1px #2b3446; }
  .qi-head { display: flex; align-items: baseline; justify-content: space-between; }
  .qi-head span { color: var(--dim); font-size: 13px; }
  #qiValue { color: var(--qi); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #qiPips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  #qiPips i { width: 15px; height: 15px; border-radius: 50%; background: var(--qi); display: block; transition: background .15s; }
  #qiNote { color: var(--faint); font-size: 12px; margin-top: 6px; }

  #slots { display: flex; gap: 10px; justify-content: center; align-items: stretch; flex-wrap: wrap; }
  .slot {
    --c: #4c8dff; position: relative; width: 122px; min-height: 112px; background: linear-gradient(180deg, #2f384b, #252d3d); border-radius: 14px; overflow: hidden;
    box-shadow: 0 5px 14px rgba(0, 0, 0, .35); cursor: grab; touch-action: none; transition: transform .12s, box-shadow .12s, opacity .12s, filter .12s;
  }
  .slot:hover { transform: translateY(-3px); }
  .slot.sel { box-shadow: 0 0 0 2.5px var(--gold), 0 8px 18px rgba(0, 0, 0, .4); transform: translateY(-3px); }
  .slot.off { filter: grayscale(.9); opacity: .45; cursor: not-allowed; transform: none; }
  .slot.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .slot .band { height: 24px; background: var(--c); display: flex; align-items: center; justify-content: space-between; padding: 0 9px; }
  .slot .band b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--qi); box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); }
  .slot .art { display: flex; justify-content: center; padding: 8px 0 2px; }
  .slot .art svg { width: 38px; height: 38px; }
  .slot .name { text-align: center; font-weight: 700; font-size: 14px; padding-bottom: 8px; }
  .slot .drop {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; line-height: 18px; border-radius: 50%; background: rgba(0, 0, 0, .45);
    font-size: 12px; text-align: center; display: none; padding: 0;
  }
  .slot:hover .drop { display: block; }
  .slot.empty { background: transparent; box-shadow: inset 0 0 0 2px var(--line); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); }
  .slot.empty b { font-size: 28px; line-height: 1.1; font-weight: 400; }
  .slot.empty span { font-size: 13px; }

  .controls { display: flex; flex-direction: column; gap: 7px; }
  #run { background: linear-gradient(180deg, #52cf7c, #38a55d); border-radius: 12px; height: 48px; font-size: 17px; font-weight: 800; box-shadow: 0 6px 16px rgba(56, 165, 93, .3); }
  #run:hover { filter: brightness(1.08); }
  #run.stop { background: linear-gradient(180deg, #ef6a6a, #cf4545); box-shadow: 0 6px 16px rgba(207, 69, 69, .3); }
  .row { display: flex; gap: 7px; }
  .row button { flex: 1; height: 30px; background: var(--raised); border-radius: 8px; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .row button:hover:not(:disabled) { background: #3f4a62; }
  .row button:disabled { opacity: .4; cursor: default; }
  .row button.on { background: var(--gold); color: #1a1f28; }
  #bestBtn { background: linear-gradient(180deg, #7a5cc7, #5f46a3); }
  #bestBtn:hover { background: linear-gradient(180deg, #8a6cd7, #6f56b3); }

  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100vw); background: #1a202b; border-left: 1px solid var(--line); z-index: 15;
    transform: translateX(102%); transition: transform .2s; display: flex; flex-direction: column; box-shadow: -18px 0 40px rgba(0, 0, 0, .4);
  }
  #drawer.open { transform: none; }
  @media (min-width: 1100px) {
    body.lib-open #wrap { margin-right: 446px; }
    body.lib-open .brief, body.lib-open .dock { padding-right: 446px; }
    body.lib-open .slot { width: 90px; }
  }
  .d-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
  .d-head h2 { margin: 0; font-size: 18px; }
  #equipCount { color: var(--gold); font-size: 14px; font-weight: 700; }
  #library { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 5px; }
  .skill-row {
    --c: #4c8dff; display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 6px 10px;
    background: var(--surface); border-radius: 12px; box-shadow: inset 4px 0 0 var(--c);
  }
  .skill-row:hover { background: var(--surface2); }
  .skill-row.try .t b::after { content: '本关试试'; margin-left: 6px; padding: 1px 6px; border-radius: 8px; background: rgba(245, 197, 66, .18); color: var(--gold); font-size: 11px; font-weight: 600; }
  .skill-row.on { background: var(--raised); box-shadow: inset 4px 0 0 var(--c), inset 0 0 0 1.5px var(--gold); }
  .skill-row svg { width: 34px; height: 34px; }
  .skill-row .t b { font-size: 14px; }
  .skill-row .t small { color: var(--dim); margin-left: 6px; }
  .skill-row .t p { margin: 1px 0 0; color: var(--dim); font-size: 12px; line-height: 1.4; }
  #closeDrawer { margin: 0 14px 14px; height: 40px; background: var(--accent); border-radius: 10px; font-weight: 700; }

  #ghost {
    position: fixed; left: 0; top: 0; width: 56px; height: 56px; border-radius: 12px; pointer-events: none; z-index: 20;
    display: none; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(0, 0, 0, .5);
  }
  #ghost svg { width: 34px; height: 34px; }

  @media (max-width: 960px) {
    .dock { grid-template-columns: 1fr; }
    #levels { margin-left: 0; }
    .stage-wrap { margin: 0 16px; }
    header, .brief, .dock { padding-left: 16px; padding-right: 16px; }
    .slot { width: 104px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">RULE RUNNER<small>机关工坊 · 内部原型</small></div>
  <span id="totalStars"></span>
  <nav id="levels"></nav>
</header>
<section class="brief">
  <h1 id="lvTitle"></h1><button id="helpBtn" title="看本关的新挑战">?</button><p id="lvHint"></p><span id="bestInfo"></span><span id="found"></span>
</section>
<main class="stage-wrap" id="wrap">
  <canvas id="stage"></canvas>
  <div id="hud"><span id="stepText"></span><span id="starText"></span><span id="bellyText"></span></div>
  <div id="legend"></div>
  <div id="banner"><div id="bStars"></div><div><h2 id="bTitle"></h2><p id="bText"></p></div><button id="bBtn"></button></div>
  <div id="toast"></div>
  <div id="tip"></div>
  <div id="intro">
    <div class="in-tag">新挑战</div>
    <div id="inItems"></div>
    <p id="inAsk"></p>
    <div class="in-foot"><span>试试带上</span><span id="inTry" style="display:contents"></span><button id="inGo">我来试试</button></div>
  </div>
</main>
<footer class="dock">
  <div class="panel">
    <div class="qi-head"><span>可用的气</span><div id="qiValue">0</div></div>
    <div id="qiPips"></div>
    <div id="qiNote"></div>
  </div>
  <div id="slots"></div>
  <div class="controls">
    <button id="run"></button>
    <div class="row"><button id="undo">撤销</button><button id="clear">清空</button><button id="openLib">技能库</button><button id="bestBtn">最优解</button></div>
    <div class="row" id="speed"><button data-s="1">1×</button><button data-s="2">2×</button><button data-s="4">4×</button><button id="pathBtn">路线</button></div>
  </div>
</footer>
<aside id="drawer">
  <div class="d-head"><h2>技能库</h2><span id="equipCount"></span></div>
  <div id="library"></div>
  <button id="closeDrawer">配好了</button>
</aside>
<div id="ghost"></div>

<script>
// CORE-START
/*
 * Side-on grid. Nothing moves unless the runner touches it: there is no clock and no timed machinery.
 * Water and crates can travel a long way, but they always finish inside the step that disturbed them.
 *
 * Map chars:
 *   . empty   # stone   = wood    % brittle floor   x cracked stone (only a blast breaks it)   ^ spikes   ~ water
 *   & lava (too thick to flow; water turns it to o, cooled rock, one cell of water to one cell of lava)
 *   B crate   X barrel  E slime   { } bull facing left and right   _ plate   D door (open while a plate is held)
 *   L lever   R red block (solid until the lever is thrown)   N blue block (solid once it is)
 *   ( ) A V laser emitters firing left, right, up and down
 *   * star    S start   F finish
 */
const SKILLS = {
  jump:   { name: 'Jump',   zh: '跳跃',   cost: 1, color: '#4c8dff', desc: '跳过面前一格，落回地面。能越过 1 格宽的坑，也能跳上 1 格高的台阶。只能从地面起跳。' },
  turn:   { name: 'Turn',   zh: '掉头',   cost: 1, color: '#2fbfa5', desc: '在这一格立刻掉头。撞墙时小人会自己掉头。' },
  gulp:   { name: 'Gulp',   zh: '吞吐',   cost: 1, color: '#f0a030', desc: '吞下正前方的箱子、炸药桶、替身或史莱姆；没东西可吞，就喝光挨着身体的一整片水，站岸边或水面上都行。嘴里有东西：吐到正前方一格，水会就近往低处流。' },
  echo:   { name: 'Echo',   zh: '回响',   cost: 1, color: '#b98cff', desc: '把上一张发动的卡再发动一次。贵的卡这样用更省气，但它要占一个卡槽。' },
  fire:   { name: 'Fire',   zh: '喷火',   cost: 2, color: '#ff6b3d', desc: '张嘴喷火，烧到碰见的第一样东西：木头烧光相连的一片，箱子和史莱姆烧没，炸药桶引爆，拉杆隔空扳动，烧蛮牛屁股它会往前冲。水能灭火。' },
  decoy:  { name: 'Decoy',  zh: '替身',   cost: 2, color: '#8a93a8', desc: '在脚下留一个石头替身，自己接着走。它能压住压力板、挡激光、挨蛮牛的撞。沉进水里照样压板，一格深的岩浆里能当垫脚石。' },
  flip:   { name: 'Flip',   zh: '反重力', cost: 3, color: '#e05fb0', desc: '重力上下颠倒，小人、箱子和水全部掉向另一边。' },
  portal: { name: 'Portal', zh: '传送门', cost: 3, color: '#31c7e8', desc: '放两个门，进一个就从另一个出来，可以反复用。箱子、火和激光也会穿过去。两门最远隔 6 格。' },
};
const SKILL_IDS = Object.keys(SKILLS);
const MAX_STEPS = 400;
const PORTAL_RANGE = 6;
// a is a step up and forward, b a step down and forward: a jump is one arc over one cell, a slime throws you over a bigger one.
const JUMP_ARC = ['a', 'b'];
const BOUNCE_ARC = ['a', 'a', 'b', 'b'];
const EMITTERS = { '(': [-1, 0], ')': [1, 0], A: [0, -1], V: [0, 1] };

const cellKey = (x, y) => x + ',' + y;
const parseKey = k => k.split(',').map(Number);
const inPortalRange = (a, b) => { const [ax, ay] = parseKey(a), [bx, by] = parseKey(b); return Math.max(Math.abs(ax - bx), Math.abs(ay - by)) <= PORTAL_RANGE; };

/** Fresh world for a level. Cells and water live in strings so that cloning a state stays cheap. */
function makeWorld(level) {
  const w = level.map[0].length, h = level.map.length;
  let cells = '', wet = '', sx = 0, sy = 0, nextId = 0;
  const objs = [], plates = [], emitters = [];
  level.map.forEach((row, y) => {
    for (let x = 0; x < w; x++) {
      const c = row[x];
      wet += c === '~' ? '1' : '0';
      if (c === 'S') { sx = x; sy = y; cells += '.'; }
      else if (c === 'B' || c === 'E' || c === 'X') { objs.push({ id: nextId++, t: c, x, y }); cells += '.'; }
      else if (c === '{' || c === '}') { objs.push({ id: nextId++, t: 'U', x, y, dir: c === '{' ? -1 : 1, dazed: false }); cells += '.'; }
      else if (c === '~') cells += '.';
      else {
        cells += c;
        if (c === '_') plates.push(y * w + x);
        if (EMITTERS[c]) emitters.push({ x, y, dx: EMITTERS[c][0], dy: EMITTERS[c][1] });
      }
    }
  });
  // The map holds one char per cell, so a star or a plate under water is listed in level.wet.
  (level.wet || []).forEach(k => { const [x, y] = parseKey(k), i = y * w + x; wet = wet.slice(0, i) + '1' + wet.slice(i + 1); });
  return { w, h, cells, wet, objs, nextId, plates, emitters, startX: sx, startY: sy, startDir: level.dir };
}

/** plan = { cards: { 'x,y': skill }, portals: [['x,y', 'x,y'], ...] } */
function makeState(level, plan) {
  const s = makeWorld(level);
  Object.assign(s, { x: s.startX, y: s.startY, dir: s.startDir, g: 1, queue: [], lever: false, belly: null, last: null, wetDirty: true, displaced: false, arc: 0, blasts: null, charge: null, stars: 0, t: 0, outcome: null, pending: {}, links: {}, firedAt: null, firedSkill: null, echoOf: null, note: null, bolt: null });
  Object.assign(s.pending, plan.cards);
  (plan.portals || []).forEach(([a, b]) => { s.links[a] = b; s.links[b] = a; });
  return s;
}

const cloneState = s => Object.assign({}, s, { objs: s.objs.map(o => Object.assign({}, o)), queue: s.queue.slice(), pending: Object.assign({}, s.pending), links: Object.assign({}, s.links), belly: s.belly && Object.assign({}, s.belly) });
const inMap = (s, x, y) => x >= 0 && y >= 0 && x < s.w && y < s.h;
const cellOf = (s, x, y) => s.cells[y * s.w + x];
const setCell = (s, x, y, c) => { const i = y * s.w + x; s.cells = s.cells.slice(0, i) + c + s.cells.slice(i + 1); };
const wetAt = (s, x, y) => inMap(s, x, y) && s.wet[y * s.w + x] === '1';
const setWet = (s, i, v) => { s.wet = s.wet.slice(0, i) + v + s.wet.slice(i + 1); };
const objAt = (s, x, y) => s.objs.find(o => o.x === x && o.y === y);
const removeObj = (s, o) => { s.objs.splice(s.objs.indexOf(o), 1); };
/** Heavy things sink and push water aside; everything else floats. */
const isHeavy = o => o.t === 'M' || o.t === 'U';

function plateHeld(s) {
  for (const i of s.plates) {
    const x = i % s.w, y = (i - x) / s.w;
    if (s.x === x && s.y === y) return true;
    const o = objAt(s, x, y);
    if (o && o.t !== 'E') return true;
  }
  return false;
}

function isSolid(s, x, y) {
  if (x < 0 || x >= s.w) return true;
  if (y < 0 || y >= s.h) return false;
  const c = cellOf(s, x, y);
  if (c === '#' || c === '=' || c === '%' || c === 'x' || c === 'o' || EMITTERS[c]) return true;
  if (c === 'D') return !plateHeld(s);
  if (c === 'R') return !s.lever;
  if (c === 'N') return s.lever;
  const o = objAt(s, x, y);
  return !!o && o.t !== 'E';
}

const supported = s => isSolid(s, s.x, s.y + s.g) || wetAt(s, s.x, s.y + s.g) || wetAt(s, s.x, s.y);
/** Loose objects never rest on the finish: a crate there would seal the level for good. */
const objectBlocked = (s, x, y) => !inMap(s, x, y) || isSolid(s, x, y) || !!objAt(s, x, y) || cellOf(s, x, y) === 'F';

// ---------- Water: a layer of its own, so it can stand over spikes, plates and stars ----------

function waterOpen(s, x, y) {
  if (!inMap(s, x, y)) return false;
  const c = cellOf(s, x, y);
  if (c === '#' || c === '=' || c === '%' || c === 'x' || c === 'o' || c === 'D' || c === 'F' || EMITTERS[c]) return false;
  if ((c === 'R' && !s.lever) || (c === 'N' && s.lever)) return false;
  const o = objAt(s, x, y);
  return !o || !isHeavy(o);
}

/**
 * Where a unit of water let go at a dry (x, y) comes to rest. It falls; if it lands in water it joins it; if it lands on a floor
 * it runs to the nearest way down, on either side, and falls again. With no way down left it stays. That is how a basin fills
 * from the bottom up, and why water only crosses a sill once the basin behind it is full.
 */
function runoff(s, x, y, facing = 0) {
  const drops = (cx, cy) => waterOpen(s, cx, cy + s.g) && !wetAt(s, cx, cy + s.g);
  for (let guard = s.w + s.h; guard > 0; guard--) {
    while (drops(x, y)) y += s.g;
    if (wetAt(s, x, y + s.g)) {   // It has landed in water, and is part of that water now: anywhere it can still spread to comes first.
      const room = waterGaps(s, x, y + s.g, (y + s.g) * s.g)[0];
      if (room) { [x, y] = room; continue; }
    }
    const sideways = dir => {
      for (let nx = x + dir; waterOpen(s, nx, y); nx += dir) if (drops(nx, y)) return nx - x;
      return 0;
    };
    const right = sideways(1), left = sideways(-1), gap = Math.abs(left) - Math.abs(right);
    const way = !left ? right : !right ? left : gap < 0 || (gap === 0 && facing < 0) ? left : right;   // The nearer way down. Level with both, what was spat goes on forward.
    if (!way) break;
    x += way;
  }
  return y * s.w + x;
}

/** The dry cells touching the body of water at (x, y), nearest first, leaving out any above the row limit. */
function waterGaps(s, x, y, limit = -Infinity) {
  const seen = new Set([y * s.w + x]), open = [[x, y]], gaps = [];
  for (let i = 0; i < open.length; i++) {
    const [cx, cy] = open[i];
    for (const [nx, ny] of [[cx, cy + s.g], [cx - 1, cy], [cx + 1, cy], [cx, cy - s.g]]) {
      const id = ny * s.w + nx;
      if (seen.has(id) || !waterOpen(s, nx, ny) || ny * s.g < limit) continue;
      seen.add(id);
      if (wetAt(s, nx, ny)) open.push([nx, ny]);
      else gaps.push([nx, ny]);
    }
  }
  return gaps;
}

/** Adds one unit of water at (x, y). Let go under water, it comes out at the lowest gap of that body of water. */
function addWater(s, x, y, facing = 0) {
  if (!waterOpen(s, x, y)) return false;
  if (wetAt(s, x, y)) {
    const gaps = waterGaps(s, x, y);
    if (!gaps.length) return false;
    [x, y] = gaps.reduce((a, b) => (b[1] * s.g > a[1] * s.g ? b : a));
  }
  setWet(s, runoff(s, x, y, facing), '1');
  return true;
}

/** Water always takes the shallowest unit that can get somewhere lower, until nothing can. Pressure lets it leave by any gap in its body of water, at its own level or below. */
function flowWater(s) {
  if (!s.wet.includes('1')) return;
  for (let i = 0; i < s.wet.length; i++) {
    if (s.wet[i] !== '1') continue;
    const x = i % s.w, y = (i - x) / s.w;
    if (waterOpen(s, x, y)) continue;
    setWet(s, i, '0');         // A block just closed over this water, so it is squeezed out above.
    addWater(s, x, y - s.g);
  }
  const order = [];
  for (let i = 0; i < s.wet.length; i++) order.push(i);
  const depth = i => Math.floor(i / s.w) * s.g;
  order.sort((a, b) => depth(a) - depth(b));
  const shift = () => {
    for (const i of order) {
      if (s.wet[i] !== '1') continue;
      const x = i % s.w, y = (i - x) / s.w;
      if (wetAt(s, x, y - s.g)) continue;   // Only the top of a column can run off.
      for (const [gx, gy] of waterGaps(s, x, y, depth(i))) {
        const to = runoff(s, gx, gy);
        if (depth(to) <= depth(i)) continue;
        setWet(s, i, '0');
        setWet(s, to, '1');
        return true;
      }
    }
    return false;
  };
  for (let moves = s.wet.length * 4; moves > 0 && shift(); moves--);
  if (s.displaced) spreadDisplaced(s);
  for (let i = 0; i < s.wet.length; i++) {
    if (s.wet[i] !== '1' || s.cells[i] !== '&') continue;
    s.cells = s.cells.slice(0, i) + 'o' + s.cells.slice(i + 1);   // Water and lava meet: both are gone, and there is rock to stand on.
    setWet(s, i, '0');
    s.wetDirty = true;
  }
}

/** What a decoy pushes out is one unit: on a wide surface it spreads too thin to matter, in a walled shaft it lifts the level. */
function spreadDisplaced(s) {
  s.displaced = false;
  for (let i = 0; i < s.wet.length; i++) {
    if (s.wet[i] !== '1') continue;
    const x = i % s.w, y = (i - x) / s.w, under = objAt(s, x, y + s.g);
    if (!(wetAt(s, x, y + s.g) || (under && isHeavy(under))) || wetAt(s, x - 1, y) || wetAt(s, x + 1, y) || wetAt(s, x, y - s.g)) continue;
    if (waterOpen(s, x - 1, y) || waterOpen(s, x + 1, y)) setWet(s, i, '0');
  }
}

function drink(s, x, y) {
  const open = [[x, y]];
  let n = 0;
  while (open.length) {
    const [cx, cy] = open.pop();
    if (!wetAt(s, cx, cy)) continue;
    setWet(s, cy * s.w + cx, '0');
    n++;
    open.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
  return n;
}

// ---------- Loose things ----------

/** Notes where an object went this step and how, so that the view can replay it. The rules never read this. */
function track(s, o, kind) {
  if (s.paths) (s.paths[o.id] = s.paths[o.id] || []).push([o.x, o.y, kind]);
}

/** Moves an object into a cell. A portal there carries it through, unless the far side is blocked. */
function place(s, o, x, y, kind) {
  o.x = x;
  o.y = y;
  track(s, o, kind);
  const out = s.links[cellKey(x, y)];
  if (!out) return;
  const [ex, ey] = parseKey(out);
  if (!objectBlocked(s, ex, ey) && !(s.x === ex && s.y === ey)) { o.x = ex; o.y = ey; track(s, o, 'portal'); }
}

function settleObjects(s) {
  for (let guard = 0; guard < 400; guard++) {
    let moved = false;
    for (const o of s.objs.slice()) {
      if (cellOf(s, o.x, o.y) === '&' && o.t !== 'M') {   // Stone sinks in it. Nothing else survives it.
        removeObj(s, o);
        if (o.t === 'X') explode(s, o.x, o.y);
        moved = true;
        continue;
      }
      if (isHeavy(o) && wetAt(s, o.x, o.y)) {   // A decoy made under water pushes that water aside at once.
        setWet(s, o.y * s.w + o.x, '0');
        addWater(s, o.x, o.y - s.g);
        s.wetDirty = s.displaced = true;
        moved = true;
      }
      if (!isHeavy(o) && wetAt(s, o.x, o.y)) {   // Crates and slimes bob up to the surface.
        const uy = o.y - s.g;
        if (!objectBlocked(s, o.x, uy) && !(s.x === o.x && s.y === uy)) { o.y = uy; track(s, o, 'float'); moved = true; }
        continue;
      }
      const ny = o.y + s.g;
      if (ny < 0 || ny >= s.h) { removeObj(s, o); moved = true; continue; }
      const under = cellOf(s, o.x, ny);
      if (under === '%' && o.t !== 'E') { setCell(s, o.x, ny, '.'); s.wetDirty = true; moved = true; continue; }
      if (objectBlocked(s, o.x, ny) || (s.x === o.x && s.y === ny)) continue;
      if (wetAt(s, o.x, ny)) {
        if (!isHeavy(o)) continue;
        setWet(s, ny * s.w + o.x, '0');   // Stone sinks and lifts the water it displaces.
        const was = o.y;
        o.y = ny;
        track(s, o, 'sink');
        addWater(s, o.x, was);
        s.wetDirty = s.displaced = true;
        moved = true;
        continue;
      }
      place(s, o, o.x, ny, 'fall');
      moved = true;
    }
    if (!moved) return;
  }
}

/** Loose things and water come to rest within the same step; each can disturb the other. */
function settle(s) {
  for (let i = 0; i < 12; i++) {
    settleObjects(s);
    if (!s.wetDirty) return;
    s.wetDirty = false;
    flowWater(s);
  }
}

// ---------- Rays ----------

/** Follows a straight line from next to (x, y), through portals, until stop(x, y) is true. Returns the segments drawn. */
function trace(s, x, y, dx, dy, stop) {
  const segs = [];
  let ax = x, ay = y, cx = x + dx, cy = y + dy, hops = 0;
  for (let i = 0; i < 400; i++) {
    if (!inMap(s, cx, cy) || stop(cx, cy)) break;
    const out = hops < 6 ? s.links[cellKey(cx, cy)] : null;
    if (out) {
      segs.push([ax, ay, cx, cy]);
      [ax, ay] = parseKey(out);
      hops++;
      if (stop(ax, ay)) { cx = ax; cy = ay; break; }
      cx = ax + dx;
      cy = ay + dy;
      continue;
    }
    cx += dx;
    cy += dy;
  }
  segs.push([ax, ay, cx, cy]);
  return segs;
}

function beams(s, visit = () => {}) {
  const out = [];
  for (const e of s.emitters) out.push(...trace(s, e.x, e.y, e.dx, e.dy, (x, y) => { visit(x, y); return isSolid(s, x, y); }));
  return out;
}

function burnWood(s, x, y) {
  const open = [[x, y]];
  while (open.length) {
    const [cx, cy] = open.pop();
    if (!inMap(s, cx, cy) || cellOf(s, cx, cy) !== '=') continue;
    setCell(s, cx, cy, '.');
    open.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
  s.wetDirty = true;
}

function throwLever(s) {
  s.lever = !s.lever;
  s.wetDirty = true;
}

/** A blast reaches the eight cells around it. Barrels in reach go off too, and the runner dies if it is that close. */
function explode(s, x, y) {
  const open = [[x, y]];
  while (open.length) {
    const [cx, cy] = open.pop();
    (s.blasts = s.blasts || []).push([cx, cy]);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = cx + dx, ny = cy + dy;
      if (!inMap(s, nx, ny)) continue;
      const c = cellOf(s, nx, ny), o = objAt(s, nx, ny);
      if (c === 'x' || c === '%') { setCell(s, nx, ny, '.'); s.wetDirty = true; }
      if (c === '=') burnWood(s, nx, ny);
      if (o) {
        removeObj(s, o);
        if (o.t === 'X') open.push([nx, ny]);
      }
      if (s.x === nx && s.y === ny) s.outcome = 'blast';
    }
  }
}

/** What a bull is looking at: the first thing along its row, if that is the runner or a decoy. */
function bullSees(s, o) {
  for (let x = o.x + o.dir; x >= 0 && x < s.w; x += o.dir) {
    if (s.x === x && s.y === o.y) return true;
    const t = objAt(s, x, o.y);
    if (t && t.t === 'M') return true;
    if (isSolid(s, x, o.y)) return false;
  }
  return false;
}

/** A bull runs in one go until stone stops it or the floor ends, breaking what stands in the way. Afterwards it is dazed for good. */
function charge(s, o) {
  const from = o.x;
  o.dazed = true;
  for (let i = 0; i < s.w; i++) {
    const nx = o.x + o.dir;
    if (!inMap(s, nx, o.y)) break;
    if (s.x === nx && s.y === o.y) { o.x = nx; s.outcome = 'bull'; break; }
    const c = cellOf(s, nx, o.y), t = objAt(s, nx, o.y);
    if (t && t.t === 'X') { removeObj(s, t); explode(s, nx, o.y); break; }
    if (t) removeObj(s, t);
    if (c === '=' || c === '%') { setCell(s, nx, o.y, '.'); s.wetDirty = true; }
    else if (isSolid(s, nx, o.y) || c === 'F') break;
    o.x = nx;
    track(s, o, 'charge');
    if (c === '^' || c === '&') { removeObj(s, o); break; }
    const under = o.y + s.g;
    if (!inMap(s, o.x, under) || !(isSolid(s, o.x, under) || wetAt(s, o.x, under))) break;   // Off the edge: gravity takes over.
  }
  s.charge = { id: o.id, from, to: o.x, y: o.y };
}

/** [from, to, row] for each bull that can still charge: how far along its row it can see. */
function bullSights(s) {
  const out = [];
  for (const o of s.objs) {
    if (o.t !== 'U' || o.dazed) continue;
    let x = o.x + o.dir;
    while (x >= 0 && x < s.w && !isSolid(s, x, o.y)) x += o.dir;
    out.push([o.x, x - o.dir, o.y]);
  }
  return out;
}

function bullsLook(s) {
  for (const o of s.objs.slice()) {
    if (o.t === 'U' && !o.dazed && s.objs.includes(o) && bullSees(s, o)) { charge(s, o); settle(s); }
    if (s.outcome) return;
  }
}

function fireBolt(s) {
  s.bolt = trace(s, s.x, s.y, s.dir, 0, (x, y) => {
    if (wetAt(s, x, y)) return true;
    const o = objAt(s, x, y), c = cellOf(s, x, y);
    if (o && o.t === 'X') { removeObj(s, o); explode(s, x, y); return true; }
    if (o && o.t === 'U') { if (!o.dazed) charge(s, o); return true; }
    if (o && o.t !== 'M') { removeObj(s, o); return true; }
    if (c === '=') { burnWood(s, x, y); return true; }
    if (c === 'L') { throwLever(s); return true; }
    return isSolid(s, x, y);
  });
}

// ---------- Cards ----------

function gulp(s) {
  const ax = s.x + s.dir, ay = s.y;
  if (s.belly) {
    const blocked = objectBlocked(s, ax, ay);
    if (s.belly.t === 'W') {           // Water can always be let out: with a wall ahead it wells up at the runner's feet.
      for (let i = 0; i < s.belly.n; i++) addWater(s, blocked ? s.x : ax, ay, s.dir);
      s.wetDirty = true;
    } else if (blocked) { s.note = 'stuck'; return; }
    else {
      const o = { id: s.nextId++, t: s.belly.t, x: ax, y: ay };
      s.objs.push(o);
      track(s, o, 'spit');
    }
    s.belly = null;
    s.note = s.mouth = 'spit';
    return;
  }
  const o = objAt(s, ax, ay);
  if (o && o.t === 'U') { s.note = 'toobig'; return; }
  if (o) { removeObj(s, o); s.belly = { t: o.t }; s.note = s.mouth = 'gulp'; return; }
  // Water only has to touch the runner: ahead of it, behind it, under its feet, or level with the ground it stands on.
  const back = s.x - s.dir, below = ay + s.g;
  for (const [wx, wy] of [[ax, ay], [ax, below], [s.x, below], [s.x, ay], [back, below], [back, ay]]) {
    if (!wetAt(s, wx, wy)) continue;
    s.sip = [wx, wy];
    s.belly = { t: 'W', n: drink(s, wx, wy) };
    s.wetDirty = true;
    s.note = s.mouth = 'gulp';
    return;
  }
  s.note = 'empty';
}

function fireCard(s, skill) {
  s.firedAt = cellKey(s.x, s.y);
  s.firedSkill = skill;
  switch (skill) {
    case 'jump':
      if (supported(s)) s.queue = JUMP_ARC.slice();
      else s.note = 'fizzle';   // No pushing off thin air: a jump leaves the ground and comes back to it.
      break;
    case 'turn': s.dir = -s.dir; break;
    case 'gulp': gulp(s); break;
    case 'fire': fireBolt(s); break;
    case 'decoy': {
      const o = { id: s.nextId++, t: 'M', x: s.x, y: s.y, dir: s.dir };
      s.objs.push(o);
      track(s, o, 'born');
      break;
    }
    case 'flip': s.g = -s.g; s.wetDirty = true; break;
    case 'echo':
      if (!s.last) { s.note = 'hollow'; return; }
      s.echoOf = s.last;
      fireCard(s, s.last);
      s.firedSkill = 'echo';
      return;
  }
  s.last = skill;
}

// ---------- The runner ----------

function touch(s, x, y, how) {
  const c = cellOf(s, x, y);
  if (c === '&') { s.outcome = 'lava'; return; }
  if (c === '^' && !wetAt(s, x, y)) { s.outcome = 'spike'; return; }
  const o = objAt(s, x, y);
  if (o && o.t === 'E') {
    if (how !== 'fall') { s.outcome = 'slime'; return; }
    removeObj(s, o);
    s.queue = BOUNCE_ARC.slice();   // Higher than any jump: a slime is the only big jump in the game.
    s.note = 'stomp';
  }
  if (c === '*') { s.stars++; setCell(s, x, y, '.'); s.note = 'star'; }
  if (c === 'F') { s.outcome = 'win'; return; }
  if (c === 'L') { throwLever(s); s.note = 'lever'; }
}

function enter(s, x, y, how) {
  s.x = x;
  s.y = y;
  s.how = how;
  if (y < 0 || y >= s.h) { s.outcome = 'fell'; return; }
  touch(s, x, y, how);
  if (s.outcome) return;
  const out = s.links[cellKey(x, y)];
  if (!out) return;
  const [ex, ey] = parseKey(out);
  if (isSolid(s, ex, ey)) return;   // A blocked exit (wood, a crate, a closed door) leaves the portal dead for now.
  s.via = [x, y];
  s.x = ex;
  s.y = ey;
  s.queue = [];
  s.teleported = true;
  touch(s, ex, ey, 'portal');
}

function tryWalk(s) {
  const nx = s.x + s.dir;
  const o = nx >= 0 && nx < s.w ? objAt(s, nx, s.y) : null;
  if (o && (o.t === 'B' || o.t === 'X')) {
    const bx = nx + s.dir;
    if (objectBlocked(s, bx, s.y)) { s.dir = -s.dir; s.bumped = true; return; }
    place(s, o, bx, s.y, 'push');
    enter(s, nx, s.y, 'walk');
    return;
  }
  if (isSolid(s, nx, s.y)) { s.dir = -s.dir; s.bumped = true; return; }
  enter(s, nx, s.y, 'walk');
}

function moveOnce(s) {
  while (s.queue.length) {
    if (s.queue[0] === 'b' && supported(s)) { s.queue = []; break; }   // Came down early, on a ledge.
    const m = s.queue.shift(), nx = s.x + s.dir;
    if (m === 'a') {
      const ny = s.y - s.g;
      if (!inMap(s, s.x, ny) || isSolid(s, s.x, ny)) { s.queue = []; break; }   // No headroom.
      s.arc = s.queue[0] === 'a' ? 2 : 1;
      if (!isSolid(s, nx, ny)) enter(s, nx, ny, 'air');
      else enter(s, s.x, ny, 'air');   // A wall ahead: rise straight up against it.
      return;
    }
    if (isSolid(s, nx, s.y)) { s.queue = []; break; }
    s.arc = s.queue.length ? -2 : -1;
    if (!isSolid(s, nx, s.y + s.g)) enter(s, nx, s.y + s.g, 'fall');
    else enter(s, nx, s.y, 'fall');   // The ground ahead is higher than where the arc would end.
    return;
  }
  if (!supported(s)) { enter(s, s.x, s.y + s.g, 'fall'); return; }
  tryWalk(s);
}

/** Water lifts the runner to its surface; a ceiling stops the climb. */
function surface(s) {
  for (let i = 0; i < s.h && !s.outcome && wetAt(s, s.x, s.y); i++) {
    const ny = s.y - s.g;
    if (!inMap(s, s.x, ny) || isSolid(s, s.x, ny)) return;
    enter(s, s.x, ny, 'float');
  }
}

function laserTouch(s) {
  for (let i = 0; i < 8; i++) {
    const barrels = [];
    beams(s, (x, y) => {
      if (x === s.x && y === s.y) s.outcome = 'laser';
      const o = objAt(s, x, y);
      if (o && o.t === 'X') barrels.push(o);
    });
    if (!barrels.length) return;
    for (const o of barrels) if (s.objs.includes(o)) { removeObj(s, o); explode(s, o.x, o.y); }
    settle(s);
  }
}

/** One step: a card on this cell fires and whatever it shook loose lands, then the runner moves one cell, then loose things settle. */
function step(s) {
  s.t++;
  s.firedAt = s.firedSkill = s.echoOf = s.note = s.bolt = s.blasts = s.charge = null;
  s.teleported = s.bumped = s.landed = false;
  s.how = s.via = s.sip = s.mouth = null;
  if (s.record) s.paths = {};
  s.prevArc = s.arc;
  s.arc = 0;
  const fromX = s.x, fromY = s.y, floorY = s.y + s.g, wasAir = !supported(s);
  const k = cellKey(s.x, s.y);
  const skill = s.pending[k];
  if (skill) {
    delete s.pending[k];
    fireCard(s, skill);
    settle(s);
    if (s.outcome) return;
  }
  surface(s);   // Water that has just closed over the runner carries it straight up: it does not get a step forward as well.
  if (s.outcome) return;
  if (s.how === 'float') s.queue = [];
  else moveOnce(s);
  if (s.outcome) return;
  if ((s.x !== fromX || s.y !== fromY) && inMap(s, fromX, floorY) && cellOf(s, fromX, floorY) === '%') {
    setCell(s, fromX, floorY, '.');   // Brittle floor holds the runner once and gives way behind it.
    s.wetDirty = true;
  }
  settle(s);
  surface(s);
  if (s.outcome) return;
  settle(s);
  s.landed = (wasAir || s.arc !== 0) && supported(s);
  bullsLook(s);
  if (s.outcome) return;
  laserTouch(s);
}

const worldKey = s => [s.x, s.y, s.dir, s.g, s.queue.join(''), s.lever ? 1 : 0, s.belly ? s.belly.t + s.belly.n : '', s.last || '', s.cells, s.wet, s.objs.map(o => o.t + o.x + ',' + o.y + (o.dazed ? 'z' : '')).join(';'), Object.keys(s.pending).length].join('|');

const snapshot = s => ({
  x: s.x, y: s.y, dir: s.dir, g: s.g, cells: s.cells, wet: s.wet, lever: s.lever, belly: s.belly && s.belly.t, stars: s.stars, held: plateHeld(s),
  objs: s.objs.map(o => ({ id: o.id, t: o.t, x: o.x, y: o.y, dir: o.dir, dazed: o.dazed })), firedAt: s.firedAt, firedSkill: s.firedSkill, echoOf: s.echoOf, note: s.note, bolt: s.bolt,
  blasts: s.blasts, charge: s.charge, arc: s.arc, landed: !!s.landed, how: s.how, via: s.via, sip: s.sip, mouth: s.mouth, paths: s.paths,
  beams: s.emitters.length ? beams(s) : [], sights: bullSights(s), teleported: !!s.teleported, bumped: !!s.bumped,
});

/** Plays a whole run and records one frame per step for the view. */
function simulate(level, plan) {
  const s = makeState(level, plan);
  settle(s);
  s.record = true;
  const frames = [{ ...snapshot(s), first: true }];
  const seen = new Set([worldKey(s)]);
  let outcome = 'timeout';
  for (let i = 0; i < MAX_STEPS; i++) {
    step(s);
    frames.push(snapshot(s));
    if (s.outcome) { outcome = s.outcome; break; }
    const key = worldKey(s);
    if (seen.has(key)) { outcome = 'loop'; break; }
    seen.add(key);
  }
  return { outcome, stars: s.stars, frames, steps: frames.length - 1 };
}

/** Cards can sit in any cell the runner might ever pass through: mid-air, under a crate, or in wood that will burn. */
function canPlaceAt(level, world, x, y) {
  if (!inMap(world, x, y)) return false;
  return '._L*DRN=%x'.includes(cellOf(world, x, y));
}

// ---------- Budget ----------

const spent = (plan = state.plan, open = state.open) =>

const portalAt = (plan, k) => plan.portals.findIndex(p => p[0] === k || p[1] === k);

function refreshPreview() {
  state.preview = simulate(state.level, state.plan);
  state.reached = new Set(state.preview.frames.map(f => f.firedAt).filter(Boolean));

function setPlan(plan, open) {
  state.demo = false;
  state.plan = plan;
  state.open = open;
  state.plans[state.level.id] = { plan, open };
  refreshPreview();
  renderDock();
}

function commit(plan, open = state.open) {
  state.history.push({ plan: state.plan, open: state.open, loadout: state.loadout.slice() });
  setPlan(plan, open);
}

// ---------- Editing (any edit stops a run and returns to planning) ----------

function occupied(k) { return state.plan.cards[k] !== undefined || portalAt(state.plan, k) >= 0 || state.open === k; }

function placeCard(x, y, skill, from = null) {
  toPlan();
  if (!canPlaceAt(state.level, state.world, x, y)) { toast('这一格放不了卡'); return; }
  const k = cellKey(x, y);
  if (k === from) return;
  if (skill === 'portal') return placePortal(k, from);
  if (portalAt(state.plan, k) >= 0 || state.open === k) { toast('这一格已经有传送门了'); return; }
  const next = clonePlan(state.plan);
  if (from !== null) delete next.cards[from];
  next.cards[k] = skill;
  if (spent(next) > state.level.qi) { toast(`气不够：${SKILLS[skill].zh}要 ${SKILLS[skill].cost} 气`); return; }
  commit(next);
}

function placePortal(k, from) {
  const next = clonePlan(state.plan);
  if (occupied(k)) { toast('这一格已经有卡了'); return; }
  if (from !== null) {
    if (state.open === from) { commit(next, k); return; }
    const pair = next.portals[portalAt(next, from)];
    const other = pair[0] === from ? pair[1] : pair[0];
    if (!inPortalRange(k, other)) { toast(`两个门最远隔 ${PORTAL_RANGE} 格`); return; }
    pair[pair[0] === from ? 0 : 1] = k;
    commit(next);
    return;
  }
  if (state.open) {
    if (!inPortalRange(k, state.open)) { toast(`两个门最远隔 ${PORTAL_RANGE} 格`); return; }
    next.portals.push([state.open, k]);
    commit(next, null);
    clearToast();
    return;
  }
  if (remaining() < SKILLS.portal.cost) { toast(`气不够：传送门要 ${SKILLS.portal.cost} 气`); return; }
  commit(next, k);
  toast('再放一个门作为出口', true);
}

function removeAt(k) {
  toPlan();
  if (!occupied(k)) return;
  const next = clonePlan(state.plan);
  if (state.open === k) { commit(next, null); return; }
  const i = portalAt(next, k);
  if (i >= 0) next.portals.splice(i, 1);
  else delete next.cards[k];
  commit(next);
}

function undo() {
  toPlan();
  const last = state.history.pop();
  if (!last) return;
  state.loadout = last.loadout;
  state.loadouts[state.level.id] = state.loadout;
  renderSlots();
  renderLibrary();
  setPlan(last.plan, last.open);
}

function clearCards() {
  toPlan();
  if (!spent()) return;
  commit(emptyPlan(), null);
}

function toggleEquip(id) {
  toPlan();
  if (state.loadout.includes(id)) {
    const next = clonePlan(state.plan);
    Object.keys(next.cards).forEach(k => { if (next.cards[k] === id) delete next.cards[k]; });
    let open = state.open;
    if (id === 'portal') { next.portals = []; open = null; }
    commit(next, open);
    state.loadout = state.loadout.filter(x => x !== id);
    if (state.selected === id) state.selected = null;
  } else {
    if (state.loadout.length >= state.level.slots) { toast(`卡槽只有 ${state.level.slots} 个，先卸下一张`); return; }
    state.loadout = state.loadout.concat(id);
  }
  state.loadouts[state.level.id] = state.loadout;
  state.lastLoadout = state.loadout;
  renderSlots();
  renderLibrary();
  renderDock();
  if (state.intro) renderTryChips();
}

function loadLevel(index) {
  state.index = index;
  state.level = LEVELS[index];
  state.world = makeWorld(state.level);
  const kept = state.plans[state.level.id];
  state.plan = kept ? kept.plan : emptyPlan();
  state.open = kept ? kept.open : null;
  state.history = [];
  state.selected = null;
  state.loadout = state.loadouts[state.level.id] || state.lastLoadout.slice(0, state.level.slots);
  state.loadouts[state.level.id] = state.loadout;
  refreshPreview();
  toPlan(true);

  const inMapRows = c => state.level.map.some(r => (c === '(' ? [...LASER_CHARS].some(q => r.includes(q)) : r.includes(c)));

// ---------- The new-challenge card ----------

/** The cells the card points at: what is new here, never where the answer is. */
function spotCells() {
  const { intro } = state.level, f = state.preview.frames[0], { w, h } = state.world, out = (intro.cells || []).slice(), want = intro.spot || '';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (want.includes(f.cells[i]) || (want.includes('~') && f.wet[i] === '1')) out.push([x, y]);
  }
  for (const o of f.objs) if (want.includes(o.t)) out.push([o.x, o.y]);
  return out;
}

function renderTryChips() {
  const box = $('#inTry');
  box.innerHTML = '';
  for (const id of state.level.intro.tryIt) {
    const s = SKILLS[id], b = document.createElement('button');
    b.className = 'in-chip' + (state.loadout.includes(id) ? ' on' : '');
    b.style.setProperty('--c', s.color);
    b.innerHTML = `${svgIcon(id, '#fff')}${s.zh}`;
    b.onclick = () => equipSuggested(id);
    box.appendChild(b);
  }
}

/** Equips a suggested skill, making room by dropping one the card did not suggest. */
function equipSuggested(id) {
  if (state.loadout.includes(id)) return;
  if (state.loadout.length >= state.level.slots) {
    const spare = state.loadout.find(s => !state.level.intro.tryIt.includes(s)) || state.loadout[state.loadout.length - 1];
    toggleEquip(spare);
  }
  toggleEquip(id);
  renderTryChips();
}

function openIntro() {
  const { intro } = state.level;
  showDrawer(false);
  $('#inItems').innerHTML = intro.items.map((it, i) => {
    const s = it.skill && SKILLS[it.skill];
    return `<div class="in-item"><div class="in-pic" data-i="${i}"${s ? ` style="box-shadow:inset 0 0 0 2px ${s.color}"` : ''}>${s ? svgIcon(it.skill, s.color) : ''}</div><div><b>${s ? s.zh : it.name}</b><span>${it.text}</span></div></div>`;
  }).join('');
  intro.items.forEach((it, i) => { if (it.el) document.querySelector(`.in-pic[data-i="${i}"]`).appendChild(thumb(it.el)); });
  $('#inAsk').textContent = intro.ask;
  renderTryChips();
  state.spots = spotCells();
  state.intro = true;
  // Sits on whichever edge hides the fewest of the cells it is pointing at.
  const box = $('#intro'), stage = canvas.getBoundingClientRect();
  const mean = state.spots.reduce((t, c) => t + py(c[1] + 0.5), 0) / Math.max(1, state.spots.length);
  const hidden = side => {
    box.className = 'show ' + side;
    const r = box.getBoundingClientRect();
    return state.spots.filter(([x, y]) => {
      const cx = stage.left + px(x + 0.5), cy = stage.top + py(y + 0.5);
      return cx > r.left && cx < r.right && cy > r.top && cy < r.bottom;
    }).length;
  };
  const [first, second] = mean < view.h / 2 ? ['low', 'high'] : ['high', 'low'];
  box.className = 'show ' + (hidden(second) < hidden(first) ? second : first);
}

function closeIntro() {
  if (!state.intro) return;
  state.intro = false;
  $('#intro').className = '';
  state.seen[state.level.id] = 1;
  saveProgress();

function toPlan(force = false) {
  if (state.mode === 'plan' && !force) return;
  state.mode = 'plan';
  state.result = null;
  state.frameIndex = 0;
  state.phase = state.frameT = state.fallRun = 0;
  state.flood = state.keepStar = state.rise = null;
  fluid.on = fluid.busy = false;
  state.outcomeT = 0;
  state.burned = {};
  for (const list of ['particles', 'floats', 'rings', 'ripples', 'burns', 'ghosts', 'sucks', 'timers']) fx[list] = [];
  fx.flame = fx.flash = null;
  fx.shake = 0;
  anim.mouth = anim.squash = anim.recoil = anim.dip = anim.dipV = 0;
  anim.flip = 1;
  if (state.preview) { resetActors(state.preview.frames[0]); anim.face = state.preview.frames[0].dir; }
  hideBanner();
