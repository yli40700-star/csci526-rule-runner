function startRun() {
  closeIntro();
  toPlan();
  state.selected = null;
  if (state.open) toast('有一个传送门没配对，这次不会生效');
  state.result = simulate(state.level, state.plan);
  state.mode = 'run';
  state.frameIndex = 1;
  resetActors(state.result.frames[0]);
  beginFrame();
  renderDock();
}

/** How long a step lasts. holdSeconds is the card's own moment, moveSeconds the runner's move, and the rest lets the world catch up. */
/** How long the longest fall of this step takes. A bull only charges at what has already landed in front of it. */
function dropSeconds(f) {
  let n = 0;
  for (const path of Object.values(f.paths || {})) if (!path.some(p => p[2] === 'charge')) n = Math.max(n, path.filter(p => p[2] === 'fall').length);
  return Math.sqrt(2 * n / GRAVITY);
}

/** How long a charging bull takes to cover d cells: it accelerates at 130 up to its top speed of 24. */
const chargeSeconds = d => (d < 2.2 ? Math.sqrt(d / 65) : 0.185 + (d - 2.2) / 24);

function timeStep(f, prev, changed, wetChanged) {
  const skill = f.echoOf || f.firedSkill, falling = f.how === 'fall' && !f.arc;
  state.fallRun = falling ? state.fallRun + 1 : f.arc < 0 ? 1 : 0;
  let move = WALK_SECONDS, hold = 0, react = 0;
  if (f.arc) move = 0.21;
  if (falling) move = Math.max(0.05, Math.sqrt(2 * state.fallRun / GRAVITY) - Math.sqrt(2 * (state.fallRun - 1) / GRAVITY));
  if (f.how === 'float') move = 0.2;
  if (f.bumped) move = 0.24;
  if (f.teleported) move = 0.5;
  if (skill === 'jump') hold = f.note === 'fizzle' ? 0.2 : 0.09;
  if (skill === 'turn') hold = 0.14;
  if (skill === 'fire') { hold = 0.68; react = 0.3; }
  if (skill === 'gulp') hold = f.mouth === 'gulp' && f.belly === 'W' ? 0.5 + Math.min(0.8, wetChanged * 0.05) : f.mouth ? 0.44 : 0.22;   // It stays to finish drinking.
  if (skill === 'decoy') hold = 0.4;
  if (skill === 'flip') { hold = 0.16; react = 0.6; }
  if (f.echoOf) hold += 0.08;
  if (f.blasts) { hold = Math.max(hold, 0.12); react = Math.max(react, 0.55); }
  if (f.charge) { hold = Math.max(hold, 0.3); react = Math.max(react, dropSeconds(f) + 0.22 + Math.abs(f.charge.to - f.charge.from) / 16); }
  if (changed >= 3) react = Math.max(react, 0.5 + Math.min(0.5, changed * 0.03));
  if (f.how === 'float') move = Math.max(move, react);   // Carried up by the water, so it rises as fast as the water does.
  state.holdSeconds = hold;
  state.moveSeconds = move;
  state.stepSeconds = hold + Math.max(move, react);
  state.frameT = 0;
  return { hold, move };
}

/** Which rows water leaves and which it arrives at, so that a flood drains from the top and fills from the bottom. */
function floodOf(f, prev) {
  const w = state.world.w, inn = [], out = [];
  for (let i = 0; i < f.wet.length; i++) {
    if (f.wet[i] === prev.wet[i]) continue;
    const y = Math.floor(i / w) * f.g;
    (f.wet[i] === '1' ? inn : out).push(y);
  }
  return { inMin: Math.min(...inn), inSpan: Math.max(...inn) - Math.min(...inn) || 1, outMin: Math.min(...out), outSpan: Math.max(...out) - Math.min(...out) || 1 };
}

/** Hands this step's object paths to the actors; new objects start where the runner made them. */
function feedActors(f, prev, hold) {
  for (const o of f.objs) { const a = actors.get(o.id); if (a) a.o = o; }
  for (const [id, path] of Object.entries(f.paths || {})) {
    let a = actors.get(+id);
    if (!a) {
      const kept = path[0][2] === 'born' ? 'M' : path[0][2] === 'spit' ? prev.belly : null;   // Made and destroyed in one step: it still has to be seen.
      const o = f.objs.find(q => q.id === +id) || (kept && { id: +id, t: kept, dir: prev.dir });
      if (!o) continue;
      const kind = path[0][2];
      a = makeActor(o);
      a.x = kind === 'spit' ? prev.x + prev.dir * 0.4 : path[0][0];
      a.y = kind === 'spit' ? prev.y : path[0][1];
      a.grow = kind === 'spit' ? 0.25 : 0.55;
      actors.set(+id, a);
    }
    a.wait = Math.max(a.wait, f.charge && f.charge.id === +id ? hold + dropSeconds(f) : hold);
    a.queue.push(...path);
  }
}

function beginFrame() {
  const f = state.result.frames[state.frameIndex], prev = state.result.frames[state.frameIndex - 1];
  state.phase = 0;
  const w = state.world.w, s = view.cell;
  const rx = px(prev.x + 0.5), ry = py(prev.y + 0.5), hy = py(prev.y) - s * 0.35;
  const skill = f.echoOf || f.firedSkill;
  let changed = 0, wetChanged = 0, cooled = 0;
  for (let i = 0; i < f.cells.length; i++) {
    if (f.cells[i] === 'o' && prev.cells[i] === '&') cooled++;
    if (f.wet[i] !== prev.wet[i]) wetChanged++;
    else if (f.cells[i] !== prev.cells[i] && prev.cells[i] !== '*') changed++;
  }
  const { hold, move } = timeStep(f, prev, changed, wetChanged);
  const drinking = f.mouth === 'gulp' && f.belly === 'W';
  const sinking = Object.values(f.paths || {}).some(path => path.some(q => q[2] === 'sink' || q[2] === 'born'));
  state.flood = wetChanged && sinking ? floodOf(f, prev) : null;
  state.rise = null;
  feedActors(f, prev, hold);
  const flight = hold * 0.5, drop = dropSeconds(f), opens = new Map(), blast = f.bolt ? flight : hold + drop;
  state.swapAt = f.blasts ? blast : hold;
  const hitAt = x => hold + drop + chargeSeconds(Math.abs(x - f.charge.from));
  const byBull = y => !!f.charge && y === f.charge.y;

  if (f.firedAt) {
    const card = SKILLS[f.firedSkill];
    state.burned[f.firedAt] = performance.now();
    const said = NOTE_TEXT[f.note] || (f.echoOf ? `${card.zh}·${SKILLS[f.echoOf].zh}` : card.zh);
    const bad = f.note && !'gulp spit star lever stomp'.includes(f.note);
    fx.floats.push({ x: rx, y: hy, text: f.echoOf && NOTE_TEXT[f.note] ? `回响·${said}` : said, color: bad ? '#ff8b8b' : card.color, life: 1 });
    fx.rings.push({ x: rx, y: ry, r0: s * 0.3, r1: s * 0.9, life: 1, color: card.color, width: 4, decay: 3.4 });
    burst(rx, ry, card.color, 10);
    if (f.echoOf) for (let i = 1; i <= 3; i++) fx.rings.push({ x: rx, y: ry, r0: s * 0.2, r1: s * (0.8 + i * 0.5), life: 1 + i * 0.25, color: SKILLS.echo.color, width: 3, decay: 2.6 });
  }
  if (f.bolt) {
    anim.recoil = 1;
    startFlame(f.bolt, hold * 0.8);
    const last = f.bolt[f.bolt.length - 1], [ex, ey] = rayEnd(last);
    if (f.cells === prev.cells && !f.blasts) later(flight, () => burst(ex, ey, '#ff8a3d', 10));
  }
  if (f.firedAt && skill === 'flip') fx.flash = { color: '224,95,176', life: 1, power: 0.28 };
  if (f.firedAt && skill === 'decoy') { anim.squash = 0.8; later(hold * 0.5, () => dust(rx, ry + s * 0.3, 12)); }

  // Wood burns outward from where the flame landed; a bull just splinters it. Stars and brittle floor wait for the runner.
  const fireEnd = f.bolt ? f.bolt[f.bolt.length - 1] : f.blasts ? f.blasts[0] : null;
  for (let i = 0; i < f.cells.length; i++) {
    if (f.cells[i] === prev.cells[i]) continue;
    const cx = i % w, cy = (i - cx) / w;
    if (prev.cells[i] === '=') {
      if (byBull(cy)) {
        fx.ghosts.push({ x: cx, y: cy, t: hitAt(cx), wood: true, color: ['#b07a4c', '#7d5730'] });
        opens.set(i, hitAt(cx));
      } else if (fireEnd) {
        const from = f.bolt ? [fireEnd[2], fireEnd[3]] : fireEnd, starts = flight + Math.hypot(cx - from[0], cy - from[1]) * 0.06;
        fx.burns.push({ x: cx, y: cy, t: -starts, dur: 0.6 });
        opens.set(i, starts + 0.42);   // Water stands on wood until the wood under it has burned through.
      } else later(hold + 0.08, () => chunks(cx, cy, ['#b07a4c', '#7d5730'], 10));
    }
    if (prev.cells[i] === '%') {
      const gone = byBull(cy) ? hitAt(cx) : f.blasts ? blast : hold + move * 0.5;
      fx.ghosts.push({ x: cx, y: cy, t: gone, color: ['#c0a584', '#8d7a60'] });
      opens.set(i, gone);
    }
    if (prev.cells[i] === 'x') {
      later(blast, () => chunks(cx, cy, ['#4a566c', '#2f384a'], 12));
      opens.set(i, blast);
    }
    if (prev.cells[i] === '*') {
      const sx = px(cx + 0.5), sy = py(cy + 0.5);
      state.keepStar = [cx, cy];
      later(hold + move * 0.72, () => {
        state.keepStar = null;
        fx.floats.push({ x: sx, y: sy - s * 0.5, text: '★', color: '#f5c542', life: 1 });
        burst(sx, sy, '#ffe07a', 22, 1.2);
        fx.rings.push({ x: sx, y: sy, r0: 4, r1: s * 0.9, life: 1, color: '#ffe07a', width: 3, decay: 3 });
      });
    }
  }
  if (f.blasts) f.blasts.forEach(([bx, by], i) => later(blast + i * 0.08, () => explosion(bx, by)));
  if (f.charge) {
    const { from, y } = f.charge, a = actors.get(f.charge.id);
    later(Math.max(0.04, hold + drop - 0.3), () => {
      if (a) fx.floats.push({ x: px(from + 0.5), y: py(y) - 4, text: '！', color: '#ffb03a', life: 1 });
      dust(px(from + 0.5), py(y + 1), 8);
    });
  }

  // Objects that left the world this step.
  const crush = (a, x, y) => later(hold + move * 0.85, () => {
    if (a) { a.squash = 1.2; a.dying = 0.12; }
    anim.squash = 1;
    for (let q = 0; q < 22; q++) spawn({ x: px(x + 0.5), y: py(y + 0.8), vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 240, g: GRAVITY * s * 0.5, decay: 1.4, size: 3 + Math.random() * 4, color: '#7fe07a' });
  });
  const smash = (a, t, x, y) => {
    const when = hitAt(x);
    if (a) a.dying = when;
    later(when, () => { chunks(x, y, t === 'M' ? ['#a9b2c2', '#6c7486'] : ['#b07a4c', '#7d5730'], 14); fx.shake = Math.max(fx.shake, 3); });
  };
  const spatOut = f.mouth === 'spit';
  if (f.charge) for (const [id, path] of Object.entries(f.paths || {})) {
    const a = actors.get(+id), [x, y] = path[path.length - 1];
    if (a && +id !== f.charge.id && !f.objs.some(q => q.id === +id)) smash(a, a.o.t, x, y);
  }
  if (f.note === 'stomp' && prev.belly === 'E') crush(actors.get(+Object.keys(f.paths)[0]), f.x, f.y);
  /** Where a thing that left the world ran into lava, if that is what happened to it. */
  const burnt = o => {
    const path = (f.paths || {})[o.id], end = path ? path[path.length - 1] : [o.x, o.y];
    return prev.cells[end[1] * w + end[0]] === '&' ? end : null;
  };
  for (const o of prev.objs) {
    if (f.objs.some(q => q.id === o.id)) continue;
    const a = actors.get(o.id);
    if (f.mouth === 'gulp') {
      anim.mouth = 1;
      actors.delete(o.id);
      fx.sucks.push({ t: o.t, x: a ? a.x : o.x, y: a ? a.y : o.y, tx: prev.x, ty: prev.y, life: 1, rate: 1 / (hold * 0.9), dir: prev.dir });
    } else if (f.note === 'stomp') {
      crush(a, o.x, o.y);
    } else if (f.blasts) {
      if (a) a.dying = blast;
    } else if (burnt(o)) {
      const [lx, ly] = burnt(o), when = hold + drop + (f.charge && f.charge.id === o.id ? chargeSeconds(Math.abs(lx - f.charge.from)) : 0.2);
      if (a) a.dying = when;
      later(when, () => {
        burst(px(lx + 0.5), py(ly + 0.3), '#ffb347', 18);
        for (let q = 0; q < 12; q++) spawn({ x: px(lx + Math.random()), y: py(ly + 0.2), vy: -60 - Math.random() * 90, vx: (Math.random() - 0.5) * 50, decay: 1.3, size: 6 + Math.random() * 8, color: '#3a3f4a', puff: true });
      });
    } else if (a && a.o.t === 'U') {
      a.dying = hold + 0.35;
    } else if (f.charge) {
      smash(a, o.t, o.x, o.y);
    } else {
      if (a) a.dying = flight;
      later(flight, () => { burst(px(o.x + 0.5), py(o.y + 0.5), o.t === 'E' ? '#7fe07a' : '#d9a56b', 16); for (let q = 0; q < 10; q++) spawn({ x: px(o.x + 0.5), y: py(o.y + 0.5), vy: -80 - Math.random() * 100, vx: (Math.random() - 0.5) * 60, decay: 2, size: s * 0.2, flame: true }); });
    }
  }
  if (f.mouth || spatOut) later(hold * 0.1, () => { anim.mouth = 1; });
  if (spatOut) {
    anim.recoil = 0.7;
    const sx = rx + prev.dir * s, sy = ry;
    later(hold * 0.6, () => { fx.rings.push({ x: sx, y: sy, r0: s * 0.2, r1: s * 0.8, life: 1, color: '#ffd27a', width: 4, decay: 3 }); burst(sx, sy, '#ffd27a', 10); });
    if (prev.belly === 'W') for (let q = 0; q < 26; q++) later(Math.random() * hold, () => spawn({ x: rx + prev.dir * s * 0.3, y: ry, vx: prev.dir * (220 + Math.random() * 260), vy: -60 - Math.random() * 180, g: GRAVITY * s * 0.5, decay: 1.2, size: 3 + Math.random() * 3, color: '#9fdcff' }));
  }
  if (f.note === 'lever') later(hold + move * 0.6, () => {
    fx.floats.push({ x: px(f.x + 0.5), y: py(f.y), text: '红蓝互换', color: '#d46be0', life: 1 });
    burst(px(f.x + 0.5), py(f.y + 0.5), '#f2a5fb', 12);
  });
  if (f.teleported && f.via) {
    later(hold + move * 0.42, () => {
      burst(px(f.via[0] + 0.5), py(f.via[1] + 0.5), '#7fe6ff', 18);
      fx.rings.push({ x: px(f.via[0] + 0.5), y: py(f.via[1] + 0.5), r0: s * 0.6, r1: 3, life: 1, color: '#7fe6ff', width: 4, decay: 3 });
    });
    later(hold + move * 0.6, () => {
      burst(px(f.x + 0.5), py(f.y + 0.5), '#7fe6ff', 18);
      fx.rings.push({ x: px(f.x + 0.5), y: py(f.y + 0.5), r0: 3, r1: s * 0.8, life: 1, color: '#7fe6ff', width: 4, decay: 3 });
    });
  }
  // Take-off, landing, and little scuffs.
  if (f.arc > 0 && !prev.arc) { anim.squash = 0.6; later(hold, () => dust(rx, py(prev.y + 1) - 2, 7)); }
  if (f.landed) later(hold + move * 0.9, () => {
    const under = (f.y + f.g) * w + f.x, power = Math.min(1, 0.45 + state.fallRun * 0.14);
    anim.squash = power;
    if (f.wet[under] === '1') { anim.dipV = 5 + power * 5; splash(px(f.x + 0.5), py(f.g > 0 ? f.y + 1 : f.y), 12); }
    else dust(px(f.x + 0.5), py(f.y + (f.g > 0 ? 1 : 0)), 8);
  });
  if (f.bumped) later(hold + move * 0.5, () => burst(rx + prev.dir * s * 0.42, ry, '#c9d2e0', 5, 0.6));
  if ((wetChanged || cooled) && !state.flood) startFluid(f, prev, opens, hold, drinking);
  renderDock();
}

function endFrame() {
  const over = Math.min(0.05, state.frameT - state.stepSeconds);   // Time spent waiting for water to settle belongs to that step alone.
  state.frameIndex++;
  if (state.frameIndex < state.result.frames.length) {
    beginFrame();
    state.frameT = over;
    return;
  }
  {
    state.frameIndex = state.result.frames.length - 1;
    state.phase = 1;
    state.mode = 'outcome';
    state.outcomeT = 0;
    const f = state.result.frames[state.frameIndex], o = state.result.outcome;
    if (o === 'win') confetti(px(f.x + 0.5), py(f.y));
    else if (o === 'loop' || o === 'timeout' || o === 'fell') fx.floats.push({ x: px(f.x + 0.5), y: py(f.y) - 8, text: '?', color: '#c9d2e0', life: 1 });
    else {
      fx.shake = Math.max(fx.shake, o === 'blast' ? 16 : 10);
      fx.flash = { color: '255,70,70', life: 1, power: 0.3 };
      if (o === 'laser' || o === 'lava') for (let q = 0; q < 20; q++) spawn({ x: px(f.x + 0.5), y: py(f.y + 0.5), vy: -60 - Math.random() * 80, vx: (Math.random() - 0.5) * 60, decay: 1.2, size: 6, color: '#3a3f4a', puff: true });
    }
    renderDock();
  }
}

function finishRun() {
  state.mode = 'done';
  const r = state.result, level = state.level, best = BEST[level.id];
  if (r.outcome === 'win' && state.demo) {
    showBanner('win', '这就是最优解', `${best.cost} 气全星通关。自己再做一遍才算数`, '清空重来', () => clearCards(), r.stars);
  } else if (r.outcome === 'win') {
    state.stars[level.id] = Math.max(state.stars[level.id] || 0, r.stars);
    const route = usedSkills(state.plan).join('+') || 'none';
    const routes = state.routes[level.id] = state.routes[level.id] || [];
    if (!routes.includes(route)) routes.push(route);
    saveProgress();
    renderLevels();
    renderFound();
    const last = state.index === LEVELS.length - 1, used = spent();
    const text = `用了 ${used} 气` + (r.stars < 3 ? '，还有星星没拿到' : used <= best.cost ? '，这就是最优解！' : `，全星最优是 ${best.cost} 气`);
    showBanner('win', '通关！', text, last ? '回到第一关' : '下一关', () => loadLevel(last ? 0 : state.index + 1), r.stars);
  } else {
    showBanner('lose', OUTCOME_TEXT[r.outcome], '卡都还在，改完再跑', '继续改卡', () => toPlan());
  }
  renderDock();
}

/** Lays the proven best plan on the map, so that every level can be checked at a click. Undo brings the player's cards back. */
function showBest() {
  const best = BEST[state.level.id];
  closeIntro();
  toPlan();
  state.history.push({ plan: state.plan, open: state.open, loadout: state.loadout.slice() });
  state.loadout = usedSkills(best.plan);
  state.loadouts[state.level.id] = state.loadout;
  state.lastLoadout = state.loadout;
  setPlan(clonePlan(best.plan), null);
  state.demo = true;
  renderSlots();
  renderLibrary();
  renderDock();
  showDrawer(false);
  toast(`全星最优解：${best.cost} 气。按运行看它怎么走，撤销可还原`, true);
}

// ---------- DOM ----------

function renderLevels() {
  const nav = $('#levels');
  nav.innerHTML = '';
  LEVELS.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'lv' + (i === state.index ? ' on' : '') + (l.hard ? ' hard' : '');
    b.title = l.title + (l.hard ? '（复杂关）' : '');
    b.innerHTML = `${i + 1}<span class="st">${starMarkup(state.stars[l.id] || 0)}</span>`;
    b.onclick = () => loadLevel(i);
    nav.appendChild(b);
  });
  const total = Object.values(state.stars).reduce((sum, n) => sum + n, 0);
  $('#totalStars').textContent = `★ ${total} / ${LEVELS.length * 3}`;
}

function renderFound() {
  const n = (state.routes[state.level.id] || []).length, known = KNOWN_ROUTES[state.level.id];
  $('#found').textContent = n ? `已发现 ${n} 种卡组，至少有 ${Math.max(n, known)} 种` : `至少有 ${known} 种卡组能通关`;
  $('#bestInfo').textContent = `全星最优 ${BEST[state.level.id].cost} 气`;
}

function renderSlots() {
  if (!state.loadout.includes(state.selected)) state.selected = null;   // Undo and the best plan can swap the loadout out from under a selection.
  const box = $('#slots');
  box.innerHTML = '';
  for (let i = 0; i < state.level.slots; i++) {
    const id = state.loadout[i];
    const el = document.createElement('div');
    if (!id) {
      el.className = 'slot empty';
      el.innerHTML = '<b>+</b><span>装备技能</span>';
      el.onclick = () => showDrawer(true);
      box.appendChild(el);
      continue;
    }
    const s = SKILLS[id];
    el.className = 'slot';
    el.dataset.skill = id;
    el.style.setProperty('--c', s.color);
    el.innerHTML = `<div class="band"><b class="count"></b><div class="pips">${'<i></i>'.repeat(s.cost)}</div></div>
      <div class="art">${svgIcon(id, s.color)}</div><div class="name">${s.zh}</div><button class="drop" title="卸下">×</button>`;
    el.title = s.desc;
    el.addEventListener('pointerdown', e => {
      if (e.target.classList.contains('drop')) return;
      startSlotDrag(e, id, el);
    });
    el.querySelector('.drop').onclick = () => toggleEquip(id);
    box.appendChild(el);
  }
}

function renderLibrary() {
  $('#equipCount').textContent = `已装备 ${state.loadout.length} / ${state.level.slots}`;
  const box = $('#library');
  box.innerHTML = '';
  for (const id of SKILL_IDS) {
    const s = SKILLS[id];
    const b = document.createElement('button');
    b.className = 'skill-row' + (state.loadout.includes(id) ? ' on' : '') + (state.level.intro && state.level.intro.tryIt.includes(id) ? ' try' : '');
    b.style.setProperty('--c', s.color);
    b.innerHTML = `${svgIcon(id, s.color)}<div class="t"><b>${s.zh}</b><small>${s.name}</small><p>${s.desc}</p></div><div class="pips">${'<i></i>'.repeat(s.cost)}</div>`;
    b.onclick = () => toggleEquip(id);
    box.appendChild(b);
  }
}

function renderDock() {
  const planning = state.mode === 'plan';
  const total = state.level.qi, left = remaining();
  const counts = {};
  Object.values(state.plan.cards).forEach(k => { counts[k] = (counts[k] || 0) + 1; });
  if (state.plan.portals.length || state.open) counts.portal = state.plan.portals.length + (state.open ? 1 : 0);
  document.querySelectorAll('.slot[data-skill]').forEach(el => {
    const id = el.dataset.skill;
    el.classList.toggle('off', SKILLS[id].cost > left && !(id === 'portal' && state.open));
    el.classList.toggle('sel', state.selected === id);
    el.querySelector('.count').textContent = counts[id] ? '×' + counts[id] : '';
  });

  $('#qiValue').textContent = `${left} / ${total}`;
  const colored = Object.keys(state.plan.cards).flatMap(k => Array(SKILLS[state.plan.cards[k]].cost).fill(SKILLS[state.plan.cards[k]].color))
    .concat(Array(SKILLS.portal.cost * (state.plan.portals.length + (state.open ? 1 : 0))).fill(SKILLS.portal.color));
  $('#qiPips').innerHTML = Array.from({ length: total }, (_, i) => `<i style="${colored[i] ? `background:${colored[i]}` : ''}"></i>`).join('');
  $('#qiNote').textContent = state.open ? '还差一个门的出口' : '放下卡时扣气，撤回就退气';

  const run = $('#run');
  const running = state.mode === 'run' || state.mode === 'outcome';
  run.textContent = running ? '■ 停止' : state.mode === 'done' ? '▶ 再跑一次' : '▶ 运行';
  run.classList.toggle('stop', running);
  $('#undo').disabled = !state.history.length;
  $('#clear').disabled = !spent();
  document.querySelectorAll('#speed button[data-s]').forEach(b => b.classList.toggle('on', +b.dataset.s === state.speed));
  $('#pathBtn').classList.toggle('on', state.showPath);

  const f = state.result ? state.result.frames[state.frameIndex] : null;
  $('#stepText').textContent = planning ? '规划中' : `第 ${state.frameIndex} 步`;
  $('#starText').innerHTML = f ? `<b>★ ${f.stars}</b>` : '';
  $('#bellyText').textContent = f && f.belly ? `嘴里：${BELLY_TEXT[f.belly]}` : '';
}

function showBanner(kind, title, text, label, action, stars = 0) {
  $('#bStars').innerHTML = kind === 'win' ? starMarkup(stars) : '';
  $('#bTitle').textContent = title;
  $('#bText').textContent = text;
  $('#bBtn').textContent = label;
  $('#bBtn').onclick = action;
  $('#banner').className = 'show ' + kind;
}
function hideBanner() { $('#banner').className = ''; }

let toastTimer = 0;
function clearToast() { clearTimeout(toastTimer); $('#toast').classList.remove('show'); }
function toast(text, info = false) {
  const el = $('#toast');
  el.textContent = text;
  el.className = 'show' + (info ? ' info' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, info ? 2600 : 1700);
}

// ---------- Drag and click ----------

function ghostAt(x, y) { $('#ghost').style.transform = `translate(${x - 28}px, ${y - 28}px) rotate(-4deg)`; }

function beginDrag(e, skill, from) {
  closeIntro();
  drag = { skill, from, startX: e.clientX, startY: e.clientY, moved: false };
  const g = $('#ghost');
  g.style.background = SKILLS[skill].color;
  g.innerHTML = svgIcon(skill, '#fff');
  ghostAt(e.clientX, e.clientY);
}

function startSlotDrag(e, skill, el) {
  e.preventDefault();
  const pairing = skill === 'portal' && state.open;
  if (SKILLS[skill].cost > remaining() && !pairing) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    toast(`气不够：${SKILLS[skill].zh}要 ${SKILLS[skill].cost} 气，只剩 ${remaining()} 气`);
    return;
  }
  beginDrag(e, skill, null);
}

/** Returns { x, y } for a grid cell, null off the stage, or { x: -1 } on the stage but outside the grid. */
function cellFromPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return null;
  const x = Math.floor((clientX - r.left - view.ox) / view.cell), y = Math.floor((clientY - r.top - view.oy) / view.cell);
  return x >= 0 && y >= 0 && x < state.world.w && y < state.world.h ? { x, y } : { x: -1, y: -1 };
}

window.addEventListener('pointermove', e => {
  const c = cellFromPoint(e.clientX, e.clientY);
  state.hover = c && c.x >= 0 ? c : null;
  if (state.hover) {
    const k = cellKey(c.x, c.y);
    canvas.style.cursor = occupied(k) ? 'grab' : state.selected && canPlaceAt(state.level, state.world, c.x, c.y) ? 'copy' : 'default';
  } else canvas.style.cursor = 'default';
  showTip(e);
  if (!drag) return;
  canvas.style.cursor = 'grabbing';
  if (!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > 6) {
    drag.moved = true;
    $('#ghost').style.display = 'flex';
  }
  ghostAt(e.clientX, e.clientY);
});

window.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag;
  drag = null;
  $('#ghost').style.display = 'none';
  const c = cellFromPoint(e.clientX, e.clientY);
  if (!d.moved) {
    if (d.from !== null) removeAt(d.from);
    else { state.selected = state.selected === d.skill ? null : d.skill; renderDock(); }
    return;
  }
  if (c === null) { if (d.from !== null) removeAt(d.from); return; }
  if (c.x < 0) return;
  placeCard(c.x, c.y, d.skill, d.from);
});

window.addEventListener('pointercancel', () => { drag = null; $('#ghost').style.display = 'none'; });

const running = () => state.mode === 'run' || state.mode === 'outcome';

canvas.addEventListener('pointerdown', e => {
  const c = cellFromPoint(e.clientX, e.clientY);
  if (e.button !== 0 || !c || c.x < 0 || running() || state.intro) return;
  const k = cellKey(c.x, c.y);
  if (state.plan.cards[k] !== undefined) { e.preventDefault(); beginDrag(e, state.plan.cards[k], k); return; }
  if (portalAt(state.plan, k) >= 0 || state.open === k) { e.preventDefault(); beginDrag(e, 'portal', k); return; }
  if (state.selected) placeCard(c.x, c.y, state.selected);
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const c = cellFromPoint(e.clientX, e.clientY);
  if (c && c.x >= 0 && !running() && occupied(cellKey(c.x, c.y))) removeAt(cellKey(c.x, c.y));
});

/** Names whatever is under the pointer: with this many machines the legend alone is not enough. */
function describeCell(x, y) {
  const f = state.preview.frames[0], i = y * state.world.w + x;
  const o = f.objs.find(q => q.x === x && q.y === y);
  if (o && OBJ_TIPS[o.t]) return OBJ_TIPS[o.t];
  if (f.wet[i] === '1') return '水：往低处流，落进哪个坑就先填满哪个坑，满了才漫出去。水面能踩，箱子会浮，替身会沉。站在岸边或水面上用吞吐，能把这片水喝光。';
  return TIPS[f.cells[i]] || '';
}

function showTip(e) {
  const tip = $('#tip'), text = state.hover && !drag && state.mode === 'plan' ? describeCell(state.hover.x, state.hover.y) : '';
  tip.classList.toggle('show', !!text);
  if (!text) return;
  tip.textContent = text;
  const r = $('#wrap').getBoundingClientRect();
  const x = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8), y = Math.max(8, e.clientY - r.top - tip.offsetHeight - 10);
  tip.style.transform = `translate(${x}px, ${y}px)`;
}

// A focused button would also take the Space that starts a run.
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });

$('#run').onclick = () => (state.mode === 'run' || state.mode === 'outcome' ? toPlan() : startRun());
$('#undo').onclick = undo;
$('#clear').onclick = clearCards;
$('#openLib').onclick = () => showDrawer(true);
$('#bestBtn').onclick = showBest;
$('#inGo').onclick = closeIntro;
$('#helpBtn').onclick = () => {
  if (!state.level.intro) return;
  toPlan();
  if (state.intro) closeIntro(); else openIntro();
};
$('#closeDrawer').onclick = () => showDrawer(false);
$('#pathBtn').onclick = () => { state.showPath = !state.showPath; renderDock(); };
document.querySelectorAll('#speed button[data-s]').forEach(b => { b.onclick = () => { state.speed = +b.dataset.s; renderDock(); }; });

window.addEventListener('keydown', e => {
  if (state.intro) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); closeIntro(); }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (e.key === 'Enter' && state.mode === 'done' && state.result.outcome === 'win') $('#bBtn').click();
    else $('#run').click();
  } else if (e.key === 'Escape') {
    state.selected = null;
    showDrawer(false);
    renderDock();
  } else if (/^[1-4]$/.test(e.key)) {
    const id = state.loadout[+e.key - 1];
    if (id) { state.selected = state.selected === id ? null : id; renderDock(); }
  }
});

// ---------- World drawing ----------

const px = x => view.ox + x * view.cell;
const py = y => view.oy + y * view.cell;

function layout() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  view.w = r.width;
  view.h = r.height;
  const { w, h } = state.world;
  view.cell = Math.max(8, Math.floor(Math.min(58, (r.width - 16) / w, (r.height - 40) / h)));
  view.ox = Math.round((r.width - view.cell * w) / 2);
  view.oy = Math.round((r.height - 18 - view.cell * h) / 2);
}

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, r)); }
function hexAlpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
const hash = (x, y) => (((x + 3) * 73856093) ^ ((y + 7) * 19349663)) >>> 0;
const mix = (a, b, t) => a + (b - a) * t;

const sprites = {};
/** A soft round glow, painted once per colour so that hundreds of particles stay cheap. */
function glowSprite(color) {
  if (sprites[color]) return sprites[color];
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, hexAlpha(color, 1));
  r.addColorStop(0.35, hexAlpha(color, 0.5));
  r.addColorStop(1, hexAlpha(color, 0));
  g.fillStyle = r;
  g.fillRect(0, 0, 64, 64);
  sprites[color] = c;
  return c;
}
function drawGlow(x, y, r, color, alpha = 1) {
  ctx.globalAlpha = clamp01(alpha);
  ctx.drawImage(glowSprite(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

function drawIcon(skill, x, y, size, color, width = 2.4) {
  ctx.save();
  ctx.translate(x - size / 2, y - size / 2);
  ctx.scale(size / 24, size / 24);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke(ICON_PATHS[skill]);
  ctx.restore();
}

const isTerrain = c => '#%=xo'.includes(c) || LASER_CHARS.includes(c);
const chr = (fr, x, y) => (x < 0 || y < 0 || x >= state.world.w || y >= state.world.h ? '#' : fr.cells[y * state.world.w + x]);
const floorSide = (fr, x, y) => (isTerrain(chr(fr, x, y + 1)) ? 1 : isTerrain(chr(fr, x, y - 1)) ? -1 : 1);

function drawBackdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, view.h);
  g.addColorStop(0, '#1c2536');
  g.addColorStop(1, '#0e1219');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -20, view.w + 40, view.h + 40);
  const { w, h } = state.world, s = view.cell;
  const room = ctx.createRadialGradient(view.w / 2, view.h * 0.42, s, view.w / 2, view.h * 0.42, Math.max(view.w, view.h) * 0.62);
  room.addColorStop(0, '#2a3550');
  room.addColorStop(1, '#141a26');
  ctx.fillStyle = room;
  ctx.fillRect(px(0), py(0), w * s, h * s);
  ctx.fillStyle = 'rgba(255,255,255,.035)';
  for (let y = 0; y <= h; y++) for (let x = 0; x <= w; x++) ctx.fillRect(px(x) - 1, py(y) - 1, 2, 2);
}

function drawStone(x, y, fr) {
  const s = view.cell, l = px(x), t = py(y), h = hash(x, y);
  ctx.fillStyle = ['#2d3648', '#303a4e', '#2a3343', '#333e53'][h % 4];
  ctx.fillRect(l, t, s, s);
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(l, t + Math.floor(s / 2), s, 1);
  ctx.fillRect(l + s * (y % 2 ? 0.28 : 0.72), t, 1, s / 2);
  ctx.fillRect(l + s * (y % 2 ? 0.72 : 0.28), t + s / 2, 1, s / 2);
  ctx.fillStyle = 'rgba(255,255,255,.04)';
  ctx.fillRect(l + (h >> 3) % (s - 4), t + (h >> 7) % (s - 4), 3, 2);
  if (!isTerrain(chr(fr, x, y - 1))) {
    ctx.fillStyle = '#6d7b95';
    ctx.fillRect(l, t, s, 2);
    ctx.fillStyle = '#4a566c';
    ctx.fillRect(l, t + 2, s, 3);
  }
  if (!isTerrain(chr(fr, x, y + 1))) { ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(l, t + s - 4, s, 4); }
  if (!isTerrain(chr(fr, x - 1, y))) { ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(l, t, 2, s); }
  if (!isTerrain(chr(fr, x + 1, y))) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(l + s - 2, t, 2, s); }
}

function drawWoodTile(x, y, char = 0) {
  const s = view.cell, l = px(x), t = py(y);
  ctx.fillStyle = char ? `rgb(${mix(109, 30, char)},${mix(74, 20, char)},${mix(44, 16, char)})` : '#6d4a2c';
  ctx.fillRect(l, t, s, s);
  const plank = char ? `rgb(${mix(176, 44, char)},${mix(122, 28, char)},${mix(76, 20, char)})` : '#b07a4c';
  ctx.fillStyle = plank;
  for (let k = 0; k < 3; k++) ctx.fillRect(l + 1, t + 1 + k * s / 3, s - 2, s / 3 - 2);
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.fillRect(l + s * (x % 2 ? 0.3 : 0.65), t + 1, 2, s / 3 - 2);
  ctx.fillRect(l + s * (x % 2 ? 0.7 : 0.25), t + 1 + s / 3, 2, s / 3 - 2);
  ctx.fillRect(l + s * (x % 2 ? 0.45 : 0.8), t + 1 + 2 * s / 3, 2, s / 3 - 2);
}

function drawBrittle(x, y, trembling = false, now = 0) {
  const s = view.cell, l = px(x) + (trembling ? Math.sin(now / 24 + x) * 1.4 : 0), t = py(y) + (trembling ? 1.5 : 0);
  ctx.fillStyle = '#c0a584';
  ctx.fillRect(l + 1, t + 1, s - 2, s - 2);
  ctx.fillStyle = '#d6bf9f';
  ctx.fillRect(l + 1, t + 1, s - 2, 3);
  ctx.strokeStyle = '#5b4a34';
  ctx.lineWidth = trembling ? 2.2 : 1.6;
  ctx.beginPath();
  const a = x * 7 % 3 / 10, b = (x * 5 + y) % 3 / 10;
  ctx.moveTo(l + s * (0.15 + a), t + 1);
  ctx.lineTo(l + s * (0.42 + b), t + s * 0.36);
  ctx.lineTo(l + s * (0.3 + a), t + s * 0.62);
  ctx.lineTo(l + s * (0.58 + b), t + s - 1);
  ctx.moveTo(l + s * (0.42 + b), t + s * 0.36);
  ctx.lineTo(l + s - 2, t + s * (0.24 + a));
  ctx.stroke();
}

function drawLava(x, y, fr, now) {
  const s = view.cell, l = px(x), t = py(y), h = hash(x, y), top = chr(fr, x, y - 1) !== '&';
  const skin = top ? t + s * 0.14 : t;
  const wave = q => skin + (top ? Math.sin(now / 620 + (x + q) * 2.4) * s * 0.035 : 0);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(l, t + s);
  ctx.lineTo(l + s, t + s);
  for (let q = 1; q >= 0; q -= 0.125) ctx.lineTo(l + s * q, wave(q));
  ctx.closePath();
  const heat = ctx.createLinearGradient(0, t, 0, t + s);
  heat.addColorStop(0, top ? '#ffc23a' : '#f4641c');
  heat.addColorStop(0.42, '#f4641c');
  heat.addColorStop(1, '#a92a10');
  ctx.fillStyle = heat;
  ctx.fill();
  ctx.clip();
  // Dark skin that forms on the surface and drifts, slower than anything else in the game.
  ctx.fillStyle = 'rgba(92,24,8,.5)';
  for (let k = 0; k < 3; k++) {
    const speed = 170 + ((h >> k) & 7) * 40, q = ((now / speed + (h >> (k * 3)) % 97) * 0.05) % 1.4 - 0.2;
    ctx.beginPath();
    ctx.ellipse(l + s * q, t + s * (0.3 + k * 0.24), s * (0.2 - k * 0.03), s * 0.06, 0, 0, 7);
    ctx.fill();
  }
  if (top) {
    ctx.strokeStyle = 'rgba(255,236,160,.9)';
    ctx.lineWidth = Math.max(1.5, s * 0.035);
    ctx.beginPath();
    for (let q = 0; q <= 1; q += 0.125) ctx.lineTo(l + s * q, wave(q) + 1);
    ctx.stroke();
    const phase = (now / 1500 + (h % 100) / 100) % 1, bx = l + s * (0.2 + ((h >> 5) % 60) / 100);
    if (phase < 0.8) {
      ctx.fillStyle = 'rgba(255,214,110,.85)';
      ctx.beginPath();
      ctx.arc(bx, wave(0.5) + s * 0.08, s * 0.1 * phase, 0, 7);
      ctx.fill();
    }
  }
  ctx.restore();
  if (top) {
    drawGlow(l + s / 2, t + s * 0.2, s * 0.8, '#ff7a1a', 0.3);
    if (state.mode !== 'plan' && Math.random() < 0.012) spawn({ x: l + Math.random() * s, y: skin, vx: (Math.random() - 0.5) * 18, vy: -24 - Math.random() * 40, decay: 0.9, size: 1.6 + Math.random() * 1.6, color: '#ffb347', add: true });
  }
}

/** Rock that was lava a moment ago: black, and still glowing in the cracks. While water is still reaching it, the lava shows through. */
function drawCooled(x, y, fr, now) {
  const s = view.cell, l = px(x), t = py(y), h = hash(x, y), i = y * state.world.w + x;
  const k = fluid.on && fluid.busy && fluid.crust[i] >= 0 ? fluid.crust[i] : 1;
  if (k < 1) drawLava(x, y, fr, now);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.fillStyle = ['#27252c', '#2b2830', '#242228'][h % 3];
  ctx.fillRect(l, t, s, s);
  ctx.fillStyle = '#5a5560';
  if (!isTerrain(chr(fr, x, y - 1))) ctx.fillRect(l, t, s, 3);
  ctx.strokeStyle = `rgba(255,120,50,${0.4 + Math.sin(now / 700 + h) * 0.14})`;
  ctx.lineWidth = Math.max(1, s * 0.025);
  ctx.beginPath();
  const a = 0.2 + ((h >> 2) % 30) / 100, b = 0.3 + ((h >> 6) % 40) / 100;
  ctx.moveTo(l + s * a, t + 2);
  ctx.lineTo(l + s * (a + 0.16), t + s * b);
  ctx.lineTo(l + s * (a - 0.04), t + s * 0.68);
  ctx.lineTo(l + s * (a + 0.2), t + s);
  ctx.moveTo(l + s * (a + 0.16), t + s * b);
  ctx.lineTo(l + s * 0.96, t + s * (b + 0.14));
  ctx.stroke();
  ctx.restore();
}

function drawCracked(x, y, fr, now) {
  drawStone(x, y, fr);
  const s = view.cell, l = px(x), t = py(y), glow = 0.55 + Math.sin(now / 500 + x + y) * 0.2;
  ctx.strokeStyle = `rgba(255,160,70,${glow})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(l + s * 0.5, t);
  ctx.lineTo(l + s * 0.38, t + s * 0.3);
  ctx.lineTo(l + s * 0.62, t + s * 0.52);
  ctx.lineTo(l + s * 0.42, t + s);
  ctx.moveTo(l + s * 0.38, t + s * 0.3);
  ctx.lineTo(l + s * 0.08, t + s * 0.42);
  ctx.moveTo(l + s * 0.62, t + s * 0.52);
  ctx.lineTo(l + s * 0.94, t + s * 0.66);
  ctx.stroke();
}

/** Red and blue are one idea: the same block, solid or a ghost. solid runs from 0 to 1 so that a swap materialises. */
function drawSwapBlock(c, x, y, solid, now) {
  const s = view.cell, l = px(x), t = py(y), color = c === 'R' ? '#ef6a55' : '#5b97ff', dark = c === 'R' ? '#8f2e22' : '#274f9e';
  if (solid < 0.98) {
    ctx.save();
    ctx.globalAlpha = 0.55 * (1 - solid);
    ctx.strokeStyle = color;
    ctx.setLineDash([4, 4]);
    ctx.lineDashOffset = -now / 80;
    ctx.lineWidth = 1.5;
    rrect(l + 3, t + 3, s - 6, s - 6, s * 0.12);
    ctx.stroke();
    ctx.restore();
  }
  if (solid <= 0.02) return;
  const q = s * (0.5 - 0.5 * solid) * 0.5;
  ctx.save();
  ctx.globalAlpha = clamp01(solid * 1.4);
  const g = ctx.createLinearGradient(0, t, 0, t + s);
  g.addColorStop(0, color);
  g.addColorStop(1, dark);
  ctx.fillStyle = g;
  rrect(l + 1 + q, t + 1 + q, s - 2 - q * 2, s - 2 - q * 2, s * 0.14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 2;
  rrect(l + s * 0.2 + q, t + s * 0.2 + q, s * 0.6 - q * 2, s * 0.6 - q * 2, s * 0.08);
  ctx.stroke();
  ctx.restore();
}

function drawEmitter(c, x, y, now) {
  const s = view.cell, l = px(x), t = py(y), [dx, dy] = EMITTERS[c];
  ctx.fillStyle = '#1b1f28';
  ctx.fillRect(l, t, s, s);
  const g = ctx.createLinearGradient(l, t, l + s, t + s);
  g.addColorStop(0, '#515a6c');
  g.addColorStop(1, '#2a303c');
  ctx.fillStyle = g;
  rrect(l + s * 0.1, t + s * 0.1, s * 0.8, s * 0.8, s * 0.12);
  ctx.fill();
  const cx = l + s * (0.5 + dx * 0.28), cy = t + s * (0.5 + dy * 0.28);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(cx, cy, s * 0.5, '#ff3b4e', 0.75 + Math.sin(now / 90) * 0.2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffd9dd';
  ctx.beginPath();
  ctx.arc(cx, cy, s * 0.1, 0, 7);
  ctx.fill();
}

function drawSpikes(x, y, side) {
  const s = view.cell, l = px(x), base = side > 0 ? py(y + 1) : py(y);
  for (let k = 0; k < 3; k++) {
    const bx = l + s * (0.2 + 0.3 * k);
    const g = ctx.createLinearGradient(0, base, 0, base - side * s * 0.66);
    g.addColorStop(0, '#6d7486');
    g.addColorStop(0.55, '#c9cede');
    g.addColorStop(1, '#ff5a5a');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(bx - s * 0.15, base);
    ctx.lineTo(bx, base - side * s * 0.66);
    ctx.lineTo(bx + s * 0.15, base);
    ctx.fill();
  }
}

function starPath(r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r;
    ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q);
  }
  ctx.closePath();
}

function drawStar(cx, cy, r, now) {
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(cx, cy, r * 2.4, '#f5c542', 0.45 + Math.sin(now / 400 + cx) * 0.12);
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(cx, cy + Math.sin(now / 360 + cx) * 2);
  ctx.rotate(Math.sin(now / 900 + cy) * 0.25);
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#fff2a8');
  g.addColorStop(1, '#f2b21c');
  ctx.fillStyle = g;
  starPath(r);
  ctx.fill();
  ctx.restore();
}

function drawDoor(x, y) {
  const s = view.cell, l = px(x), t = py(y), open = anim.door;
  const h = s * (1 - open);
  if (h < 1) { ctx.fillStyle = 'rgba(224,184,79,.14)'; ctx.fillRect(l + s * 0.28, t, s * 0.44, 3); return; }
  const g = ctx.createLinearGradient(l, 0, l + s, 0);
  g.addColorStop(0, '#a87f2c');
  g.addColorStop(0.5, '#f0cf6c');
  g.addColorStop(1, '#a87f2c');
  ctx.fillStyle = g;
  ctx.fillRect(l + s * 0.28, t, s * 0.44, h);
  ctx.fillStyle = 'rgba(90,60,10,.6)';
  for (let k = s / 4; k < h; k += s / 4) ctx.fillRect(l + s * 0.28, t + k, s * 0.44, 2);
}

function drawLever(x, y, side) {
  const s = view.cell, l = px(x), t = py(y), by = side > 0 ? t + s : t;
  ctx.fillStyle = '#5a6579';
  rrect(l + s * 0.28, side > 0 ? by - 6 : by, s * 0.44, 6, 2);
  ctx.fill();
  const tip = mix(-0.28, 0.28, anim.lever);   // A spring, so the handle overshoots and settles.
  ctx.strokeStyle = '#d46be0';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(l + s / 2, by - side * 5);
  ctx.lineTo(l + s / 2 + tip * s, by - side * s * 0.62);
  ctx.stroke();
  ctx.fillStyle = '#f2a5fb';
  ctx.beginPath();
  ctx.arc(l + s / 2 + tip * s, by - side * s * 0.64, s * 0.1, 0, 7);
  ctx.fill();
}

function drawFlag(x, y, side, now) {
  const s = view.cell, l = px(x), t = py(y), by = side > 0 ? t + s : t, dir = side > 0 ? -1 : 1;
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(l + s * 0.45, by + dir * s * 0.55, s * 0.7, '#5cc96b', 0.3);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#e8ecf2';
  ctx.fillRect(l + s * 0.66, Math.min(by, by + dir * s * 0.98), 3, s * 0.98);
  ctx.fillStyle = '#5cc96b';
  ctx.beginPath();
  const top = by + dir * s * 0.98;
  ctx.moveTo(l + s * 0.66, top);
  for (let i = 1; i <= 6; i++) ctx.lineTo(l + s * 0.66 - i * s * 0.09, top - dir * i * s * 0.035 + Math.sin(now / 150 + i) * s * 0.02);
  for (let i = 6; i >= 0; i--) ctx.lineTo(l + s * 0.66 - i * s * 0.09, top - dir * (s * 0.42 - i * s * 0.035) + Math.sin(now / 150 + i) * s * 0.02);
  ctx.fill();
}

function runnerStandsOn(x, y) {
  const f = state.result && state.result.frames[state.frameIndex];
  return !!f && f.x === x && f.y + f.g === y;
}

function drawCell(c, x, y, fr, now) {
  const s = view.cell, l = px(x), t = py(y), side = floorSide(fr, x, y);
  switch (c) {
    case '#': drawStone(x, y, fr); break;
    case '=': drawWoodTile(x, y); break;
    case '%': drawBrittle(x, y, runnerStandsOn(x, y), now); break;
    case 'x': drawCracked(x, y, fr, now); break;
    case '(': case ')': case 'A': case 'V': drawEmitter(c, x, y, now); break;
    case 'R': drawSwapBlock(c, x, y, 1 - clamp01(anim.lever), now); break;
    case 'N': drawSwapBlock(c, x, y, clamp01(anim.lever), now); break;
    case '^': drawSpikes(x, y, side); break;
    case '&': drawLava(x, y, fr, now); break;
    case 'o': drawCooled(x, y, fr, now); break;
    case '*': drawStar(l + s / 2, t + s / 2, s * 0.28, now); break;
    case '_': {
      const h = s * mix(0.17, 0.06, anim.door);
      ctx.fillStyle = '#7a6230';
      ctx.fillRect(l + s * 0.06, side > 0 ? t + s - 3 : t, s * 0.88, 3);
      ctx.fillStyle = '#ecc65a';
      ctx.fillRect(l + s * 0.14, side > 0 ? t + s - h - 3 : t + 3, s * 0.72, h);
      break;
    }
    case 'D': drawDoor(x, y); break;
    case 'L': drawLever(x, y, side); break;
    case 'F': drawFlag(x, y, side, now); break;
  }
}

function drawCrate(l, t, s) {
  const g = ctx.createLinearGradient(l, t, l, t + s);
  g.addColorStop(0, '#d9a56b');
  g.addColorStop(1, '#a9794a');
  ctx.fillStyle = g;
  rrect(l + 2, t + 2, s - 4, s - 4, 4);
  ctx.fill();
  ctx.strokeStyle = '#7d5730';
  ctx.lineWidth = Math.max(2, s * 0.07);
  ctx.beginPath();
  ctx.rect(l + s * 0.16, t + s * 0.16, s * 0.68, s * 0.68);
  ctx.moveTo(l + s * 0.16, t + s * 0.16);
  ctx.lineTo(l + s * 0.84, t + s * 0.84);
  ctx.moveTo(l + s * 0.84, t + s * 0.16);
  ctx.lineTo(l + s * 0.16, t + s * 0.84);
  ctx.stroke();
}

function drawBarrel(l, t, s, now) {
  const g = ctx.createLinearGradient(l, 0, l + s, 0);
  g.addColorStop(0, '#8c2f1e');
  g.addColorStop(0.5, '#e8603f');
  g.addColorStop(1, '#8c2f1e');
  ctx.fillStyle = g;
  rrect(l + s * 0.14, t + s * 0.08, s * 0.72, s * 0.86, s * 0.16);
  ctx.fill();
  ctx.fillStyle = '#3a2a22';
  ctx.fillRect(l + s * 0.14, t + s * 0.24, s * 0.72, s * 0.06);
  ctx.fillRect(l + s * 0.14, t + s * 0.72, s * 0.72, s * 0.06);
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath();
  ctx.moveTo(l + s / 2, t + s * 0.34);
  ctx.lineTo(l + s * 0.67, t + s * 0.66);
  ctx.lineTo(l + s * 0.33, t + s * 0.66);
  ctx.fill();
  ctx.fillStyle = '#3a2a22';
  ctx.fillRect(l + s * 0.48, t + s * 0.44, s * 0.04, s * 0.12);
  ctx.fillRect(l + s * 0.48, t + s * 0.59, s * 0.04, s * 0.04);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(l + s * 0.5, t + s * 0.1, s * 0.16, '#ffb03a', 0.5 + Math.sin(now / 70 + l) * 0.4);
  ctx.globalCompositeOperation = 'source-over';
}

/** A stone likeness of the runner: same build, eyes closed, with a little of the runner's own light still inside. */
function drawDecoy(l, t, s, g, dir, now) {
  const b = s * 0.72;
  ctx.save();
  ctx.translate(l + s / 2, t + s * (g > 0 ? 0.5 : 0.5));
  ctx.scale(dir || 1, g > 0 ? 1 : -1);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.47, b * 0.5, b * 0.075, 0, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#5a6276';
  rrect(-b * 0.4, b * 0.42, b * 0.34, b * 0.2, b * 0.08);
  ctx.fill();
  rrect(b * 0.06, b * 0.42, b * 0.34, b * 0.2, b * 0.08);
  ctx.fill();
  const stone = ctx.createLinearGradient(-b * 0.3, -b * 0.6, b * 0.25, b * 0.5);
  stone.addColorStop(0, '#e6e9f0');
  stone.addColorStop(0.45, '#b2b9c8');
  stone.addColorStop(1, '#727b90');
  ctx.fillStyle = stone;
  rrect(-b / 2, -b * 0.58, b, b * 1.06, b * 0.3);
  ctx.fill();
  ctx.save();
  ctx.clip();
  // Chisel marks and the wear of being stone.
  ctx.fillStyle = 'rgba(62,70,90,.16)';
  ctx.beginPath();
  ctx.moveTo(-b * 0.5, b * 0.18);
  ctx.lineTo(-b * 0.12, b * 0.5);
  ctx.lineTo(-b * 0.5, b * 0.5);
  ctx.moveTo(b * 0.5, -b * 0.14);
  ctx.lineTo(b * 0.5, b * 0.5);
  ctx.lineTo(b * 0.1, b * 0.5);
  ctx.fill();
  ctx.fillStyle = 'rgba(40,46,60,.28)';
  for (const [x, y, r] of [[-0.3, -0.2, 0.022], [-0.17, 0.12, 0.016], [0.28, 0.24, 0.02], [0.04, 0.3, 0.014], [-0.33, 0.3, 0.018], [0.34, -0.38, 0.014]]) {
    ctx.beginPath();
    ctx.arc(b * x, b * y, b * r, 0, 7);
    ctx.fill();
  }
  // Moss at the foot, on the side the weather reaches.
  ctx.fillStyle = 'rgba(112,158,92,.72)';
  for (const [x, y, r] of [[-0.42, 0.42, 0.12], [-0.26, 0.47, 0.1], [-0.12, 0.5, 0.075], [-0.46, 0.28, 0.07]]) {
    ctx.beginPath();
    ctx.arc(b * x, b * y, b * r, 0, 7);
    ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.lineWidth = Math.max(1.2, b * 0.03);
  ctx.beginPath();
  ctx.moveTo(-b * 0.34, -b * 0.47);
  ctx.quadraticCurveTo(-b * 0.1, -b * 0.53, b * 0.16, -b * 0.5);
  ctx.stroke();
  ctx.strokeStyle = '#495166';
  ctx.lineWidth = Math.max(1.4, b * 0.035);
  rrect(-b / 2, -b * 0.58, b, b * 1.06, b * 0.3);
  ctx.stroke();
  // A crack running in from the edge, with the light behind it.
  const glow = 0.72 + Math.sin(now / 520) * 0.18;
  const crack = () => {
    ctx.beginPath();
    ctx.moveTo(-b * 0.5, -b * 0.02);
    ctx.lineTo(-b * 0.33, b * 0.04);
    ctx.lineTo(-b * 0.27, -b * 0.05);
    ctx.lineTo(-b * 0.13, b * 0.03);
    ctx.moveTo(-b * 0.33, b * 0.04);
    ctx.lineTo(-b * 0.29, b * 0.17);
  };
  drawGlow(-b * 0.27, b * 0.03, b * 0.24, '#ffd76a', 0.34 * glow);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#4f5568';
  ctx.lineWidth = Math.max(1.6, b * 0.038);
  crack();
  ctx.stroke();
  ctx.strokeStyle = `rgba(255,219,120,${glow * 0.8})`;
  ctx.lineWidth = Math.max(0.8, b * 0.014);
  crack();
  ctx.stroke();
  // A carved, sleeping face, where the runner's would be.
  ctx.strokeStyle = '#3f4659';
  ctx.lineWidth = Math.max(1.5, b * 0.045);
  ctx.beginPath();
  ctx.arc(b * 0.2, -b * 0.26, b * 0.12, Math.PI * 0.12, Math.PI * 0.88);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(b * 0.14, -b * 0.03);
  ctx.quadraticCurveTo(b * 0.26, b * 0.04, b * 0.38, -b * 0.03);
  ctx.stroke();
  ctx.restore();
}

function drawSlime(l, t, s, g, now, x) {
  const wob = Math.sin(now / 260 + x) * 0.05, cy = g > 0 ? 0.66 : 0.34;
  ctx.save();
  ctx.translate(l + s / 2, t + s * cy);
  ctx.scale(1 + wob, 1 - wob);
  const f = ctx.createRadialGradient(-s * 0.1, -s * 0.1, 2, 0, 0, s * 0.42);
  f.addColorStop(0, '#b4f5a8');
  f.addColorStop(1, '#49b54c');
  ctx.fillStyle = f;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.4, s * 0.31, 0, 0, 7);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath();
  ctx.ellipse(-s * 0.14, -s * 0.14, s * 0.08, s * 0.05, -0.5, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#1d232e';
  ctx.beginPath();
  ctx.arc(-s * 0.12, 0, s * 0.055, 0, 7);
  ctx.arc(s * 0.12, 0, s * 0.055, 0, 7);
  ctx.fill();
  ctx.restore();
}

function drawBull(o, l, t, s, g, now) {
  const charging = state.mode === 'run' && anim.chargeId === o.id;
  ctx.save();
  ctx.translate(l + s / 2, t + s * 0.56);
  ctx.scale(o.dir, g > 0 ? 1 : -1);
  if (charging) ctx.rotate(0.12);
  else if (o.dazed) ctx.rotate(Math.sin(now / 120) * 0.05);
  const body = ctx.createLinearGradient(0, -s * 0.4, 0, s * 0.4);
  body.addColorStop(0, '#b56a4c');
  body.addColorStop(1, '#6e3626');
  ctx.fillStyle = body;
  rrect(-s * 0.46, -s * 0.24, s * 0.72, s * 0.56, s * 0.18);
  ctx.fill();
  ctx.fillStyle = '#5a2c1e';
  ctx.fillRect(-s * 0.36, s * 0.26, s * 0.14, s * 0.16);
  ctx.fillRect(-s * 0.02, s * 0.26, s * 0.14, s * 0.16);
  ctx.fillStyle = '#c47a58';
  rrect(s * 0.06, -s * 0.36, s * 0.4, s * 0.46, s * 0.14);
  ctx.fill();
  ctx.strokeStyle = '#f2e6c8';
  ctx.lineWidth = s * 0.075;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s * 0.14, -s * 0.34);
  ctx.quadraticCurveTo(s * 0.1, -s * 0.5, s * 0.26, -s * 0.5);
  ctx.moveTo(s * 0.36, -s * 0.34);
  ctx.quadraticCurveTo(s * 0.42, -s * 0.5, s * 0.52, -s * 0.44);
  ctx.stroke();
  if (o.dazed) {
    ctx.strokeStyle = '#2a1a14';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s * 0.2, -s * 0.2);
    ctx.lineTo(s * 0.32, -s * 0.1);
    ctx.moveTo(s * 0.32, -s * 0.2);
    ctx.lineTo(s * 0.2, -s * 0.1);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s * 0.27, -s * 0.15, s * 0.075, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#1d232e';
    ctx.beginPath();
    ctx.arc(s * 0.3, -s * 0.14, s * 0.04, 0, 7);
    ctx.fill();
    ctx.strokeStyle = '#3a1a10';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(s * 0.17, -s * 0.27);
    ctx.lineTo(s * 0.37, -s * 0.2);
    ctx.stroke();
  }
  ctx.fillStyle = '#e8a98d';
  rrect(s * 0.24, -s * 0.06, s * 0.24, s * 0.14, s * 0.06);
  ctx.fill();
  ctx.restore();
  if (o.dazed) {
    ctx.fillStyle = '#ffe07a';
    for (let i = 0; i < 3; i++) {
      const a = now / 260 + i * 2.1;
      ctx.save();
      ctx.translate(l + s / 2 + Math.cos(a) * s * 0.3, t - s * 0.02 + Math.sin(a) * s * 0.09);
      starPath(s * 0.08);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawObj(o, x, y, g, now) {
  const s = view.cell, l = px(x), t = py(y);
  if (o.t === 'B') drawCrate(l, t, s);
  else if (o.t === 'X') drawBarrel(l, t, s, now);
  else if (o.t === 'M') drawDecoy(l, t, s, g, o.dir, now);
  else if (o.t === 'E') drawSlime(l, t, s, g, now, x);
  else if (o.t === 'U') drawBull(o, l, t, s, g, now);
}

/** A row of chevrons showing what a bull can see, which is what it will charge. */
function drawSights(fr, now) {
  const s = view.cell;
  for (const [x0, x1, y] of fr.sights) {
    const dir = Math.sign(x1 - x0) || 1, n = Math.abs(x1 - x0);
    ctx.strokeStyle = 'rgba(255,190,90,.34)';
    ctx.lineWidth = 2;
    for (let i = 0; i < n * 2; i++) {
      const cx = px(x0 + 0.5 + dir * (0.7 + i / 2 + ((now / 900) % 0.5))), cy = py(y + 0.55);
      if (dir > 0 ? cx > px(x1 + 0.15) : cx < px(x1 + 0.85)) continue;
      ctx.beginPath();
      ctx.moveTo(cx - dir * s * 0.07, cy - s * 0.1);
      ctx.lineTo(cx + dir * s * 0.05, cy);
      ctx.lineTo(cx - dir * s * 0.07, cy + s * 0.1);
      ctx.stroke();
    }
  }
}

/** Water that arrives rises from the floor of its cell, deepest first; water that leaves sinks from the top, highest first. */
function drawWater(fr, prev, k, now) {
  const { w, h } = state.world, s = view.cell, fl = state.flood, g = fr.g;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    let on = fr.wet[i] === '1', was = prev.wet[i] === '1';
    if (!on && (fr.wet[i - 1] === '1' || fr.wet[i + 1] === '1' || fr.wet[i - fr.g * w] === '1') && fr.objs.some(o => o.t === 'M' && o.y * w + o.x === i)) on = was = true;   // Sunk: the water closes round it.
    if (!on && !(was && fl)) continue;
    if (fluid.on && fluid.moving[i]) {
      if (fluid.busy || !on) continue;
      ctx.globalAlpha = fluid.fade;
    } else ctx.globalAlpha = 1;
    let fill = 1;
    if (on !== was && fl) {
      const depth = y * g;
      if (on) fill = clamp01((k - (1 - (depth - fl.inMin) / fl.inSpan) * 0.62) / 0.38);
      else fill = 1 - clamp01((k - ((depth - fl.outMin) / fl.outSpan) * 0.62) / 0.38);
      if (fill <= 0) continue;
    }
    let depth = 0;
    for (let d = 1; d < 6; d++) { const q = y - g * d; if (q >= 0 && q < h && fr.wet[q * w + x] === '1') depth = d; else break; }
    const l = px(x), t = py(y), deep = depth / 5, height = s * fill, top = g > 0 ? t + s - height : t;
    // Where water stops on open floor it ends in a rounded lip: only a wall can hold it square.
    const over = y - g, surface = !(over >= 0 && over < h && (fr.wet[over * w + x] === '1'));
    const free = q => surface && !(fr.wet[i + q] === '1') && waterOpen({ ...fr, w, h }, x + q, y);
    const lipL = free(-1) ? s * 0.42 : 0, lipR = free(1) ? s * 0.42 : 0;
    ctx.fillStyle = `rgba(${mix(70, 24, deep)},${mix(170, 84, deep)},${mix(240, 170, deep)},${0.64 + deep * 0.2})`;
    if (lipL || lipR) {
      ctx.beginPath();
      ctx.roundRect(l, top, s, height, g > 0 ? [lipL, lipR, 0, 0] : [0, 0, lipR, lipL]);
      ctx.fill();
    } else ctx.fillRect(l, top, s, height);
    ctx.fillStyle = 'rgba(200,235,255,.05)';
    ctx.fillRect(l + ((now / 40 + x * 31 + y * 17) % s), top + height * 0.3, s * 0.3, 2);
    if (fill >= 1 && !surface) continue;
    const base = g > 0 ? top + 2 : top + height - 2;
    ctx.strokeStyle = 'rgba(215,242,255,.95)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let q = 0; q <= 8; q++) {
      const wx = l + lipL * 0.8 + (s - (lipL + lipR) * 0.8) * q / 8, wy = base + Math.sin(now / 300 + wx / 15) * 1.7;
      if (q) ctx.lineTo(wx, wy); else ctx.moveTo(wx, wy);
    }
    ctx.stroke();
  }
}

/** While a flood falls, a sheet of water hangs between where it left and where it lands. */
/** Rays stop at the near face of whatever they hit, or at the centre of a portal they go into. */
function rayEnd(seg) {
  const [x0, y0, x1, y1] = seg, dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0);
  const into = x1 >= 0 && y1 >= 0 && x1 < state.world.w && y1 < state.world.h && portalAt(state.plan, cellKey(x1, y1)) >= 0;
  return into ? [px(x1 + 0.5), py(y1 + 0.5)] : [px(x1 + 0.5 - dx * 0.5), py(y1 + 0.5 - dy * 0.5)];
}

function drawBeams(fr, now, dt) {
  const pulse = 0.8 + Math.sin(now / 70) * 0.2;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const seg of fr.beams) {
    const [ex, ey] = rayEnd(seg), sx = px(seg[0] + 0.5), sy = py(seg[1] + 0.5);
    for (const [width, color, alpha] of [[view.cell * 0.26, '#ff2a3d', 0.14], [view.cell * 0.12, '#ff3b4e', 0.4], [2, '#ffe3e6', 1]]) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha * pulse;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawGlow(ex, ey, view.cell * 0.34, '#ff5a6a', pulse);
    if (Math.random() < dt * 22) spawn({ x: ex, y: ey, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160, size: 2, color: '#ffb0b8', add: true, decay: 3.2, g: 200 });
  }
  ctx.globalCompositeOperation = 'source-over';
}

/** Shows which plate works which door, since nothing else on the map says so. */
function drawPlateLinks(fr) {
  if (state.mode !== 'plan') return;
  const { w } = state.world, plates = [], doors = [];
  for (let i = 0; i < fr.cells.length; i++) {
    if (fr.cells[i] === '_') plates.push(i);
    if (fr.cells[i] === 'D') doors.push(i);
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(224,184,79,.3)';
  ctx.setLineDash([2, 6]);
  ctx.lineWidth = 2;
  const at = i => [i % w, Math.floor(i / w)];
  for (const a of plates) {
    const [ax, ay] = at(a);
    const near = doors.map(at).sort((p, q) => Math.hypot(p[0] - ax, p[1] - ay) - Math.hypot(q[0] - ax, q[1] - ay))[0];
    if (!near) continue;
    ctx.beginPath();
    ctx.moveTo(px(ax + 0.5), py(ay + 0.5));
    ctx.lineTo(px(near[0] + 0.5), py(near[1] + 0.5));
    ctx.stroke();
  }
  ctx.restore();
}

function drawCard(skill, x, y, now, burnedAt, hovered, cold) {
  if (burnedAt) return;
  const s = view.cell, color = SKILLS[skill].color, bob = Math.sin(now / 420 + x * 1.3 + y) * 1.2;
  const l = px(x) + s * 0.12, t = py(y) + s * 0.12 + bob, b = s * 0.76;
  ctx.save();
  ctx.globalAlpha = cold ? 0.5 : 0.96;
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;
  const g = ctx.createLinearGradient(0, t, 0, t + b);
  g.addColorStop(0, hexAlpha(color, 1));
  g.addColorStop(1, `rgba(0,0,0,.25)`);
  ctx.fillStyle = color;
  rrect(l, t, b, b, s * 0.15);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = g;
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  rrect(l + 3, t + 2, b - 6, b * 0.3, s * 0.1);
  ctx.fill();
  drawIcon(skill, l + b / 2, t + b / 2, s * 0.54, '#fff');
  ctx.restore();
  if (hovered) {
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.beginPath();
    ctx.arc(px(x) + s - 7, py(y) + 7, 7, 0, 7);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px(x) + s - 10, py(y) + 4);
    ctx.lineTo(px(x) + s - 4, py(y) + 10);
    ctx.moveTo(px(x) + s - 4, py(y) + 4);
    ctx.lineTo(px(x) + s - 10, py(y) + 10);
    ctx.stroke();
  }
}

function drawPortalEnd(k, color, now, lone) {
  const [x, y] = parseKey(k), s = view.cell, cx = px(x + 0.5), cy = py(y + 0.5);
  ctx.fillStyle = 'rgba(8,12,20,.72)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, s * 0.29, s * 0.41, 0, 0, 7);
  ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(cx, cy, s * 0.7, color, 0.5);
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.setLineDash(lone ? [6, 5] : []);
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.3, s * 0.42, 0, 0, 7);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const a = now / 240 + i * 2.09;
    ctx.strokeStyle = hexAlpha(color, 0.75);
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.18, s * 0.28, 0, a, a + 1.2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCards(now) {
  const planning = state.mode === 'plan';
  for (const [k, skill] of Object.entries(state.plan.cards)) {
    const [x, y] = parseKey(k);
    const hovered = planning && !drag && state.hover && state.hover.x === x && state.hover.y === y;
    if (drag && drag.moved && drag.from === k) continue;
    drawCard(skill, x, y, now, state.burned[k], hovered, planning && !state.reached.has(k));
    if (planning && chr(state.preview.frames[0], x, y) === '*') drawStar(px(x) + view.cell * 0.2, py(y + 1) - view.cell * 0.2, view.cell * 0.13, now);
  }
  state.plan.portals.forEach(([a, b], i) => {
    const color = PORTAL_COLORS[i % PORTAL_COLORS.length];
    drawPortalEnd(a, color, now, false);
    drawPortalEnd(b, color, now, false);
    if (planning) {
      const [ax, ay] = parseKey(a), [bx, by] = parseKey(b);
      ctx.save();
      ctx.strokeStyle = hexAlpha(color, 0.35);
      ctx.setLineDash([3, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px(ax + 0.5), py(ay + 0.5));
      ctx.lineTo(px(bx + 0.5), py(by + 0.5));
      ctx.stroke();
      ctx.restore();
    }
  });
  if (state.open) drawPortalEnd(state.open, PORTAL_COLORS[state.plan.portals.length % 2], now, true);
}

/** Where the runner's feet are during a step, k from 0 to 1, in cells. The run and the dotted preview share this curve. */
function stepPoint(prev, f, k) {
  const feet = q => q.y + (q.g > 0 ? 0.62 : 0.38);
  if (f.teleported) return [f.x + 0.5, feet(f)];
  const y0 = feet(prev), d = feet(f) - y0, x = prev.x + 0.5 + (f.x - prev.x) * k;
  const half = (1 + k) / 2;
  switch (f.arc) {
    case 2: return [x, y0 + d * 2 * (1 - (1 - k / 2) ** 2)];            // A slime's throw is one parabola over four steps.
    case 1: return [x, prev.arc === 2 ? y0 - d + d * 2 * (1 - (1 - half) ** 2) : y0 + d * (1 - (1 - k) ** 2)];
    case -2: return [x, y0 + d * 2 * (k / 2) ** 2];
    case -1: return [x, prev.arc === -2 ? y0 - d + d * 2 * half * half : y0 + d * k * k];
  }
  return [x, y0 + d * (f.how === 'fall' && prev.how !== 'fall' ? k * k : k)];
}

function drawPath() {
  if (state.mode !== 'plan' || !state.showPath || !state.preview) return;
  const frames = state.preview.frames, s = view.cell;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.38)';
  ctx.lineWidth = 2;
  ctx.setLineDash([2, 7]);
  ctx.lineCap = 'round';
  ctx.beginPath();
  frames.forEach((f, i) => {
    if (i === 0) { const [x, y] = stepPoint(f, f, 1); ctx.moveTo(px(x), py(y)); return; }
    const n = f.arc ? 6 : 1;
    for (let q = 1; q <= n; q++) {
      const [x, y] = stepPoint(frames[i - 1], f, q / n);
      if (f.teleported) {
        ctx.lineTo(px(f.via[0] + 0.5), py(f.via[1] + 0.62));
        ctx.moveTo(px(x), py(y));
      } else ctx.lineTo(px(x), py(y));
    }
  });
  ctx.stroke();
  ctx.restore();
  const last = frames[frames.length - 1], [ex, ey] = stepPoint(last, last, 1);
  const win = state.preview.outcome === 'win', color = win ? '#43d873' : '#ff5a5a';
  const y = Math.max(py(0) + 8, Math.min(py(state.world.h) - 8, py(ey)));
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(px(ex), y, s * 0.42, color, 0.8);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(px(ex), y, Math.max(6, s * 0.13), 0, 7);
  ctx.fill();
}

/** Says what a gulp on this cell would do, as things stand when the runner gets there, and lights up what it would take. */
function drawGulpHint(x, y) {
  const frames = state.preview.frames, fr = frames.find(f => f.x === x && f.y === y) || frames[0], { w, h } = state.world, s = view.cell, ax = x + fr.dir, below = y + fr.g;
  const wetCell = (cx, cy) => cx >= 0 && cy >= 0 && cx < w && cy < h && fr.wet[cy * w + cx] === '1';
  const thing = fr.objs.find(o => o.x === ax && o.y === y), names = { B: '箱子', X: '炸药桶', M: '替身', E: '史莱姆' };
  const touch = [[ax, y], [ax, below], [x, below], [x, y], [x - fr.dir, below], [x - fr.dir, y]].find(([cx, cy]) => wetCell(cx, cy));
  const lit = [];
  let text = '这里够不着东西';
  if (fr.belly) text = '吐到正前方';
  else if (thing) {
    text = thing.t === 'U' ? '蛮牛太大，吞不下' : `吞下${names[thing.t]}`;
    lit.push([ax, y]);
  } else if (touch) {
    text = '喝光这片水';
    const open = [touch], seen = new Set();
    while (open.length) {
      const [cx, cy] = open.pop(), k = cy * w + cx;
      if (seen.has(k) || !wetCell(cx, cy)) continue;
      seen.add(k);
      lit.push([cx, cy]);
      open.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
    }
  }
  ctx.save();
  ctx.fillStyle = 'rgba(240,160,48,.32)';
  for (const [cx, cy] of lit) ctx.fillRect(px(cx), py(cy), s, s);
  ctx.font = `600 ${Math.max(12, s * 0.26)}px -apple-system, "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  const tw = ctx.measureText(text).width, tx = Math.max(view.ox + tw / 2 + 12, Math.min(view.ox + w * s - tw / 2 - 12, px(x + 0.5))), ty = py(y) - s * 0.3;
  ctx.fillStyle = 'rgba(16,20,28,.88)';
  rrect(tx - tw / 2 - 8, ty - s * 0.26, tw + 16, s * 0.42, 6);
  ctx.fill();
  ctx.fillStyle = lit.length || fr.belly ? '#ffd27a' : '#c9d2e0';
  ctx.fillText(text, tx, ty + s * 0.03);
  ctx.restore();
}

function drawDropTarget() {
  const skill = drag && drag.moved ? drag.skill : state.selected;
  if (!skill || !state.hover) return;
  const { x, y } = state.hover, s = view.cell, color = SKILLS[skill].color;
  const ok = canPlaceAt(state.level, state.world, x, y);
  ctx.save();
  ctx.strokeStyle = ok ? color : '#e05555';
  ctx.lineWidth = 3;
  rrect(px(x) + 3, py(y) + 3, s - 6, s - 6, 7);
  ctx.stroke();
  ctx.fillStyle = hexAlpha(ok ? color : '#e05555', 0.28);
  ctx.fill();
  ctx.restore();
  if (skill === 'gulp' && ok) drawGulpHint(x, y);
  if (skill === 'portal' && state.open) {
    const [ox, oy] = parseKey(state.open);
    ctx.save();
    ctx.strokeStyle = 'rgba(49,199,232,.5)';
    ctx.setLineDash([4, 6]);
    ctx.lineWidth = 2;
    ctx.strokeRect(px(ox - PORTAL_RANGE), py(oy - PORTAL_RANGE), s * (PORTAL_RANGE * 2 + 1), s * (PORTAL_RANGE * 2 + 1));
    ctx.restore();
  }
}

const onWater = f => f.wet[(f.y + f.g) * state.world.w + f.x] === '1';

/** While droplets are still filling a basin, the runner rises exactly as fast as the surface under it. */
function rising(f, prev) {
  if (f.how !== 'float' || state.mode !== 'run' || !fluid.busy) return null;
  const foot = 0.38 * f.g, low = prev.y + 0.5 + f.g * 0.12, high = f.y + 0.5 + f.g * 0.12;
  const top = poolTop(f.x + 0.5, prev.y + 0.5);
  if (state.rise === null) state.rise = low;
  if (top !== null) {
    const most = 5 * state.lastSdt, y = state.rise + Math.max(-most, Math.min(most, top - foot - state.rise));
    state.rise = (y - high) * f.g < 0 ? high : y;
  }
  return [f.x + 0.5, state.rise];
}

function runnerPose(now, kr) {
  const start = state.preview.frames[0];
  if (state.mode === 'plan') {
    const [x, y] = stepPoint(start, start, 1);
    return { x, y: y + (onWater(start) ? Math.sin(now / 300) * 0.03 : 0), dir: start.dir, color: '#ffe36e', alpha: 1, rot: 0, belly: null, sx: 1, sy: 1, scale: 1, walk: 0, f: start };
  }
  const frames = state.result.frames, f = frames[state.frameIndex], prev = frames[state.frameIndex - 1] || f;
  const moving = state.mode === 'run' ? kr : 1;
  const [x, y] = rising(f, prev) ?? stepPoint(prev, f, moving);
  const sip = state.mode === 'run' && f.sip && state.frameT < state.holdSeconds ? Math.sign(f.sip[0] - prev.x) : 0;   // It turns to whichever side the water is.
  const walking = state.mode === 'run' && !f.arc && f.how === 'walk';
  const pose = { x, y, dir: sip || (moving > 0.5 ? f.dir : prev.dir), color: '#ffe36e', alpha: 1, rot: walking ? prev.dir * 0.06 : 0, belly: moving > 0.3 ? f.belly : prev.belly, sx: 1, sy: 1, scale: 1, walk: state.frameIndex + moving, f };
  if (walking) pose.y -= Math.abs(Math.sin(moving * Math.PI)) * 0.05;
  if (f.teleported && state.mode === 'run') {
    const feet = q => q + (f.g > 0 ? 0.62 : 0.38);
    if (moving < 0.42) {
      const q = moving / 0.42;
      pose.x = mix(prev.x + 0.5, f.via[0] + 0.5, q);
      pose.y = mix(feet(prev.y), feet(f.via[1]), q);
      pose.scale = 1 - q * q * 0.9;
      pose.rot = q * 2.4 * prev.dir;
    } else if (moving < 0.6) pose.alpha = 0;
    else { const q = (moving - 0.6) / 0.4; pose.scale = 0.1 + q * 0.9; pose.rot = (1 - q) * -2.4 * f.dir; }
  }
  if (f.bumped && state.mode === 'run') { pose.x += prev.dir * 0.14 * Math.sin(moving * Math.PI); pose.sx = 1 - 0.18 * Math.sin(moving * Math.PI); }
  if (f.arc > 0) { pose.sx = 0.86; pose.sy = 1.16; }
  else if (f.arc < 0) { pose.sx = 0.94; pose.sy = 1.08; }
  else if (f.how === 'fall') { pose.sy = 1 + Math.min(0.24, state.fallRun * 0.05); pose.sx = 1 - Math.min(0.14, state.fallRun * 0.03); }
  pose.x -= anim.recoil * 0.12 * pose.dir;
  if (onWater(f) || f.how === 'float') pose.y += Math.sin(now / 300 + f.x) * 0.03 + anim.dip * 0.16 * f.g;
  const squash = anim.squash * 0.3;
  pose.sx *= 1 + squash;
  pose.sy *= 1 - squash;
  if (state.mode === 'outcome' || state.mode === 'done') {
    const o = state.mode === 'done' ? 1 : clamp01(state.outcomeT);
    pose.walk = 0;
    switch (state.result.outcome) {
      case 'lava': pose.color = '#ff8a3a'; pose.y += 0.55 * o * f.g; pose.alpha = 1 - o * o; break;
      case 'spike': case 'slime': pose.color = '#ff7a6a'; pose.rot = 1.4 * f.dir * o; break;
      case 'laser': pose.color = o > 0.5 ? '#40302a' : '#ff7a6a'; pose.sy *= 1 - 0.3 * o; break;
      case 'bull': pose.color = '#ff7a6a'; pose.rot = 8 * o * f.dir; pose.y -= 2.4 * Math.sin(o * Math.PI); break;
      case 'blast': pose.alpha = 0; break;
      case 'fell': pose.alpha = 1 - o; break;
      case 'win': pose.y -= 0.5 * 4 * ((o * 2) % 1) * (1 - (o * 2) % 1); break;
      default: pose.color = '#a8a690';
    }
  }
  return pose;
}

function drawRunner(p, now, sdt) {
  if (p.alpha <= 0) return;
  anim.face += (p.dir - anim.face) * (1 - Math.exp(-sdt * 18));   // Turning round is a quick pivot, not a jump cut.
  const dir = anim.face >= 0 ? 1 : -1, s = view.cell * (p.belly ? 0.74 : 0.66);
  ctx.save();
  ctx.globalAlpha = p.alpha;
  ctx.translate(px(p.x), py(p.y));
  ctx.rotate(p.rot);
  ctx.scale(p.sx * p.scale * Math.max(0.35, Math.abs(anim.face)), p.sy * p.scale * anim.flip);
  const step = Math.sin(p.walk * Math.PI);
  ctx.fillStyle = '#c98f14';
  rrect(-s * 0.34 + step * s * 0.08, s * 0.3, s * 0.26, s * 0.12, 3);
  ctx.fill();
  rrect(s * 0.08 - step * s * 0.08, s * 0.3, s * 0.26, s * 0.12, 3);
  ctx.fill();
  const body = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.4);
  body.addColorStop(0, p.color);
  body.addColorStop(1, p.color === '#ffe36e' ? '#efae19' : '#7a4a3a');
  ctx.fillStyle = body;
  rrect(-s / 2, -s * 0.62, s, s, s * 0.3);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  rrect(-s * 0.36, -s * 0.56, s * 0.6, s * 0.16, s * 0.08);
  ctx.fill();
  if (p.belly) {
    ctx.fillStyle = { B: '#a8784a', M: '#8a93a8', E: '#4fae4a', X: '#d9502f', W: '#3a94e0' }[p.belly];
    rrect(-s * 0.32, -s * 0.28, s * 0.46, s * 0.46, s * 0.12);
    ctx.fill();
  }
  const blink = Math.sin(now / 1700 + 1) > 0.985;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(dir * s * 0.2, -s * 0.34, s * 0.14, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#1d232e';
  if (blink) ctx.fillRect(dir * s * 0.2 - s * 0.12, -s * 0.35, s * 0.24, 2);
  else {
    ctx.beginPath();
    ctx.arc(dir * s * 0.25, -s * 0.33, s * 0.075, 0, 7);
    ctx.fill();
  }
  const open = Math.max(anim.mouth, state.mode === 'run' ? Math.abs(Math.sin(p.walk * 1.6)) * 0.2 : 0);
  const mw = s * 0.32, mh = s * (0.06 + 0.32 * open), mx = dir > 0 ? s * 0.18 : -s * 0.18 - mw;
  ctx.fillStyle = '#6e2a12';
  rrect(mx, -s * 0.09 - mh / 2, mw, mh, s * 0.05);
  ctx.fill();
  if (open > 0.4) {
    ctx.fillStyle = '#ff7f6a';
    rrect(mx + s * 0.04, -s * 0.09 + mh * 0.1, mw - s * 0.08, mh * 0.3, 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---------- Loose things: they follow the rules a moment behind, under gravity ----------

function makeActor(o) {
  return { id: o.id, o, x: o.x, y: o.y, vx: 0, vy: 0, queue: [], wait: 0, hop: 0, hopV: 0, dip: 0, dipV: 0, squash: 0, tilt: 0, grow: 1, dying: null };
}

function resetActors(fr) {
  actors.clear();
  for (const o of fr.objs) actors.set(o.id, makeActor(o));
}

function land(a, fr) {
  const v = Math.abs(a.vy), s = view.cell, g = fr.g, under = (Math.round(a.y) + g) * state.world.w + Math.round(a.x);
  a.vy = 0;
  if (v < 1.5) return;
  const power = clamp01(v / 16), footY = py(Math.round(a.y) + (g > 0 ? 1 : 0)), footX = px(a.x + 0.5);
  if (fr.wet[under] === '1') {
    a.dipV = v * 0.5;
    splash(footX, footY, 10 + power * 14);
    return;
  }
  a.squash = 0.35 + power * 0.65;
  a.hopV = -v * 0.17;
  a.hop = -0.001;
  dust(footX, footY, 6 + power * 8);
  if (a.o.t === 'M' || a.o.t === 'U' || power > 0.5) fx.shake = Math.max(fx.shake, 2 + power * 5);
}

function advanceLeg(a, dt, fr) {
  const [tx, ty, kind] = a.queue[0];
  if (kind === 'born') { a.queue.shift(); return dt; }
  if (kind === 'portal') {
    a.x = tx;
    a.y = ty;
    a.grow = 0.2;
    a.queue.shift();
    burst(px(tx + 0.5), py(ty + 0.5), '#7fe6ff', 14);
    return dt;
  }
  let speed = 1 / WALK_SECONDS;
  if (kind === 'fall') {
    a.vy += GRAVITY * dt;
    speed = a.vy;
    a.tilt = Math.max(-0.18, Math.min(0.18, a.tilt + (a.id % 2 ? 1 : -1) * dt * 0.8));
  } else if (kind === 'sink') {
    a.vy += (3.2 - a.vy) * Math.min(1, dt * 12);   // Water brakes a falling stone hard.
    speed = a.vy;
    if (Math.random() < dt * 24) spawn({ x: px(a.x + 0.2 + Math.random() * 0.6), y: py(a.y + 0.3), vy: -40 - Math.random() * 40, vx: (Math.random() - 0.5) * 16, decay: 1.4, size: 3, color: '#cfeeff' });
  } else if (kind === 'float') speed = 5;
  else if (kind === 'spit') speed = 7;
  else if (kind === 'charge') {
    a.vx = Math.min(24, a.vx + 130 * dt);
    speed = a.vx;
    a.tilt = 0;
    if (Math.random() < dt * 40) dust(px(a.x + 0.5), py(a.y + 1), 2);
  }
  const dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy), go = speed * dt;
